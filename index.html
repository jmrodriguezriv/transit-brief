const CACHE_MAX_ENTRIES = 120;
const STALE_AFTER = { weather: 6 * HOUR, visibility: 6 * HOUR, wave: 12 * HOUR,
                      tide: 36 * HOUR, current: 36 * HOUR };

function cacheRead() { return Store.get(CACHE_KEY, {}); }

function cacheWrite(key, pack) {
  const c = cacheRead();
  // Trim the payload: full float precision is meaningless here and costs space.
  c[key] = {
    retrieved: pack.retrieved, source: pack.source, issued: pack.issued || null,
    series: pack.series.map(r => {
      const o = {};
      for (const [k, v] of Object.entries(r))
        o[k] = typeof v === 'number' && k !== 't' ? Math.round(v * 100) / 100 : v;
      return o;
    })
  };
  const keys = Object.keys(c);
  if (keys.length > CACHE_MAX_ENTRIES) {
    keys.sort((a, b) => (c[a].retrieved || 0) - (c[b].retrieved || 0));
    for (const k of keys.slice(0, keys.length - CACHE_MAX_ENTRIES)) delete c[k];
  }
  try { Store.set(CACHE_KEY, c); } catch (e) { /* quota — drop it rather than crash */ }
}

/** Does the cached series still cover the window we need? */
function cacheCovers(entry, win) {
  if (!entry || !entry.series || !entry.series.length) return false;
  return entry.series[0].t <= win.start && entry.series[entry.series.length - 1].t >= win.end;
}

function withCache(provider, kind) {
  return {
    kind, quality: provider.quality, label: provider.label,
    async load(stationId, win, node, gauge) {
      const key = kind + '|' + stationId + '|' + (node && node.id ? node.id : '');
      try {
        const fresh = await provider.load(stationId, win, node, gauge);
        if (fresh && fresh.quality !== 'MOCK') cacheWrite(key, fresh);
        return fresh;
      } catch (err) {
        const entry = cacheRead()[key];
        if (!cacheCovers(entry, win)) throw err;
        return {
          series: entry.series, issued: entry.issued, retrieved: entry.retrieved,
          source: entry.source, quality: 'CACHED',
          ageMs: Date.now() - entry.retrieved,
          stale: (Date.now() - entry.retrieved) > (STALE_AFTER[kind] || 12 * HOUR),
          reason: String(err.message || err)
        };
      }
    }
  };
}

const CACHED_LIVE = {
  tide: withCache(CoopsTide, 'tide'), current: withCache(CoopsCurrent, 'current'),
  weather: withCache(NWSWeather, 'weather'), wave: withCache(OpenMeteoWave, 'wave'),
  visibility: withCache(OpenMeteoVisibility, 'visibility'),
  currentObs: CoopsCurrentObs   // never cached: an old observation is worthless
};
MOCK_PROVIDERS.currentObs = mockProvider('current');
MOCK_PROVIDERS.visibility = mockProvider('visibility');

function providers() {
  return Store.get('liveData', false) ? CACHED_LIVE : MOCK_PROVIDERS;
}

/* Resolve which source key each node uses for each kind, then fetch each
   unique key once. In live mode the forecast kinds key off the node's own
   position, so a waypoint gets the forecast for where it actually is. */
function planFetches(route, live) {
  const need = { tide: new Map(), current: new Map(), weather: new Map(),
                 wave: new Map(), visibility: new Map() };
  const assign = {};
  const gaps = [];
  for (const p of route) {
    assign[p.id] = {};
    for (const k of ['tide', 'current', 'weather', 'wave', 'visibility']) {
      const zoneKey = k === 'visibility'
        ? (p.stations ? p.stations.weather : null)   // visibility follows the weather zone
        : (p.stations ? p.stations[k] : null);
      if (!zoneKey) { assign[p.id][k] = null; if (k !== 'visibility') gaps.push({ kind: k, point: p.name }); continue; }
      // Tide and current are physically tied to a gauge; never key them off position.
      const perNode = live && (k === 'weather' || k === 'wave' || k === 'visibility');
      const key = perNode ? forecastKey(p, k) : zoneKey;
      assign[p.id][k] = key;
      if (!need[k].has(key)) need[k].set(key, { zoneKey, node: p });
    }
  }
  return { need, assign, gaps };
}

async function loadEnvironment(route, win) {
  const live = Store.get('liveData', false);
  const P = providers();
  const { need, assign, gaps } = planFetches(route, live);
  // Tide and current come from the gauge chain, not per-node stations.
  need.tide.clear(); need.current.clear();
  const data = { tide: {}, current: {}, weather: {}, wave: {}, visibility: {} };
  const sources = [];

  const jobs = [];
  for (const kind of Object.keys(need))
    for (const [key, { zoneKey, node }] of need[kind])
      jobs.push({ kind, key, zoneKey, node });

  await Promise.all(jobs.map(async job => {
    const label = (STATIONS[job.zoneKey] || {}).name || job.zoneKey;
    const where = job.key.includes(':') ? `${label} @ ${job.node.name}` : label;
    try {
      const r = await P[job.kind].load(job.zoneKey, win, job.node);
      data[job.kind][job.key] = r;
      sources.push({ station: job.key, kind: job.kind, name: where, ...r,
                     series: undefined, count: r.series.length });
    } catch (e) {
      data[job.kind][job.key] = null;
      sources.push({ station: job.key, kind: job.kind, name: where,
                     error: String(e.message || e), quality: 'FAILED' });
    }
  }));

  // ---- gauge chain: tide and current, interpolated between gauges ----
  const gauges = gaugeChain();
  const gaugeData = { tide: {}, current: {} };
  /* A gauge that simply does not publish a product is not a failure. Listing
     those as FAILED buried the one row that had actually broken, so a station
     without an id for a product is skipped silently — the coverage picture is
     in Setup, and the brief already reports waypoints beyond the gauges. */
  await Promise.all(gauges.flatMap(g => ['tide', 'current'].map(async kind => {
    const configured = live ? g[kind] : true;
    if (!configured) return;
    try {
      const r = await P[kind].load(g.id, win, g, g);
      gaugeData[kind][g.id] = r;
      sources.push({ station: g.id, kind, name: g.name + ' — ' + kind, ...r,
                     series: undefined, count: r.series.length });
    } catch (e) {
      const msg = String(e.message || e);
      sources.push({ station: g.id, kind, name: g.name + ' — ' + kind,
                     error: /No data was found/i.test(msg)
                       ? 'station not reporting'
                       : msg,
                     quality: 'FAILED' });
    }
  })));

  // Propagation lag between consecutive gauges, estimated once per brief.
  const lags = { tide: {}, current: {} };
  for (const kind of ['tide', 'current']) {
    const field = kind === 'tide' ? 'heightFt' : 'signedKts';
    const have = gauges.filter(g => gaugeData[kind][g.id]);
    for (let i = 0; i < have.length - 1; i++) {
      const a = have[i], b = have[i + 1];
      lags[kind][a.id + '>' + b.id] =
        estimateLag(gaugeData[kind][a.id].series, gaugeData[kind][b.id].series, field);
    }
  }

  /* ---- prediction check: observed vs predicted current, right now ---- */
  const checks = [];
  const obsData = {};
  await Promise.all(gauges
    .filter(isObservedCurrentStation ? g => isObservedCurrentStation(g.id) : () => true)
    .filter(g => live ? g.currentObs : true).map(async g => {
    try {
      const obs = await P.currentObs.load(g.id, win, g, g);
      if (!obs || !obs.series.length) return;
      /* Sign the observed magnitudes. Preference order: the station's own mean
         flood direction from the predictions, then the mean ebb direction, then
         the channel course at that gauge. Within 90 degrees of flood is a
         flood; otherwise an ebb. If none of those is available the reading
         stays unsigned and is reported as a speed with its set, never guessed
         into a direction. */
      const predPack = gaugeData.current[g.id];
      let floodDir = predPack && predPack.meanFloodDir != null ? predPack.meanFloodDir : null;
      if (floodDir == null && predPack && predPack.meanEbbDir != null)
        floodDir = norm360(predPack.meanEbbDir + 180);
      if (floodDir == null && g.floodDir != null) floodDir = g.floodDir;
      obs.floodDir = floodDir;
      obs.signed = floodDir != null;
      for (const row of obs.series) {
        if (row.speedKts == null) continue;
        if (floodDir != null && row.setDeg != null)
          row.signedKts = Math.abs(relAngle(floodDir, row.setDeg)) < 90 ? row.speedKts : -row.speedKts;
        else row.signedKts = null;
      }
      obsData[g.id] = obs;
      const pred = gaugeData.current[g.id];
      const pairs = [];
      if (pred && obs.signed) for (const o of obs.series) {
        if (o.signedKts == null) continue;
        const p = sampleSeries(pred.series, o.t);
        if (!p) continue;
        pairs.push({ o: o.signedKts, p: lerpNum(p.a.signedKts, p.b ? p.b.signedKts : null, p.f) });
      }
      const latest = obs.series[obs.series.length - 1];
      const bias = pairs.length >= 3
        ? pairs.reduce((s, x) => s + (x.o - x.p), 0) / pairs.length : null;
      checks.push({ gauge: g.name, at: latest.t,
                    observedKts: latest.signedKts,
                    speedKts: latest.speedKts, setDeg: latest.setDeg,
                    signed: !!obs.signed, floodDir: obs.floodDir,
                    biasKts: bias, samples: pairs.length });
      sources.push({ station: g.id + '-obs', kind: 'currentObs',
                     name: g.name + ' — observed current', ...obs,
                     series: undefined, count: obs.series.length });
    } catch (e) {
      /* This gauge is configured to publish observations, so nothing coming
         back means the gauge is down — a real outage, worth reporting. */
      const msg = String(e.message || e);
      sources.push({ station: g.id + '-obs', kind: 'currentObs',
                     name: g.name + ' — observed current',
                     error: /No data was found/i.test(msg)
                       ? 'gauge offline — no observations reporting'
                       : msg,
                     quality: 'FAILED' });
    }
  }));

  /* One bounding-box call, purely so the brief can name the nearest station
     that actually measures visibility and how far off the route it is. The Fog
     tab does the full comparison; this is just the distance. */
  let nearestObs = null;
  if (live) {
    try {
      const found = await fetchMetarNear(METAR_BBOX);
      for (const m of found) {
        for (const p of route) {
          const d = haversineNm({ lat: m.lat, lon: m.lon }, { lat: p.lat, lon: p.lon });
          if (!nearestObs || d < nearestObs.distanceNm)
            nearestObs = { station: m.station, name: m.name, observed: m.visibilityNm,
                           at: m.t, distanceNm: d, near: p.name };
        }
      }
    } catch (e) { nearestObs = null; }
  }

  /* The live current cards compare an observation taken now against the
     prediction for now. A transit planned for another day leaves the present
     outside the passage window, so fetch a short window around it separately
     rather than stretching the main one across the gap. */
  const nowPred = {};
  const LIVE_IDS = OBSERVED_CURRENT_STATIONS;
  const nowWin = { start: Date.now() - 3 * HOUR, end: Date.now() + 3 * HOUR };
  const needsNow = nowWin.start < win.start || nowWin.end > win.end;
  if (needsNow) {
    await Promise.all(LIVE_IDS.map(async id => {
      const g = gauges.find(x => x.id === id);
      if (!g || (live && !g.current)) return;
      try { nowPred[id] = await P.current.load(g.id, nowWin, g, g); } catch (e) { nowPred[id] = null; }
    }));
  }

  const available = kind => gauges
    .filter(g => gaugeData[kind][g.id])
    .map(g => ({ ...g, [kind]: true }));

  return { data, sources, gaps, assign, live, gauges, gaugeData, lags, checks, nearestObs, obsData, nowPred,
           tideGauges: available('tide'), currentGauges: available('current') };
}

/** Tide or current at a position along the channel, at an instant. */
function chainValueAt(env, kind, chainNm, t) {
  const list = kind === 'tide' ? env.tideGauges : env.currentGauges;
  if (!list || !list.length) return null;
  const reach = (Store.get('gaugeReachNm', DEFAULT_REACH) || {})[kind];
  const brk = bracketGauges(list, chainNm, kind, reach);
  if (!brk) return null;
  const lag = brk.b ? (env.lags[kind][brk.a.id + '>' + brk.b.id] || 0) : 0;
  const fields = kind === 'tide' ? ['heightFt'] : ['signedKts', 'setDeg'];
  return gaugeValueAt(env.gaugeData[kind], brk, t, fields, lag);
}

/* =========================================================================
   BRIEF ASSEMBLY — joins the solved timeline to the normalized environment.
   ======================================================================= */

/* ---------------------------------------------------------------------------
   FOG RISK
   NWS publishes no fog element, so this is DERIVED, not forecast, and is
   labelled that way everywhere it appears. The physics is the standard one:
   fog needs the air close to saturation and little wind to mix it out. A small
   dewpoint depression with a light breeze is the classic signature, and over
   the lake in winter it is advection fog off warmer water that does it.

   This is an indicator to prompt a look at the satellite product and the
   actual visibility — not a substitute for either.
   ------------------------------------------------------------------------- */
function fogRisk(tempF, dewF, windKts, visibilityNm, lowCloudPct) {
  /* Model visibility is the real forecast and outranks anything inferred. When
     HRRR says a quarter mile, that is the answer; the dewpoint reasoning only
     fills in where the model has nothing to say. */
  if (visibilityNm != null) {
    if (visibilityNm <= 0.5)
      return { level: 'HIGH', source: 'model', visibilityNm,
               why: `model visibility ${visibilityNm.toFixed(1)} nm` };
    if (visibilityNm <= 2)
      return { level: 'MODERATE', source: 'model', visibilityNm,
               why: `model visibility ${visibilityNm.toFixed(1)} nm` };
  }
  if (tempF == null || dewF == null) return null;
  const spread = tempF - dewF;
  const wind = windKts == null ? 0 : windKts;
  let level = 'LOW';
  if (spread <= 2 && wind <= 8) level = 'HIGH';
  else if (spread <= 4 && wind <= 10) level = 'MODERATE';
  else if (spread <= 6 && wind <= 6) level = 'MODERATE';
  // Low stratus with saturated calm air is the advection case over the lake.
  if (level === 'MODERATE' && lowCloudPct != null && lowCloudPct >= 80 && spread <= 3) level = 'HIGH';
  const why = `air ${tempF.toFixed(0)}°F, dewpoint ${dewF.toFixed(0)}°F (${spread.toFixed(1)}° apart), wind ${wind.toFixed(0)} kt` +
    (lowCloudPct != null && lowCloudPct >= 80 ? `, low cloud ${Math.round(lowCloudPct)}%` : '') +
    (visibilityNm != null ? `, model visibility ${visibilityNm.toFixed(1)} nm` : '');
  return { level, spreadF: spread, windKts: wind, visibilityNm, source: 'derived', why };
}

/* One wording for current everywhere: the words FLOOD, EBB and SLACK always
   accompany the signed number so the sign can never be misread. */
function describeCur(v) {
  if (v == null) return '—';
  if (Math.abs(v) < 0.1) return 'SLACK';
  return `${Math.abs(v).toFixed(1)} kt ${v > 0 ? 'FLOOD' : 'EBB'}`;
}

function conditionsAt(env, point, t) {
  const out = { weather: null, wave: null, tide: null, current: null, missing: [] };

  const pull = (kind, stationId, fields) => {
    if (!stationId) { out.missing.push(kind); return null; }
    const pack = env.data[kind][stationId];
    if (!pack) { out.missing.push(kind); return null; }
    const s = sampleSeries(pack.series, t);
    if (!s) { out.missing.push(kind); return null; }
    const o = { station: stationId, source: pack.source, quality: pack.quality };
    for (const f of fields) {
      if (f.endsWith('Deg')) o[f] = lerpAngle(s.a[f], s.b ? s.b[f] : null, s.f);
      else o[f] = lerpNum(s.a[f], s.b ? s.b[f] : null, s.f);
    }
    return o;
  };

  const a = (env.assign && env.assign[point.id]) || {
    weather: point.stations && point.stations.weather,
    wave: point.stations && point.stations.wave,
    tide: point.stations && point.stations.tide,
    current: point.stations && point.stations.current
  };
  out.weather = pull('weather', a.weather, ['windKts', 'gustKts', 'windFromDeg', 'visibilityNm', 'tempF', 'dewpointF', 'humidityPct', 'thunderPct', 'popPct']);
  out.visibility = pull('visibility', a.visibility, ['visibilityNm', 'visibilityGfsNm', 'lowCloudPct', 'modelTempF', 'modelDewF', 'modelWindKts']);

  /* Prefer the NWS grid where it has values; fall back to the model where it
     does not, which for visibility is most of the time. */
  const w = out.weather, v = out.visibility;
  if (w) {
    if (w.visibilityNm == null && v && v.visibilityNm != null) {
      w.visibilityNm = v.visibilityNm;
      w.visibilityFromModel = true;
    }
    const tempF = w.tempF != null ? w.tempF : (v ? v.modelTempF : null);
    const dewF = w.dewpointF != null ? w.dewpointF : (v ? v.modelDewF : null);
    out.fog = fogRisk(tempF, dewF, w.windKts != null ? w.windKts : (v ? v.modelWindKts : null),
                      v ? v.visibilityNm : w.visibilityNm, v ? v.lowCloudPct : null);
  } else if (v) {
    out.fog = fogRisk(v.modelTempF, v.modelDewF, v.modelWindKts, v.visibilityNm, v.lowCloudPct);
  }
  out.wave    = pull('wave',    a.wave,    ['seaFt', 'waveFromDeg', 'wavePeriodS', 'swellFt', 'swellFromDeg', 'swellPeriodS']);
  const chainNm = point.chainNm != null ? point.chainNm : 0;
  out.tide    = chainValueAt(env, 'tide', chainNm, t);
  out.current = chainValueAt(env, 'current', chainNm, t);
  if (!out.tide) out.missing.push('tide');
  if (!out.current) out.missing.push('current');
  return out;
}

function buildBrief(input) {
  const tz = CHANNEL.meta.timezone;
  const thresholds = Store.get('thresholds', DEFAULT_THRESHOLDS);

  // Pass 1: solve with no current so we know the rough window to fetch.
  const rough = solveTransit({ fromId: input.fromId, toId: input.toId, sailEpoch: input.sailEpoch, applyCurrent: false, speedOverride: input.speedOverride, condition: input.condition, anchors: input.anchors });
  const win = { start: input.sailEpoch - HOUR, end: rough.endEpoch + 2 * HOUR };

  return loadEnvironment(rough.waypoints.map(w => w.point), win).then(env => {
    // Pass 2: re-solve, now with real current in the loop.
    // Current is sampled at the vessel's position along the channel, not at a
    // gauge — the solver passes the leg midpoint's chainage.
    const currentAt = (chainKey, t) => {
      const chainNm = parseFloat(chainKey);
      if (!isFinite(chainNm)) return null;
      return chainValueAt(env, 'current', chainNm, t);
    };
    const transit = solveTransit({
      fromId: input.fromId, toId: input.toId, sailEpoch: input.sailEpoch,
      speedOverride: input.speedOverride, currentAt, condition: input.condition,
      anchors: input.anchors
    });

    // Per-waypoint conditions
    const stops = transit.waypoints.map(w => ({
      ...w, cond: conditionsAt(env, w.point, w.eta)
    }));

    // --- tide and current as the vessel actually experiences them ---
    // Rather than reading events off one gauge, walk the timeline and sample
    // the interpolated field at wherever the vessel is. High water then means
    // high water at the ship, and its location comes out for free.
    const STEP = 6 * MIN;
    const vesselTide = [], vesselCurrent = [];
    for (let t = transit.underwayEpoch; t <= transit.endEpoch + STEP; t += STEP) {
      const loc = locateAt(transit, t);
      if (!loc) continue;
      const chainNm = loc.before && loc.after
        ? loc.before.point.chainNm + loc.fraction * (loc.after.point.chainNm - loc.before.point.chainNm)
        : (loc.before || loc.after).point.chainNm;
      if (chainNm == null) continue;
      const td = chainValueAt(env, 'tide', chainNm, t);
      if (td && td.heightFt != null) vesselTide.push({ t, heightFt: td.heightFt, gauges: td.gauges });
      const cu = chainValueAt(env, 'current', chainNm, t);
      if (cu && cu.signedKts != null) vesselCurrent.push({ t, signedKts: cu.signedKts, gauges: cu.gauges });
    }

    const window = { start: transit.underwayEpoch, end: transit.endEpoch };

    const tideEvents = findTurns(vesselTide, 'heightFt', window).map(turn => ({
      t: turn.t, kind: turn.kind, heightFt: turn.heightFt,
      stationName: (turn.gauges || []).join(' + ') || 'interpolated',
      location: locateAt(transit, turn.t)
    }));

    const currentEvents = [];
    let maxCurrent = null;
    for (const sl of findSlacks(vesselCurrent, window))
      currentEvents.push({ t: sl.t, kind: 'SLACK', becoming: sl.becoming,
                           location: locateAt(transit, sl.t) });
    /* The largest signed value is only a flood if it is actually positive. On a
       passage spent entirely on the ebb every value is negative, so the
       "maximum" is the weakest ebb — which must never be reported as a flood.
       The same applies in reverse on a passage entirely on the flood. */
    for (const [x, label] of [[findExtreme(vesselCurrent, 'signedKts', window, 'max'), 'MAX FLOOD'],
                              [findExtreme(vesselCurrent, 'signedKts', window, 'min'), 'MAX EBB']]) {
      if (!x || x.signedKts == null || Math.abs(x.signedKts) < 0.15) continue;
      if (label === 'MAX FLOOD' && x.signedKts <= 0) continue;
      if (label === 'MAX EBB' && x.signedKts >= 0) continue;
      const ev = { t: x.t, kind: label, kts: Math.abs(x.signedKts),
                   stationName: (x.gauges || []).join(' + '),
                   location: locateAt(transit, x.t) };
      currentEvents.push(ev);
      if (!maxCurrent || ev.kts > maxCurrent.kts) maxCurrent = ev;
    }
    tideEvents.sort((a, b) => a.t - b.t);
    currentEvents.sort((a, b) => a.t - b.t);

    // --- worst wind across the transit ---
    let maxWind = null;
    for (const s of stops) {
      const w = s.cond.weather;
      if (!w || w.windKts == null) continue;
      if (!maxWind || w.windKts > maxWind.windKts) maxWind = { ...w, at: s.point.name, t: s.eta };
    }

    /* Fog summary for What Matters. Built from the visibility already fetched
       for each waypoint, so it costs nothing extra; the Fog tab keeps the
       fuller 25-point analysis. Threshold logic is reused, not reimplemented. */
    const fogRows = stops.map(st => {
      const v = st.cond.visibility, w = st.cond.weather;
      const nm = (v && v.visibilityNm != null) ? v.visibilityNm
               : (w && w.visibilityNm != null ? w.visibilityNm : null);
      const gfs = v && v.visibilityGfsNm != null ? v.visibilityGfsNm : null;
      const key = env.assign && env.assign[st.point.id] ? env.assign[st.point.id].visibility : null;
      const pack = key ? env.data.visibility[key] : null;
      return {
        name: st.point.name, chainNm: st.point.chainNm, eta: st.eta, nm,
        trend: pack ? visTrend(pack.series, st.eta) : 'unknown',
        others: gfs != null ? [{ model: 'GFS', nm: gfs }] : []
      };
    });
    const fogSummary = fogTransitProfile(fogRows);
    const fogSplit = modelDisagreements(fogRows);

    /* ---- live observed currents ----
       Exactly two stations, always both, never route-dependent: Cameron Fishing
       Pier at the mouth and City Docks at the head. Observed and predicted are
       kept distinct throughout, and a missing observation is never backfilled
       with a prediction. */
    const LIVE_CURRENT_GAUGES = OBSERVED_CURRENT_STATIONS;
    const STALE_OBS_MS = 30 * MIN;
    const nowT = Date.now();

    const destChain = transit.waypoints[transit.waypoints.length - 1].point.chainNm;
    let finishGaugeId = null, finishDist = Infinity;
    for (const id of LIVE_CURRENT_GAUGES) {
      const g = (env.gauges || []).find(x => x.id === id);
      if (!g) continue;
      const d = Math.abs(g.chainNm - destChain);
      if (d < finishDist) { finishDist = d; finishGaugeId = id; }
    }

    /* Prefer the passage window; fall back to the separately fetched window
       around the present when the instant asked for lies outside it. */
    const predAt = (gaugeId, t) => {
      for (const pack of [env.gaugeData.current[gaugeId], (env.nowPred || {})[gaugeId]]) {
        if (!pack) continue;
        const sm = sampleSeries(pack.series, t);
        if (sm) return lerpNum(sm.a.signedKts, sm.b ? sm.b.signedKts : null, sm.f);
      }
      return null;
    };

    const liveCurrents = LIVE_CURRENT_GAUGES.map(id => {
      const g = (env.gauges || []).find(x => x.id === id);
      const obsSrc = env.sources.find(x => x.station === id + '-obs');
      const obsPack = env.obsData ? env.obsData[id] : null;
      const latest = obsPack && obsPack.series.length ? obsPack.series[obsPack.series.length - 1] : null;

      const out = {
        id, name: g ? g.name : id, chainNm: g ? g.chainNm : null,
        isFinish: id === finishGaugeId,
        observed: latest && latest.signedKts != null ? latest.signedKts : null,
        observedSpeed: latest ? latest.speedKts : null,
        setDeg: latest ? latest.setDeg : null,
        signed: obsPack ? !!obsPack.signed : false,
        at: latest ? latest.t : null,
        ageMs: latest ? nowT - latest.t : null,
        stale: latest ? (nowT - latest.t) > STALE_OBS_MS : false,
        offline: !latest,
        error: obsSrc && obsSrc.quality === 'FAILED' ? obsSrc.error : null,
        predictedNow: predAt(id, nowT),
        predictedAtObs: latest ? predAt(id, latest.t) : null,
        hasPredictions: !!env.gaugeData.current[id]
      };

      // Observed against the prediction for the same instant — reported only.
      if (out.observed != null && out.predictedAtObs != null) {
        const d = Math.abs(out.observed) - Math.abs(out.predictedAtObs);
        out.deltaKts = d;
        out.comparison = Math.abs(d) < 0.15 ? 'Close to prediction'
          : `Running ${Math.abs(d).toFixed(1)} kt ${d > 0 ? 'stronger' : 'weaker'} than predicted`;
      }

      if (out.isFinish) {
        const eta = transit.endEpoch;
        out.finishEta = eta;
        out.predictedAtEta = predAt(id, eta);
        const before = predAt(id, eta - 30 * MIN), after = predAt(id, eta + 30 * MIN);
        if (before != null && after != null) {
          const mag = Math.abs(after) - Math.abs(before);
          out.etaTrend = Math.abs(out.predictedAtEta || 0) < 0.1 ? 'slack'
            : (mag > 0.05 ? 'increasing' : mag < -0.05 ? 'decreasing' : 'steady');
          if ((before > 0) !== (after > 0)) out.reversal = true;
        }
        const pack = env.gaugeData.current[id];
        if (pack) {
          const wide = { start: eta - 6 * HOUR, end: eta + 6 * HOUR };
          const slacks = findSlacks(pack.series, wide);
          out.nextSlack = slacks.find(x => x.t > eta) || null;
          const hi = findExtreme(pack.series, 'signedKts', { start: eta - 2 * HOUR, end: eta + 2 * HOUR }, 'max');
          const lo = findExtreme(pack.series, 'signedKts', { start: eta - 2 * HOUR, end: eta + 2 * HOUR }, 'min');
          const near = (x) => x && Math.abs(x.t - eta) < 45 * MIN;
          if (Math.abs(out.predictedAtEta || 0) < 0.2) out.event = 'ARRIVING NEAR SLACK';
          else if (near(hi) && hi.signedKts > 0.4 && Math.abs(hi.signedKts - (out.predictedAtEta || 0)) < 0.2)
            out.event = 'ARRIVING NEAR MAX FLOOD';
          else if (near(lo) && lo.signedKts < -0.4 && Math.abs(lo.signedKts - (out.predictedAtEta || 0)) < 0.2)
            out.event = 'ARRIVING NEAR MAX EBB';
          if (out.reversal) out.event = 'CURRENT REVERSAL BEFORE ARRIVAL';
        }
      }
      return out;
    });

    // --- pilot transfer ---
    const last = stops[stops.length - 1];
    let ladder = null;
    if (last.point.type === 'PILOT_STATION') {
      const wv = last.cond.wave, wd = last.cond.weather;
      ladder = recommendLadder({
        seas:  wv && wv.waveFromDeg  != null ? { dir: dir(wv.waveFromDeg, FROM),  heightFt: wv.seaFt }   : null,
        swell: wv && wv.swellFromDeg != null ? { dir: dir(wv.swellFromDeg, FROM), heightFt: wv.swellFt } : null,
        wind:  wd && wd.windFromDeg  != null ? { dir: dir(wd.windFromDeg, FROM),  speedKts: wd.windKts } : null,
        baseCourse: last.legIn ? last.legIn.course : null
      });
      ladder.eta = last.eta;
      ladder.conditions = { ...(wv || {}), ...(wd || {}) };
    }

    // --- alerts ---
    const alerts = [];
    if (maxWind && maxWind.windKts >= thresholds.windKts)
      alerts.push({ t: 'Strong wind', d: `${Math.round(maxWind.windKts)} kt from ${compass(maxWind.windFromDeg)} near ${maxWind.at} around ${fmtClock(maxWind.t, tz)}.` });

    if (maxCurrent && maxCurrent.kts >= thresholds.currentKts)
      alerts.push({ t: 'Strong current', d: `${maxCurrent.kind.toLowerCase()} ${maxCurrent.kts.toFixed(1)} kt at ${fmtClock(maxCurrent.t, tz)}. ${maxCurrent.location.label}.` });
    if (last.cond.wave && last.cond.wave.seaFt >= thresholds.seasFt)
      alerts.push({ t: 'Pilot transfer', d: `Seas ${last.cond.wave.seaFt.toFixed(1)} ft at the station around ${fmtClock(last.eta, tz)}.` });
    if (last.cond.wave && last.cond.wave.swellFt >= thresholds.swellFt)
      alerts.push({ t: 'Swell', d: `Swell ${last.cond.wave.swellFt.toFixed(1)} ft from ${compass(last.cond.wave.swellFromDeg)} at the station.` });
    /* Weather events are reported as a window along the transit — where it
       starts, where it is worst — rather than a single worst number, because
       what a pilot needs is when and where, not just how much. */
    const spanOf = (test, valueOf) => {
      let first = null, last = null, peak = null;
      for (const st of stops) {
        if (!test(st)) continue;
        if (!first) first = st;
        last = st;
        const v = valueOf(st);
        if (peak == null || v > peak.v) peak = { v, st };
      }
      return first ? { first, last, peak } : null;
    };
    const spanText = sp => sp.first === sp.last
      ? `near ${sp.first.point.name} around ${fmtClock(sp.first.eta, tz)}`
      : `from ${sp.first.point.name} ${fmtClock(sp.first.eta, tz)} to ${sp.last.point.name} ${fmtClock(sp.last.eta, tz)}`;

    const visSpan = spanOf(
      st => st.cond.weather && st.cond.weather.visibilityNm != null &&
            st.cond.weather.visibilityNm <= thresholds.visibilityNm,
      st => -st.cond.weather.visibilityNm);
    if (visSpan)
      alerts.push({ t: 'Reduced visibility', d:
        `Down to ${(-visSpan.peak.v).toFixed(1)} nm, ${spanText(visSpan)}. Worst near ${visSpan.peak.st.point.name} at ${fmtClock(visSpan.peak.st.eta, tz)}.` });

    /* A current event at the finish is worth surfacing above the fold, not just
       on the station card. */
    for (const lc of (liveCurrents || [])) {
      if (!lc.isFinish || !lc.event) continue;
      alerts.push({ t: lc.event, d:
        `${lc.name} at your ETA ${fmtClock(lc.finishEta, tz)}` +
        (lc.predictedAtEta != null ? ` — predicted ${describeCur(lc.predictedAtEta)}` : '') +
        (lc.nextSlack ? `. Next slack ${fmtClock(lc.nextSlack.t, tz)}.` : '.') });
    }

    /* HRRR against GFS at the ETAs. Flagged where they straddle the fog line,
       because that is a disagreement about whether there is fog at all. */
    const modelSplit = [];
    for (const st of stops) {
      const v = st.cond.visibility;
      if (!v || v.visibilityNm == null || v.visibilityGfsNm == null) continue;
      const gap = Math.abs(v.visibilityNm - v.visibilityGfsNm);
      const straddles = (v.visibilityNm < 2 && v.visibilityGfsNm >= 2) ||
                        (v.visibilityGfsNm < 2 && v.visibilityNm >= 2);
      if (gap >= 1.5 && straddles)
        modelSplit.push({ at: st.point.name, t: st.eta, hrrr: v.visibilityNm, gfs: v.visibilityGfsNm, gap });
    }
    if (modelSplit.length) {
      const wst = modelSplit.reduce((a, b) => (b.gap > a.gap ? b : a));
      alerts.push({ t: 'Fog forecast uncertain', d:
        `At ${wst.at}, ETA ${fmtClock(wst.t, tz)} — HRRR ${wst.hrrr.toFixed(1)} nm, GFS ${wst.gfs.toFixed(1)} nm. ` +
        `The models disagree about whether there is fog here${modelSplit.length > 1
          ? `, and at ${modelSplit.length - 1} other point${modelSplit.length > 2 ? 's' : ''}` : ''}. Not averaged.` });
    }

    const fogSpan = spanOf(
      st => st.cond.fog && st.cond.fog.level === 'HIGH',
      st => -st.cond.fog.spreadF);
    if (fogSpan)
      alerts.push({ t: 'Fog risk', d:
        (fogSpan.peak.st.cond.fog.source === 'model'
          ? `Model forecasts fog ${spanText(fogSpan)} — ${esc(fogSpan.peak.st.cond.fog.why)}. HRRR visibility; confirm against the satellite product.`
          : `Conditions favour fog ${spanText(fogSpan)} — ${esc(fogSpan.peak.st.cond.fog.why)}. Derived from dewpoint and wind, not a fog forecast; check the satellite product.`) });
    else {
      const modSpan = spanOf(st => st.cond.fog && st.cond.fog.level === 'MODERATE', st => -st.cond.fog.spreadF);
      if (modSpan)
        alerts.push({ info: true, t: 'Some fog potential', d:
          `Air and dewpoint closing ${spanText(modSpan)}. Worth a look at the satellite product.` });
    }

    const thunderSpan = spanOf(
      st => st.cond.weather && st.cond.weather.thunderPct != null && st.cond.weather.thunderPct >= 30,
      st => st.cond.weather.thunderPct);
    if (thunderSpan)
      alerts.push({ t: 'Thunderstorms', d:
        `Up to ${Math.round(thunderSpan.peak.v)}% chance, ${spanText(thunderSpan)}.` });

    const gustSpan = spanOf(
      st => st.cond.weather && st.cond.weather.gustKts != null && st.cond.weather.gustKts >= thresholds.gustKts,
      st => st.cond.weather.gustKts);
    if (gustSpan)
      alerts.push({ t: 'Gusts', d:
        `To ${Math.round(gustSpan.peak.v)} kt, ${spanText(gustSpan)}.` });
    if (ladder && ladder.status === 'MIXED')
      alerts.push({ t: 'Ladder review', d: ladder.notes.join(' ') });
    const lowTide = tideEvents.filter(e => e.kind === 'LOW').sort((a, b) => a.heightFt - b.heightFt)[0];
    if (lowTide && lowTide.heightFt <= thresholds.minTideFt)
      alerts.push({ t: 'Low water', d: `${lowTide.heightFt.toFixed(1)} ft at ${fmtClock(lowTide.t, tz)}. ${lowTide.location.label}.` });

    /* Observations vs predictions. Wind setup and river flow routinely push the
       real current off the harmonic curve; if they have today, say so rather
       than presenting the prediction as fact. */
    for (const c of (env.checks || [])) {
      if (c.biasKts == null) continue;
      /* A difference this large is not a real current anomaly — it means the
         observation and the prediction are not describing the same quantity.
         Say that rather than reporting an impossible current. */
      if (Math.abs(c.biasKts) > 4) {
        alerts.push({ t: 'Current data mismatch', d:
          `At ${c.gauge} the observation and the prediction differ by ${Math.abs(c.biasKts).toFixed(1)} kt, ` +
          `too large to be a real anomaly. Treat the current at this station as unreliable and check NOAA directly.` });
        continue;
      }
      if (Math.abs(c.biasKts) >= 0.4)
        alerts.push({ t: 'Current running off prediction', d:
          `At ${c.gauge} the observed current is ${Math.abs(c.biasKts).toFixed(1)} kt ` +
          `${c.biasKts > 0 ? 'more flood' : 'more ebb'} than predicted over the last two hours. ` +
          `Treat the predicted current below as a guide only.` });
    }

    /* Where the gauge chain does not reach, say so rather than leave a blank. */
    let noTide = 0, noCurrent = 0;
    for (const st of stops) {
      if (!st.cond.tide) noTide++;
      if (!st.cond.current) noCurrent++;
    }
    if (noCurrent)
      alerts.push({ info: true, t: 'No current data', d:
        `${noCurrent} of ${stops.length} waypoints lie beyond the current gauges. Those ETAs assume slack water.` });
    if (noTide)
      alerts.push({ info: true, t: 'No tide data', d:
        `${noTide} of ${stops.length} waypoints lie beyond the tide gauges.` });

    return { input, transit, stops, env, tideEvents, currentEvents, maxCurrent,
             maxWind, ladder, alerts, tz, thresholds, window, currentAt,
             fogSummary, fogSplit, liveCurrents };
  });
}

/* =========================================================================
   PRESENTATION
   ======================================================================= */

const PILOT_ID = CHANNEL.seawardNodeId;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const TZ = () => CHANNEL.meta.timezone;

let LAST = null;
let form = Store.get('form', null);

function defaultForm() {
  const now = new Date();
  const tz = TZ();
  const p = {};
  for (const part of new Intl.DateTimeFormat('en-CA', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(now))
    if (part.type !== 'literal') p[part.type] = part.value;
  return {
    date: `${p.year}-${p.month}-${p.day}`,
    time: `${p.hour === '24' ? '00' : p.hour}:00`,
    fromId: 'BT4', toId: PILOT_ID, condition: 'LOADED',
    vessel: '', loa: '', beam: '', draft: '', speedOverride: ''
  };
}
if (!form) form = defaultForm();

/* ---------- plan view ---------- */
function renderPlan() {
  const selectable = selectablePoints();
  const opts = ids => selectable.map(p =>
    `<option value="${p.id}"${p.id === ids ? ' selected' : ''}>${esc(p.name)}</option>`).reverse().join('');

  let dirTag = '';
  try {
    const r = buildLegs(form.fromId, form.toId);
    dirTag = r.outbound ? 'Outbound' : 'Inbound';
  } catch (e) { dirTag = '—'; }

  $('#viewPlan').innerHTML = `
    <p class="eyebrow">Plan the transit</p>
    <div class="row2">
      <div class="field"><label for="fDate">Date</label>
        <input class="control" type="date" id="fDate" value="${esc(form.date)}"></div>
      <div class="field"><label for="fTime">Sail time</label>
        <input class="control" type="time" id="fTime" value="${esc(form.time)}"></div>
    </div>
    <div class="field"><label for="fFrom">From</label>
      <select class="control" id="fFrom">${opts(form.fromId)}</select></div>
    <div class="swap">
      <button id="fSwap" type="button">Reverse</button>
      <span class="dirtag" id="fDir">${dirTag}</span>
    </div>
    <div class="field"><label for="fTo">To</label>
      <select class="control" id="fTo">${opts(form.toId)}</select></div>

    <div class="field"><label>Condition</label>
      <div class="seg" id="fCond">
        <button type="button" data-v="LOADED"${form.condition !== 'LIGHT' ? ' class="on"' : ''}>Loaded</button>
        <button type="button" data-v="LIGHT"${form.condition === 'LIGHT' ? ' class="on"' : ''}>Light ship</button>
      </div></div>

    <details class="opt"${form.vessel || form.speedOverride ? ' open' : ''}>
      <summary>Vessel and speed</summary>
      <div class="inner">
        <div class="field"><label for="fVessel">Vessel name</label>
          <input class="control" id="fVessel" value="${esc(form.vessel)}" placeholder="Optional"></div>
        <div class="row2">
          <div class="field"><label for="fLoa">LOA (m)</label>
            <input class="control" id="fLoa" inputmode="decimal" value="${esc(form.loa)}"></div>
          <div class="field"><label for="fDraft">Draft (m)</label>
            <input class="control" id="fDraft" inputmode="decimal" value="${esc(form.draft)}"></div>
        </div>
        <div class="field"><label for="fSpeed">Speed override (kt through water)</label>
          <input class="control" id="fSpeed" inputmode="decimal" value="${esc(form.speedOverride)}" placeholder="Leave blank to use segment speeds"></div>
      </div>
    </details>

    <button class="generate" id="fGo">Generate brief</button>

    <div class="foot">
      Decision support only. Does not replace your judgment, the vessel's data,
      official navigation publications, VTS, or required weather sources.
      Channel geometry is unverified placeholder data.
    </div>`;

  const sync = () => {
    form.date = $('#fDate').value; form.time = $('#fTime').value;
    form.fromId = $('#fFrom').value; form.toId = $('#fTo').value;
    form.vessel = $('#fVessel').value; form.loa = $('#fLoa').value;
    form.draft = $('#fDraft').value; form.speedOverride = $('#fSpeed').value;
    Store.set('form', form);
    try { $('#fDir').textContent = buildLegs(form.fromId, form.toId).outbound ? 'Outbound' : 'Inbound'; }
    catch (e) { $('#fDir').textContent = '—'; }
  };
  for (const id of ['fDate','fTime','fFrom','fTo','fVessel','fLoa','fDraft','fSpeed'])
    $('#' + id).addEventListener('change', sync);
  document.querySelectorAll('#fCond button').forEach(b => b.addEventListener('click', () => {
    form.condition = b.dataset.v; Store.set('form', form);
    document.querySelectorAll('#fCond button').forEach(x => x.classList.toggle('on', x === b));
  }));
  $('#fSwap').addEventListener('click', () => {
    const a = $('#fFrom').value; $('#fFrom').value = $('#fTo').value; $('#fTo').value = a; sync();
  });
  $('#fGo').addEventListener('click', generate);
}

async function generate() {
  const btn = $('#fGo');
  const [y, mo, d] = form.date.split('-').map(Number);
  const [h, mi] = form.time.split(':').map(Number);
  if (!y || isNaN(h)) { btn.textContent = 'Enter a date and time'; return; }
  if (form.fromId === form.toId) { btn.textContent = 'From and To must differ'; setTimeout(() => btn.textContent = 'Generate brief', 1800); return; }

  btn.textContent = 'Working…'; btn.disabled = true;
  try {
    const sailEpoch = wallToEpoch(y, mo, d, h, mi, TZ());
    const sp = parseFloat(form.speedOverride);
    LAST = await buildBrief({
      fromId: form.fromId, toId: form.toId, sailEpoch,
      anchors: Store.get('anchors', []),
      condition: form.condition === 'LIGHT' ? LIGHT : LOADED,
      speedOverride: isFinite(sp) && sp > 0 ? sp : null,
      vessel: form.vessel
    });
    Underway.reset();
    Store.set('anchors', []);
    Store.set('lastBrief', {
      fromId: form.fromId, toId: form.toId, sailEpoch,
      condition: form.condition, speedOverride: form.speedOverride,
      vessel: form.vessel, generatedAt: Date.now()
    });
    renderBrief(LAST); show('viewBrief');
  } catch (e) {
    btn.textContent = 'Failed: ' + (e.message || e);
    setTimeout(() => { btn.textContent = 'Generate brief'; btn.disabled = false; }, 3200);
    return;
  }
  btn.textContent = 'Generate brief'; btn.disabled = false;
}

/* ---------- brief view ---------- */
function windLine(w) {
  if (!w || w.windKts == null) return '<span class="badge gap">No data</span>';
  const g = w.gustKts != null && w.gustKts - w.windKts > 3 ? ` G${Math.round(w.gustKts)}` : '';
  return `${compass(w.windFromDeg)} ${Math.round(w.windKts)}${g} kt`;
}

function renderBrief(b) {
  const tz = b.tz, t = b.transit;
  const from = t.waypoints[0].point, to = t.waypoints[t.waypoints.length - 1].point;
  const last = b.stops[b.stops.length - 1];

  // merge waypoints and events into one chronological ribbon
  const items = [];
  for (const s of b.stops) items.push({ t: s.eta, kind: 'STOP', s });
  for (const e of b.tideEvents) items.push({ t: e.t, kind: 'TIDE', e });
  for (const e of b.currentEvents) items.push({ t: e.t, kind: 'CUR', e });
  if (t.pilotOffEpoch) items.push({ t: t.pilotOffEpoch, kind: 'OFF' });
  items.sort((a, z) => a.t - z.t);

  /* Every derived number on this page can be opened up. A pilot should be able
     to see the arithmetic and the source behind any figure they are asked to
     act on, rather than take it on faith. */
  let workId = 0;
  const workBlock = rows => {
    const id = 'work' + (++workId);
    return `<button class="showwork" data-work="${id}">Show working</button>
      <div class="work" id="${id}"><table>${rows.filter(Boolean).join('')}</table></div>`;
  };
  const wrow = (k, v) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`;

  const gaugeRows = (label, c) => {
    if (!c) return wrow(label, 'no data — beyond the gauges');
    const src = (c.gauges || []).join(' + ');
    return [
      wrow(label + ' source', esc(src) || '—'),
      c.interpolated ? wrow('Blend', `${Math.round((1 - c.weight) * 100)}% / ${Math.round(c.weight * 100)}%`) : null,
      c.lagMs ? wrow('Propagation lag', fmtDuration(c.lagMs)) : null,
      c.extrapolated ? wrow('Note', `carried ${c.beyondNm != null ? c.beyondNm.toFixed(1) + ' nm ' : ''}past the end gauge`) : null,
      c.partial ? wrow('Note', 'one gauge unavailable — using the other alone') : null
    ].filter(Boolean).join('');
  };

  const ribbon = items.map((it, i) => {
    const style = `animation-delay:${Math.min(i * 26, 520)}ms`;
    if (it.kind === 'STOP') {
      const s = it.s, p = s.point, c = s.cond;
      const cls = p.type === 'PILOT_STATION' ? 'term' : p.type === 'TURN' ? 'turn' : (p.type === 'BERTH' ? 'major' : '');
      const bits = [];
      bits.push(`Wind ${windLine(c.weather)}`);
      if (c.current && c.current.signedKts != null) {
        const v = c.current.signedKts;
        bits.push(Math.abs(v) < 0.15 ? 'Slack' : `${v > 0 ? 'Flood' : 'Ebb'} ${Math.abs(v).toFixed(1)} kt`);
      } else bits.push('<span class="badge gap">No current</span>');
      if (c.tide && c.tide.heightFt != null) bits.push(`Tide ${c.tide.heightFt >= 0 ? '+' : ''}${c.tide.heightFt.toFixed(1)} ft`);
      if (c.weather && c.weather.visibilityNm != null && c.weather.visibilityNm < 5)
        bits.push(`<span style="color:var(--caution)">Vis ${c.weather.visibilityNm.toFixed(1)} nm</span>`);
      if (c.fog && c.fog.level !== 'LOW')
        bits.push(`<span style="color:${c.fog.level === 'HIGH' ? 'var(--caution)' : 'var(--dim)'}">Fog ${c.fog.level.toLowerCase()}</span>`);
      if (c.wave && c.wave.seaFt != null) bits.push(`Seas ${c.wave.seaFt.toFixed(1)} ft`);
      const sog = s.legOut ? ` &nbsp;·&nbsp; ${s.legOut.sog.toFixed(1)} kt SOG <span style="color:var(--faint)">(${esc(s.legOut.zone || '')})</span>` : '';
      const L = s.legIn;
      const work = workBlock([
        L ? wrow('Leg in', esc(L.from.name) + ' → ' + esc(L.to.name)) : wrow('Leg in', 'start of transit'),
        L ? wrow('Distance', L.distanceNm.toFixed(2) + ' nm') : null,
        L ? wrow('Reach', esc(L.zone || '—')) : null,
        L ? wrow('Course', Math.round(L.course) + '°T') : null,
        L ? wrow('Speed through water', L.stw.toFixed(1) + ' kt' + (t.condition === 'LIGHT' ? ' (light)' : ' (loaded)')) : null,
        L && L.current && L.current.signedKts != null
          ? wrow('Current component', ((t.outbound ? -1 : 1) * L.current.signedKts >= 0 ? '+' : '') +
              ((t.outbound ? -1 : 1) * L.current.signedKts).toFixed(2) + ' kt')
          : (L ? wrow('Current component', 'none — beyond the gauges') : null),
        L ? wrow('Speed over ground', L.sog.toFixed(2) + ' kt') : null,
        L ? wrow('Time for leg', fmtDuration((L.distanceNm / L.sog) * HOUR)) : null,
        wrow('ETA', fmtClock(s.eta, tz)),
        gaugeRows('Tide', c.tide),
        gaugeRows('Current', c.current),
        c.weather ? wrow('Weather', esc(c.weather.source || 'forecast')) : wrow('Weather', 'no data'),
        c.weather && c.weather.visibilityNm != null
          ? wrow('Visibility', c.weather.visibilityNm.toFixed(1) + ' nm' + (c.weather.visibilityFromModel ? ' (model — NWS grid empty)' : ' (NWS grid)'))
          : wrow('Visibility', 'no data'),
        c.fog ? wrow('Fog risk', c.fog.level.toLowerCase() + ' — ' + esc(c.fog.why)) : null,
        c.fog ? wrow('Fog method', c.fog.source === 'model'
          ? 'model visibility — the same HRRR field Windy draws its fog layer from'
          : 'DERIVED from dewpoint depression and wind, not an NWS fog forecast') : null,
        wrow('Solve', t.converged ? t.iterations + ' passes, converged' : 'did not converge')
      ]);
      /* Updated or actual time is dominant; the original stays beside it so the
         pilot can see how far ahead or behind the plan the ship is running. */
      const shifted = Math.abs(s.deltaMs || 0) >= 60000;
      const tag = s.isAnchor ? 'ACTUAL' : (t.anchorIndex >= 0 && !s.passed && shifted ? 'UPDATED' : '');
      const orig = (s.isAnchor || (t.anchorIndex >= 0 && !s.passed && shifted))
        ? `<span class="orig">plan ${fmtClock(s.originalEta, tz)}${
            s.deltaMs ? ` · ${s.deltaMs > 0 ? '+' : '−'}${fmtDuration(Math.abs(s.deltaMs))}` : ''}</span>` : '';
      return `<div class="stop ${cls}${s.isAnchor ? ' anchor' : ''}" style="${style}">
        <div class="time num">${fmtClock(s.eta, tz)}${tag ? `<span class="cptag">${tag}</span>` : ''}${orig}</div>
        <div class="name">${esc(p.name)}${s.legIn && s.legIn.oneWay ? ' <span class="badge gap">one-way</span>' : ''}</div>
        <div class="meta">${bits.join('<span class="sep">|</span>')}${sog}</div>
        ${work}
      </div>`;
    }
    if (it.kind === 'TIDE') {
      const e = it.e;
      const work = workBlock([
        wrow('Found by', 'sampling the interpolated tide at the ship every 6 min'),
        wrow('Gauges', esc(e.stationName || '—')),
        wrow('Height', (e.heightFt >= 0 ? '+' : '') + e.heightFt.toFixed(2) + ' ft MLLW'),
        wrow('Time', fmtClock(e.t, tz)),
        wrow('Ship then', esc(e.location.label)),
        e.location.before ? wrow('Between ETAs',
          fmtClock(e.location.before.eta, tz) + ' and ' +
          (e.location.after ? fmtClock(e.location.after.eta, tz) : '—')) : null
      ]);
      return `<div class="stop evt tideevt" style="${style}">
        <div class="time num">${fmtClock(e.t, tz)}</div>
        <div class="name">${e.kind === 'HIGH' ? 'High water' : 'Low water'} ${e.heightFt >= 0 ? '+' : ''}${e.heightFt.toFixed(1)} ft</div>
        <div class="meta">${esc(e.location.label)} <span class="sep">|</span> ${esc(e.stationName)}</div>
        ${work}
      </div>`;
    }
    if (it.kind === 'CUR') {
      const e = it.e;
      const title = e.kind === 'SLACK' ? `Slack — becoming ${e.becoming.toLowerCase()}` : `${e.kind} ${e.kts.toFixed(1)} kt`;
      const work = workBlock([
        wrow('Found by', 'sampling the interpolated current at the ship every 6 min'),
        e.stationName ? wrow('Gauges', esc(e.stationName)) : null,
        e.kts != null ? wrow('Velocity', e.kts.toFixed(2) + ' kt') : null,
        e.becoming ? wrow('Becoming', esc(e.becoming.toLowerCase())) : null,
        wrow('Time', fmtClock(e.t, tz)),
        wrow('Ship then', esc(e.location.label)),
        wrow('Sign convention', 'positive = flood, setting upriver')
      ]);
      return `<div class="stop evt" style="${style}">
        <div class="time num">${fmtClock(e.t, tz)}</div>
        <div class="name">${esc(title)}</div>
        <div class="meta">${esc(e.location.label)}</div>
        ${work}
      </div>`;
    }
    return `<div class="stop term" style="${style}">
      <div class="time num">${fmtClock(it.t, tz)}</div>
      <div class="name" style="color:var(--stbd)">Pilot off</div>
    </div>`;
  }).join('');

  // ladder card
  let ladderHtml = '';
  if (b.ladder) {
    const L = b.ladder;
    const cls = L.status === 'CLEAR' ? (L.side === 'STARBOARD' ? 'stbd' : 'port') : 'mixed';
    const title = L.status === 'CLEAR' ? `${L.side} ladder`
      : L.status === 'NO_DATA' ? 'No data — pilot review required'
      : 'Mixed conditions — pilot review required';
    const why = L.status === 'CLEAR'
      ? `${L.dominantLabel} from ${Math.round(L.dominantFrom)}° (${compass(L.dominantFrom)}). Working the ship to ${Math.round(L.heading)}° puts it ${Math.abs(Math.round(L.relativeAngle))}° off the ${L.relativeAngle < 0 ? 'port' : 'starboard'} bow, so the lee falls to ${L.side.toLowerCase()}.`
      : L.notes.join(' ');
    const rows = (L.contributors || []).map(c =>
      `<tr><td>${esc(c.label)}${c.weightNote ? ' · ' + esc(c.weightNote) : ''}</td><td>${Math.round(c.fromDeg)}° from — ${c.side ? c.side.toLowerCase() + ' lee' : c.reason.toLowerCase().replace('_', ' ')}</td></tr>`).join('');
    ladderHtml = `<div class="ladder ${cls}">
      <p class="eyebrow" style="margin-bottom:2px">Pilot ladder · ${fmtClock(L.eta || last.eta, tz)}</p>
      <div class="side">${esc(title)}</div>
      <div class="why">${esc(why)}</div>
      <button class="showwork" data-work="ladderWork">Show working</button>
      <div class="work" id="ladderWork"><table>
        ${rows}
        <tr><td>Assumed transfer heading</td><td>${L.heading != null ? Math.round(L.heading) + '°' : '—'}</td></tr>
        <tr><td>Channel course at station</td><td>${L.baseCourse != null ? Math.round(L.baseCourse) + '°' : '—'}</td></tr>
        <tr><td>Relative sea angle</td><td>${L.relativeAngle != null ? Math.round(L.relativeAngle) + '°' : '—'}</td></tr>
        <tr><td>Direction spread</td><td>${L.spread != null ? Math.round(L.spread) + '°' : '—'}</td></tr>
        <tr><td>Rule</td><td>sea ~60° off bow</td></tr>
        <tr><td>Data</td><td>Simulated</td></tr>
      </table></div>
      <div class="disc">Advisory only — verify actual conditions and vessel heading before rigging the ladder.</div>
    </div>`;
  }

  const alertsHtml = b.alerts.map(a =>
    `<div class="alert${a.info ? ' info' : ''}"><div class="bar"></div><div>
      <div class="t">${esc(a.t)}</div><div class="d">${a.d}</div></div></div>`).join('');

  const wv = last.cond.wave, mc = b.maxCurrent;
  const nextTide = b.tideEvents[0];

  const badgeFor = s => s.quality === 'MOCK' ? 'mock'
    : (s.quality === 'FAILED' || s.stale) ? 'stale' : 'gap';
  const srcHtml = b.env.sources.map(s => {
    let detail;
    if (s.quality === 'FAILED') detail = esc(String(s.error).slice(0, 70));
    else if (s.quality === 'CACHED') detail = `${s.count} pts · ${fmtDuration(s.ageMs)} old`;
    else detail = `${s.count} pts · ${fmtClock(s.retrieved, tz)}`;
    return `<div class="src">
      <span class="n">${esc(s.name)}</span>
      <span class="st">${detail}
        <span class="badge ${badgeFor(s)}">${s.stale ? 'STALE' : esc(s.quality)}</span></span>
    </div>`;
  }).join('');

  $('#viewBrief').innerHTML = `
    <button class="backbtn" id="bBack">← New brief</button>

    ${(() => {
      const cached = b.env.sources.filter(s => s.quality === 'CACHED');
      const stale = cached.filter(s => s.stale);
      const failed = b.env.sources.filter(s => s.quality === 'FAILED');
      if (!cached.length && !failed.length) return '';
      const oldest = cached.length ? Math.max(...cached.map(s => s.ageMs)) : 0;
      const offline = failed.filter(s => /offline|not reporting/.test(String(s.error || '')));
      return `<div class="mockbar" style="border-color:rgba(230,169,60,.45);background:rgba(230,169,60,.09);color:#E8CB92">
        <b style="color:var(--caution)">${stale.length ? 'Stale data' : failed.length && !cached.length ? 'Data unavailable' : 'Cached data'}</b><br>
        ${offline.length ? `${offline.map(s => esc(s.name.split(' — ')[0])).join(', ')} ${offline.length === 1 ? 'is' : 'are'} not reporting — a NOAA gauge outage, not a fault in this app. ` : ''}
        ${cached.length ? `${cached.length} source${cached.length === 1 ? '' : 's'} could not be refreshed and are showing cached values, oldest ${fmtDuration(oldest)} old. ` : ''}
        ${failed.length ? `${failed.length} source${failed.length === 1 ? ' has' : 's have'} no data at all and are shown as unavailable rather than estimated.` : ''}</div>`;
    })()}
    ${b.env.live ? '' : `<div class="mockbar"><b>Simulated conditions</b><br>
      Wind, wave, tide and current figures below are generated, not observed.
      Switch to live data in Setup. Channel geometry and speeds are real.</div>`}

    <div class="headline">
      <div class="route"><b>${esc(from.name)}</b> → <b>${esc(to.name)}</b>
        · ${t.outbound ? 'Outbound' : 'Inbound'} · ${t.totalNm.toFixed(1)} nm · ${t.condition === 'LIGHT' ? 'Light ship' : 'Loaded'}${b.input.vessel ? ' · ' + esc(b.input.vessel) : ''}</div>
      <div class="tri">
        <div><div class="k">Sail</div><div class="v">${fmtClock(t.sailEpoch, tz)}</div>
          <div class="s">${fmtDay(t.sailEpoch, tz)}</div></div>
        <div><div class="k">${t.pilotOffEpoch ? 'Pilot off' : 'Arrive'}</div>
          <div class="v hero">${fmtClock(t.endEpoch, tz)}</div>
          <div class="s">${t.anchorIndex >= 0 && Math.abs(t.endEpoch - t.originalEndEpoch) >= 60000
            ? `plan ${fmtClock(t.originalEndEpoch, tz)} · ${t.endEpoch > t.originalEndEpoch ? '+' : '−'}${fmtDuration(Math.abs(t.endEpoch - t.originalEndEpoch))}`
            : 'estimated'}</div></div>
        <div><div class="k">Transit</div><div class="v">${fmtDuration(t.endEpoch - t.sailEpoch)}</div>
          <div class="s">${t.converged ? t.iterations + ' pass solve' : 'unconverged'}</div></div>
      </div>
    </div>

    ${ladderHtml}
    ${alertsHtml}

    <div class="rule"></div>
    <p class="eyebrow">What matters</p>
    <div class="grid">
      <div class="cell"><div class="k">Max wind</div>
        <div class="v">${b.maxWind ? Math.round(b.maxWind.windKts) + (b.maxWind.gustKts ? ' G' + Math.round(b.maxWind.gustKts) : '') : '—'}</div>
        <div class="s">${b.maxWind ? compass(b.maxWind.windFromDeg) + ' near ' + esc(b.maxWind.at) : 'No forecast'}</div></div>
      <div class="cell"><div class="k">Max current</div>
        <div class="v">${mc ? mc.kts.toFixed(1) + ' kt' : '—'}</div>
        <div class="s">${mc ? mc.kind.toLowerCase() + ' at ' + fmtClock(mc.t, tz) + ' · ' + esc(mc.location.label) : 'Beyond the current gauges on this route'}</div>
        ${mc ? workBlock([
          wrow('Gauges', esc(mc.stationName || '—')),
          wrow('Velocity', mc.kts.toFixed(2) + ' kt ' + mc.kind.toLowerCase().replace('max ', '')),
          wrow('Time', fmtClock(mc.t, tz)),
          wrow('Ship then', esc(mc.location.label)),
          wrow('Found by', 'strongest value sampled at the ship across the transit'),
          wrow('Sign convention', 'positive = flood, setting upriver'),
          (b.env.checks || []).filter(c => c.biasKts != null).map(c =>
            `observed ${c.biasKts >= 0 ? '+' : ''}${c.biasKts.toFixed(1)} kt vs predicted at ${esc(c.gauge)}`).join('; ') || null
            ? wrow('Prediction check', (b.env.checks || []).filter(c => c.biasKts != null).map(c =>
                `${c.biasKts >= 0 ? '+' : ''}${c.biasKts.toFixed(1)} kt at ${esc(c.gauge)}`).join(', '))
            : null
        ]) : ''}</div>
      <div class="cell"><div class="k">${nextTide ? (nextTide.kind === 'HIGH' ? 'High water' : 'Low water') : 'Tide'}</div>
        <div class="v">${nextTide ? fmtClock(nextTide.t, tz) : '—'}</div>
        <div class="s">${nextTide ? (nextTide.heightFt >= 0 ? '+' : '') + nextTide.heightFt.toFixed(1) + ' ft · ' + esc(nextTide.location.label) : 'No turn during transit'}</div></div>
      <div class="cell"><div class="k">At the station</div>
        <div class="v">${wv && wv.seaFt != null ? wv.seaFt.toFixed(1) + ' ft' : '—'}</div>
        <div class="s">${wv && wv.swellFt != null ? 'swell ' + wv.swellFt.toFixed(1) + ' ft ' + compass(wv.swellFromDeg) + ' / ' + Math.round(wv.swellPeriodS) + ' s' : 'No wave forecast'}</div></div>
      ${(() => {
        const f = b.fogSummary;
        if (!f || f.worst.nm == null) return `<div class="cell wide"><div class="k">Fog</div>
          <div class="v" style="font-size:17px;color:var(--faint)">No visibility data</div>
          <div class="s">No model visibility returned for this route.</div></div>`;
        const lv = visLevel(f.worst.nm);
        const o = b.env.nearestObs;
        const gfs = f.worst.others.length ? f.worst.others[0].nm : null;
        const band = (label, x) => x.any
          ? `${label}: ${fmtDuration(x.durationMs)} / ${x.distanceNm.toFixed(1)} nm`
          : `${label}: none`;
        return `<div class="cell wide fogcard" id="fogCard">
          <div class="k">Fog — ${esc(lv.label.toUpperCase())} during transit</div>
          <div class="v lvl-${lv.cls}">${f.worst.nm.toFixed(1)} nm</div>
          <div class="s">${esc(f.worst.name)} · ETA ${fmtClock(f.worst.eta, tz)} · trend ${esc(f.worst.trend)}</div>
          <div class="fogcard-grid">
            <span>${band('Below 2 nm', f.below2)}</span>
            <span>${band('Below 1 nm', f.below1)}</span>
            <span>HRRR ${f.worst.nm.toFixed(1)} nm</span>
            <span>${gfs != null ? 'GFS ' + gfs.toFixed(1) + ' nm' : 'GFS unavailable'}</span>
          </div>
          ${o ? `<div class="s" style="margin-top:7px">Nearest observation: ${esc(o.station)} ·
            ${o.distanceNm.toFixed(1)} nm away${o.observed != null ? ' · ' + o.observed.toFixed(1) + ' nm observed' : ''}</div>`
            : `<div class="s" style="margin-top:7px">No visibility observation nearby.</div>`}
          ${(b.fogSplit && b.fogSplit.length) ? `<div class="s" style="margin-top:6px;color:var(--caution)">
            Models disagree at ${esc(b.fogSplit[0].point)} — HRRR ${b.fogSplit[0].hrrr.toFixed(1)}, GFS ${b.fogSplit[0].other.toFixed(1)} nm</div>` : ''}
          <div class="fogcard-cta">Open the Fog tab for the full analysis →</div>
        </div>`;
      })()}
      <div class="cell wide">${workBlock([
        wrow('Route', esc(from.name) + ' → ' + esc(to.name)),
        wrow('Distance', t.totalNm.toFixed(2) + ' nm along the marked channel'),
        wrow('Legs', t.legs.length + ' between charted aids'),
        wrow('Condition', t.condition === 'LIGHT' ? 'Light ship' : 'Loaded'),
        b.input.speedOverride ? wrow('Speed override', b.input.speedOverride + ' kt through water on every leg') : null,
        wrow('Sail', fmtClock(t.sailEpoch, tz) + ' (all gone)'),
        wrow('Underway', fmtClock(t.underwayEpoch, tz) + ' — ' + CHANNEL.letGoMinutes + ' min to make way'),
        wrow('Arrive', fmtClock(t.arrivalEpoch, tz)),
        t.pilotOffEpoch ? wrow('Pilot off', fmtClock(t.pilotOffEpoch, tz) + ' — ' + CHANNEL.disembarkMinutes + ' min from the buoy') : null,
        wrow('Method', 'distance ÷ speed over ground per leg'),
        wrow('Current in the loop', t.currentApplied ? 'yes, solved iteratively' : 'no'),
        wrow('Convergence', t.converged ? t.iterations + ' passes, ETAs settled within 20 s' : 'did not converge in 8 passes'),
        wrow('Geometry', 'NOAA ENC aids to navigation'),
        wrow('Speeds', 'pilot-supplied by reach — estimates until logged')
      ])}</div>
    </div>

    <div class="rule"></div>
    <p class="eyebrow">Live observed currents</p>
    <div class="lcgrid">
      ${(b.liveCurrents || []).map(lc => {
        const dirCls = lc.observed == null ? '' : Math.abs(lc.observed) < 0.1 ? 'slack'
          : (lc.observed > 0 ? 'flood' : 'ebb');
        return `<div class="lccard${lc.isFinish ? ' finish' : ''}">
          ${lc.isFinish ? '<div class="lctag">Finish current</div>' : ''}
          <div class="lcname">${esc(lc.name)}</div>

          ${lc.offline
            ? `<div class="lcbig lvl-gap">Live data unavailable</div>
               <div class="lcsub">${esc(lc.error || 'no observations reporting')}</div>`
            : `<div class="lcbig ${dirCls}">${lc.observed != null ? describeCur(lc.observed)
                 : (lc.observedSpeed != null ? lc.observedSpeed.toFixed(1) + ' kt' : '—')}</div>
               ${lc.observed == null && lc.observedSpeed != null
                 ? `<div class="lcsub">Set ${lc.setDeg != null ? Math.round(lc.setDeg) + '°' : 'unknown'} · flood direction unavailable, cannot say flood or ebb</div>` : ''}
               <div class="lcsub">Observed ${fmtClock(lc.at, tz)} · ${fmtDuration(lc.ageMs)} old</div>
               ${lc.stale ? `<div class="lcstale">Stale — ${fmtDuration(lc.ageMs)} old</div>` : ''}`}

          <div class="lcline"><span>Predicted now</span><span>${lc.hasPredictions ? describeCur(lc.predictedNow) : 'no predictions here'}</span></div>
          ${lc.comparison ? `<div class="lccmp${/Close/.test(lc.comparison) ? ' ok' : ''}">${esc(lc.comparison)}</div>` : ''}

          ${lc.isFinish ? `<div class="lceta">
            <div class="lcetak">At your ETA — ${fmtClock(lc.finishEta, tz)}</div>
            <div class="lcetav">${lc.predictedAtEta != null
              ? describeCur(lc.predictedAtEta) + (lc.etaTrend ? ' · ' + esc(lc.etaTrend) : '')
              : 'no prediction available'}</div>
            ${lc.nextSlack ? `<div class="lcsub">Next slack ${fmtClock(lc.nextSlack.t, tz)}</div>` : ''}
            ${lc.event ? `<div class="lcevent">${esc(lc.event)}</div>` : ''}
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>
    <p style="font-size:11.5px;color:var(--faint);line-height:1.55;margin:8px 0 0">
      Observed is a live sensor reading; predicted is the NOAA harmonic prediction. A
      missing observation is never filled in with a prediction. Differences are reported
      and never used to correct future predictions.</p>

    <div class="rule"></div>
    <p class="eyebrow">Update current position</p>
    <div class="uw" id="cpBox"></div>

    <div class="rule"></div>
    <p class="eyebrow">Underway</p>
    <div class="uw" id="underway"></div>

    <div class="rule"></div>
    <p class="eyebrow">Timeline${t.anchorIndex >= 0
      ? ` · updated from ${esc(t.waypoints[t.anchorIndex].point.name)}` : ''}</p>
    <div class="ribbon">${ribbon}</div>

    ${(b.env.checks && b.env.checks.length) ? `<div class="rule"></div>
    <p class="eyebrow">Prediction check</p>
    ${b.env.checks.map(c => `<div class="src">
      <span class="n">${esc(c.gauge)}<br><span style="color:var(--faint);font-size:11px">observed ${fmtClock(c.at, tz)}</span></span>
      <span class="st" style="font-size:13px;color:var(--ink);text-align:right">
        ${!c.signed || c.observedKts == null
          ? `${c.speedKts != null ? c.speedKts.toFixed(1) : '—'} kt${c.setDeg != null ? ' set ' + Math.round(c.setDeg) + '°' : ''}`
          : (Math.abs(c.observedKts) < 0.15 ? 'slack'
             : `${c.observedKts > 0 ? 'flood' : 'ebb'} ${Math.abs(c.observedKts).toFixed(1)} kt`)}
        ${!c.signed
          ? `<br><span style="font-size:11px;color:var(--faint)">flood direction unavailable — cannot say flood or ebb</span>`
          : c.biasKts != null
            ? `<br><span style="font-size:11px;color:${Math.abs(c.biasKts) >= 0.4 ? 'var(--caution)' : 'var(--faint)'}">${c.biasKts >= 0 ? '+' : ''}${c.biasKts.toFixed(1)} kt vs predicted</span>`
            : `<br><span style="font-size:11px;color:var(--faint)">no prediction here to compare</span>`}
      </span></div>`).join('')}` : ''}

    <div class="rule"></div>
    <p class="eyebrow">Data sources</p>
    ${srcHtml}
    ${b.env.gaps.length ? `<p class="gapnote" style="margin-top:12px">${b.env.gaps.length} station assignments are unmapped on this route. Points without a current station are shown as “No current” rather than borrowing a neighbour's reading.</p>` : ''}

    <div class="foot">
      All times are estimates, shown in port local time. Speed over ground
      includes the along-channel current component, solved iteratively.
      Cross-channel set is not modelled.<br><br>
      Decision support only. Verify against official sources before use.
    </div>`;

  $('#bBack').addEventListener('click', () => show('viewPlan'));
  renderCheckpoints();
  const fogCard = $('#fogCard');
  if (fogCard) fogCard.addEventListener('click', () => { show('viewFog'); renderFog(); });
  renderUnderway();
  document.querySelectorAll('[data-work]').forEach(btn => {
    btn.addEventListener('click', () => {
      const el = document.getElementById(btn.dataset.work);
      el.classList.toggle('on');
      btn.textContent = el.classList.contains('on') ? 'Hide working' : 'Show working';
    });
  });
}

/* ---------- admin ---------- */
function renderAdmin() {
  const th = Store.get('thresholds', DEFAULT_THRESHOLDS);
  const berthRows = selectablePoints().map(p => {
    let outNm = '—', inNm = '—';
    try { outNm = buildLegs(p.id, PILOT_ID).totalNm.toFixed(2); } catch (e) {}
    try { inNm = buildLegs(PILOT_ID, p.id).totalNm.toFixed(2); } catch (e) {}
    return `<tr><td>${esc(p.name)}</td><td class="n">${outNm}</td><td class="n">${inNm}</td></tr>`;
  }).join('');

  const logs = Store.get('transitLogs', []);
  const agg = {};
  for (const lg of logs)
    for (const o of (lg.observed || [])) {
      const k = o.zone + '|' + o.condition;
      (agg[k] = agg[k] || []).push({ v: o.median, n: o.n });
    }
  const planFor = (zone, cond) => {
    const e = CHANNEL.edges.find(x => x.zone === zone);
    return e ? (cond === 'LIGHT' ? e.light : e.loaded) : null;
  };
  const logRows = Object.entries(agg).map(([k, arr]) => {
    const [zone, cond] = k.split('|');
    const vals = arr.map(a => a.v).sort((a, b) => a - b);
    const med = vals[Math.floor(vals.length / 2)];
    const plan = planFor(zone, cond);
    const n = arr.reduce((s, a) => s + a.n, 0);
    return `<tr><td>${esc(zone)}</td><td>${cond === 'LIGHT' ? 'Light' : 'Loaded'}</td>
      <td class="n">${plan != null ? plan.toFixed(1) : '—'}</td>
      <td class="n">${med.toFixed(1)}</td><td class="n">${n}</td></tr>`;
  }).join('');

  const seenZones = [];
  for (const e of CHANNEL.edges)
    if (e.zone && !seenZones.some(z => z.zone === e.zone)) seenZones.push(e);
  const ov = speedOverrides();
  const zoneRows = seenZones.map(e => {
    const lk = e.zone + '|LOADED', gk = e.zone + '|LIGHT';
    const edited = ov[lk] != null || ov[gk] != null;
    return `<tr><td>${esc(e.zone)}${edited ? ' <span class="badge gap">edited</span>' : ''}</td>
      <td><input class="spd" data-key="${esc(lk)}" inputmode="decimal" value="${e.loaded.toFixed(1)}"></td>
      <td><input class="spd" data-key="${esc(gk)}" inputmode="decimal" value="${e.light.toFixed(1)}"></td></tr>`;
  }).join('');

  const oneWay = CHANNEL.edges.filter(e => e.dir !== 'BOTH').map(e =>
    `<tr><td>${esc(pointById(e.a).name)} → ${esc(pointById(e.b).name)}</td>
      <td class="n">${e.nm.toFixed(2)}</td></tr>`).join('');

  $('#viewAdmin').innerHTML = `
    <button class="backbtn" id="aBack">← Back</button>

    <div class="adminsec">
      <p class="eyebrow">Channel — ${esc(CHANNEL.meta.name)}</p>
      <div class="mockbar"><b>Geometry from NOAA ENC</b><br>
        ${CHANNEL.nodes.length} nodes, ${CHANNEL.edges.length} edges. Distances and courses are
        computed from aid-to-navigation coordinates, not entered by hand. Segment speeds are
        still estimates and need your numbers.</div>
      <table class="data"><thead><tr><th>Berth</th><th style="text-align:right">Out nm</th><th style="text-align:right">In nm</th></tr></thead>
        <tbody>${berthRows}</tbody></table>
    </div>

    <div class="adminsec">
      <p class="eyebrow">Speeds by reach</p>
      <table class="data"><thead><tr><th>Reach</th><th style="text-align:right">Loaded</th><th style="text-align:right">Light</th></tr></thead>
        <tbody>${zoneRows}</tbody></table>
      <p style="font-size:12px;color:var(--faint);margin:10px 0 0;line-height:1.5">
        Edit any figure and it takes effect on the next brief. Edits survive app updates.</p>
      <button class="btn danger" id="aResetSpeeds" style="margin-top:10px">Restore original speeds</button>
      <span id="aSpdMsg" style="font-size:12px;color:var(--dim)"></span>
    </div>

    <div class="adminsec">
      <p class="eyebrow">One-way legs</p>
      <table class="data"><thead><tr><th>Leg</th><th style="text-align:right">nm</th></tr></thead>
        <tbody>${oneWay}</tbody></table>
    </div>

    <div class="adminsec">
      <p class="eyebrow">Data</p>
      <div class="seg" id="aLive">
        <button type="button" data-v="0"${!Store.get('liveData', false) ? ' class="on"' : ''}>Simulated</button>
        <button type="button" data-v="1"${Store.get('liveData', false) ? ' class="on"' : ''}>Live</button>
      </div>
      <p style="font-size:12.5px;color:var(--dim);margin:12px 0 0;line-height:1.55">
        Live pulls wind, gusts and visibility from the NWS gridded forecast at each
        waypoint's own position, waves and swell from Open-Meteo's marine model, and
        tide predictions from NOAA CO-OPS. Harmonic current predictions cover the lower
        channel only — above that, currents show as unavailable rather than guessed.</p>
      <p style="font-size:12.5px;color:var(--faint);margin:10px 0 0;line-height:1.55">
        Satellite fog imagery isn't a forecast and can't be built into the brief:
        <a href="https://www.ospo.noaa.gov/products/atmosphere/clouds/fls/" style="color:var(--info)">open the GOES fog product</a>.</p>
    </div>

    <div class="adminsec">
      <p class="eyebrow">Offline</p>
      <table class="data"><tbody>
        <tr><td>Cached datasets</td><td class="n">${Object.keys(Store.get('envCache', {})).length}</td></tr>
        <tr><td>Storage</td><td class="n">${Store.persistent ? 'persistent' : 'session only'}</td></tr>
        <tr><td>Shell cached</td><td class="n">${('serviceWorker' in navigator) ? 'supported' : 'unsupported'}</td></tr>
      </tbody></table>
      <p style="font-size:12.5px;color:var(--dim);margin:12px 0 0;line-height:1.55">
        Build the brief before you sail. If a source can't be refreshed later, the cached
        copy is used and labelled with its age — the brief will say so rather than look fresh.</p>
      <button class="btn danger" id="aClearCache" style="margin-top:10px">Clear cache</button>
      <span id="aCacheMsg" style="font-size:12px;color:var(--dim)"></span>
    </div>

    <div class="adminsec">
      <p class="eyebrow">Alert thresholds</p>
      <div class="field"><label for="aTh">JSON</label>
        <textarea class="control" id="aTh">${esc(JSON.stringify(th, null, 2))}</textarea></div>
      <button class="btn" id="aSave">Save thresholds</button>

      <table class="data"><tbody>
        <tr><td>Let go to underway</td><td class="n">${CHANNEL.letGoMinutes} min</td></tr>
        <tr><td>Station to pilot off</td><td class="n">${CHANNEL.disembarkMinutes} min</td></tr>
        <tr><td>Port timezone</td><td class="n">${esc(CHANNEL.meta.timezone)}</td></tr>
        <tr><td>Geometry source</td><td class="n">NOAA ENC</td></tr>
        <tr><td>Storage</td><td class="n">${Store.persistent ? 'persistent' : 'session only'}</td></tr>
      </tbody></table>
    </div>

    <div class="adminsec">
      <p class="eyebrow">Observed vs planned speed</p>
      ${logRows ? `<table class="data"><thead><tr><th>Reach</th><th>Cond</th>
        <th style="text-align:right">Plan</th><th style="text-align:right">Actual</th>
        <th style="text-align:right">n</th></tr></thead><tbody>${logRows}</tbody></table>
        <p style="font-size:12px;color:var(--faint);margin:10px 0 0;line-height:1.5">
          Medians across saved transits. Once a reach has a few jobs behind it, the actual
          figure is better evidence than the planned one.</p>`
        : `<p style="font-size:12.5px;color:var(--dim);margin:0;line-height:1.55">
          No transits logged yet. Start tracking on a brief and save the log at the end;
          observed speeds per reach will build up here and can replace the estimates.</p>`}
    </div>

    <div class="adminsec">
      <p class="eyebrow">Engine self-test</p>
      <p style="font-size:12.5px;color:var(--dim);margin:0 0 12px">
        Known inputs, known outputs. Run this after any edit to the channel data or engine.</p>
      <button class="btn" id="aTest">Run tests</button>
      <div class="testout" id="aTestOut" style="display:none"></div>
    </div>`;

  }));

    catch (e) { $('#aMsg').textContent = 'Not valid JSON — nothing saved.'; }

  $('#aReset').addEventListener('click', () => {

  document.querySelectorAll('input.spd').forEach(inp => inp.addEventListener('change', () => {
