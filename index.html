<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060B10">
<title>Transit Brief</title>
<style>
:root{
  --sea:#060B10; --hull:#0E1720; --deck:#16222E; --raise:#1D2C3A;
  --line:#223243; --line-soft:#18242F;
  --ink:#E9F1F7; --dim:#8FA5B8; --faint:#5C7185;
  --stbd:#35B37E; --port:#E05A52; --caution:#E6A93C; --info:#4E9AD4;
  --mock:#8B6FE0;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--sea); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
button,select,input{font-family:inherit;font-size:inherit;color:inherit;font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---- chrome ---- */
.top{
  position:sticky;top:0;z-index:40;background:rgba(6,11,16,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
  display:flex;align-items:center;gap:12px;
}
.mark{
  width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--stbd);
  border-radius:50%;position:relative;
}
.mark::after{
  content:"";position:absolute;left:50%;top:3px;bottom:3px;width:1.5px;
  background:var(--stbd);transform:translateX(-50%) rotate(22deg);transform-origin:center;
}
.top h1{font-size:15px;font-weight:640;margin:0;letter-spacing:-.01em;flex:1}
.top h1 small{display:block;font-size:10px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin-top:1px}
.iconbtn{
  background:none;border:1px solid var(--line);border-radius:8px;
  color:var(--dim);padding:7px 11px;font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;cursor:pointer;
}
.iconbtn:active{background:var(--deck)}

.tabs{position:sticky;top:0;z-index:39;display:flex;gap:0;background:rgba(6,11,16,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:0 16px}
.tabs button{
  flex:1;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--faint);padding:13px 4px;font-size:12px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;cursor:pointer;
}
.tabs button.on{color:var(--ink);border-bottom-color:var(--stbd)}
.tabs.hide{display:none}
.wrap{padding:18px 16px 80px;max-width:640px;margin:0 auto}
.tcgraph{width:100%;height:150px;display:block;margin:6px 0 2px}
.tcrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--line-soft);font-size:13.5px;align-items:baseline}
.tcrow:last-child{border-bottom:none}
.tcrow .tm{font-family:var(--mono);font-weight:600;flex:0 0 52px}
.tcrow .ev{flex:1;color:var(--dim)}
.tcrow .vl{font-family:var(--mono);font-weight:600;text-align:right}
.flood{color:var(--stbd)} .ebb{color:var(--port)} .slack{color:var(--dim)}
.calcbox{border:1px solid var(--line);border-radius:12px;background:var(--hull);padding:15px;margin-top:10px}
.calcres{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.calcres .cell{padding:11px 12px}
.stationmeta{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:8px}
.corridor{width:100%;height:auto;display:block;margin:8px 0}
.scrub{display:flex;gap:5px;margin:12px 0 4px}
.scrub button{flex:1;background:var(--hull);border:1px solid var(--line);border-radius:8px;
  color:var(--dim);padding:9px 2px;font-size:11px;font-weight:700;letter-spacing:.06em;cursor:pointer}
.scrub button.on{background:var(--deck);border-color:var(--stbd);color:var(--ink)}
.fogrow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:10px 0;border-bottom:1px solid var(--line-soft)}
.fogrow:last-child{border-bottom:none}
.fogrow .pl{flex:1}
.fogrow .pl b{font-size:13.5px;font-weight:650}
.fogrow .pl span{display:block;font-size:11px;color:var(--faint);margin-top:1px}
.fogrow .vv{font-family:var(--mono);font-size:16px;font-weight:600;text-align:right}
.fogrow .tr{font-size:11px;color:var(--faint);display:block;font-weight:400;font-family:var(--sans)}
.lcgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:520px){.lcgrid{grid-template-columns:1fr 1fr}}
.lccard{border:1px solid var(--line);border-radius:11px;background:var(--hull);padding:13px;position:relative}
.lccard.finish{border-color:var(--stbd)}
.lctag{font-size:9px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;
  color:var(--stbd);margin-bottom:4px}
.lcname{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.lcbig{font-family:var(--mono);font-size:21px;font-weight:600;margin-top:5px;line-height:1.2}
.lcbig.flood{color:var(--stbd)} .lcbig.ebb{color:var(--port)} .lcbig.slack{color:var(--dim)}
.lcsub{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.45}
.lcstale{font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--caution);margin-top:5px}
.lcline{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--dim);
  margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft)}
.lcline span:last-child{font-family:var(--mono);color:var(--ink)}
.lccmp{font-size:11.5px;color:var(--caution);margin-top:5px;line-height:1.4}
.lccmp.ok{color:var(--stbd)}
.lceta{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft)}
.lcetak{font-size:9px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.lcetav{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:3px}
.lcevent{font-size:10.5px;font-weight:750;letter-spacing:.1em;text-transform:uppercase;
  color:var(--caution);margin-top:7px;line-height:1.4}
.fogcard{cursor:pointer;position:relative}
.fogcard:active{background:var(--deck)}
.fogcard-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:9px;
  font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.fogcard-cta{margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft);
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.lvl-port{color:var(--port)} .lvl-caution{color:var(--caution)}
.lvl-stbd{color:var(--stbd)} .lvl-gap{color:var(--faint)}
.view{display:none}
.view.on{display:block}

/* ---- typographic devices ---- */
.eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;
  color:var(--faint);margin:0 0 8px;
}
.rule{height:1px;background:var(--line-soft);margin:22px 0}

/* ---- form ---- */
.field{margin-bottom:14px}
.field label{
  display:block;font-size:10px;font-weight:700;letter-spacing:.17em;
  text-transform:uppercase;color:var(--faint);margin-bottom:6px;
}
.control{
  width:100%;background:var(--hull);border:1px solid var(--line);
  border-radius:10px;padding:14px 13px;font-size:17px;font-weight:500;
  appearance:none;-webkit-appearance:none;
}
select.control{
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),
    linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:38px;
}
.control:focus{outline:none;border-color:var(--info);box-shadow:0 0 0 3px rgba(78,154,212,.16)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swap{
  display:flex;align-items:center;gap:10px;margin:-4px 0 12px;
}
.swap button{
  background:var(--hull);border:1px solid var(--line);border-radius:8px;
  color:var(--dim);padding:5px 10px;font-size:11px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;cursor:pointer;
}
.swap .dirtag{
  font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--info);
}
details.opt{border-top:1px solid var(--line-soft);margin-top:18px;padding-top:14px}
details.opt summary{
  list-style:none;cursor:pointer;font-size:10px;font-weight:700;
  letter-spacing:.17em;text-transform:uppercase;color:var(--faint);
}
details.opt summary::-webkit-details-marker{display:none}
details.opt summary::after{content:"  +";color:var(--faint)}
details.opt[open] summary::after{content:"  −"}
details.opt .inner{padding-top:16px}

.uw{border:1px solid var(--line);border-radius:11px;background:var(--hull);padding:13px}
.uline{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
  padding:6px 0;border-bottom:1px solid var(--line-soft)}
.uline:last-of-type{border-bottom:none}
.uline .k{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);flex:0 0 auto}
.uline .v{font-size:14px;font-weight:600;text-align:right}
input.spd{width:62px;background:var(--deck);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);padding:6px 8px;font-size:13px;text-align:right;font-family:var(--mono)}
input.spd:focus{outline:none;border-color:var(--info)}
.seg{display:flex;gap:6px}
.seg button{
  flex:1;background:var(--hull);border:1px solid var(--line);border-radius:10px;
  color:var(--dim);padding:13px 8px;font-size:14px;font-weight:600;cursor:pointer;
}
.seg button.on{background:var(--deck);border-color:var(--stbd);color:var(--ink)}
.generate{
  width:100%;margin-top:24px;padding:19px;border:none;border-radius:12px;
  background:var(--stbd);color:#04150D;font-size:15px;font-weight:750;
  letter-spacing:.13em;text-transform:uppercase;cursor:pointer;
}
.generate:active{background:#2b8f66}

/* ---- brief header ---- */
.headline{
  border:1px solid var(--line);border-radius:14px;background:var(--hull);
  padding:16px;margin-bottom:14px;
}
.headline .route{
  font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--dim);
  margin-bottom:14px;line-height:1.5;
}
.headline .route b{color:var(--ink);font-weight:650}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;text-align:left}
.tri>div{padding-right:8px}
.tri .k{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.tri .v{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.15;margin-top:3px}
.tri .v.hero{color:var(--stbd)}
.tri .s{font-size:11px;color:var(--faint);margin-top:1px}

/* ---- ladder card ---- */
.ladder{
  border:1px solid var(--line);border-left:4px solid var(--line);
  border-radius:12px;background:var(--hull);padding:15px 16px;margin-bottom:14px;
}
.ladder.stbd{border-left-color:var(--stbd)}
.ladder.port{border-left-color:var(--port)}
.ladder.mixed{border-left-color:var(--caution)}
.ladder .side{
  font-size:26px;font-weight:750;letter-spacing:-.01em;margin:2px 0 2px;
}
.ladder.stbd .side{color:var(--stbd)}
.ladder.port .side{color:var(--port)}
.ladder.mixed .side{color:var(--caution);font-size:19px;line-height:1.25}
.ladder .why{font-size:13px;color:var(--dim);line-height:1.5;margin-top:6px}
.ladder .disc{
  font-size:11px;color:var(--faint);margin-top:11px;padding-top:10px;
  border-top:1px solid var(--line-soft);line-height:1.45;
}
.showwork{
  background:none;border:1px solid var(--line);border-radius:7px;color:var(--dim);
  padding:6px 11px;font-size:10px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;margin-top:11px;cursor:pointer;
}
.work{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:11px;display:none}
.work.on{display:block}
.work table{width:100%;border-collapse:collapse;font-size:12px}
.work td{padding:5px 0;border-bottom:1px solid var(--line-soft);color:var(--dim)}
.work td:last-child{text-align:right;color:var(--ink);font-family:var(--mono)}
.work tr:last-child td{border-bottom:none}

/* ---- alerts ---- */
.alert{
  display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);
  border-radius:10px;background:var(--hull);padding:12px 13px;margin-bottom:8px;
}
.alert .bar{width:3px;align-self:stretch;border-radius:2px;background:var(--caution);flex:0 0 3px}
.alert.info .bar{background:var(--info)}
.alert .t{font-size:11px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:var(--caution)}
.alert.info .t{color:var(--info)}
.alert .d{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.45}

/* ---- key conditions grid ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.cell{border:1px solid var(--line);border-radius:11px;background:var(--hull);padding:12px 13px}
.cell .k{font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--faint)}
.cell .v{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:4px;line-height:1.2}
.cell .s{font-size:11.5px;color:var(--dim);margin-top:4px;line-height:1.4}
.cell.wide{grid-column:1/-1}

/* ---- the ribbon: signature element ---- */
.ribbon{position:relative;margin:6px 0 0;padding-left:30px}
.ribbon::before{
  content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(180deg,var(--line) 0%,var(--raise) 12%,var(--raise) 88%,var(--line) 100%);
}
.stop{position:relative;padding:0 0 20px}
.stop::before{
  content:"";position:absolute;left:-26px;top:6px;width:9px;height:9px;
  border-radius:50%;background:var(--sea);border:2px solid var(--dim);
}
.stop.major::before{border-color:var(--ink);background:var(--ink)}
.stop.turn::before{border-radius:1px;transform:rotate(45deg)}
.stop.term::before{border-color:var(--stbd);background:var(--stbd);width:11px;height:11px;left:-27px}
.stop .time{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.01em}
.stop.anchor::before{border-color:var(--info);background:var(--info)}
.cptag{font-family:var(--sans);font-size:8.5px;font-weight:750;letter-spacing:.12em;
  color:var(--info);margin-left:7px;vertical-align:2px}
.orig{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;
  color:var(--faint);letter-spacing:0;margin-top:1px}
.stop .name{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:1px}
.stop .meta{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.55}
.stop .meta .sep{color:var(--faint);padding:0 5px}
.stop.evt::before{
  border-color:var(--caution);background:var(--sea);width:7px;height:7px;left:-25px;top:8px;
}
.stop.evt .time{font-size:14px;color:var(--caution)}
.stop.evt .name{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--caution)}
.stop.evt .meta{font-size:12px}
.stop.tideevt::before{border-color:var(--info)}
.stop.tideevt .time,.stop.tideevt .name{color:var(--info)}

/* ---- badges & sources ---- */
.badge{
  display:inline-block;font-size:9px;font-weight:750;letter-spacing:.13em;
  text-transform:uppercase;padding:2.5px 7px;border-radius:4px;vertical-align:2px;
}
.badge.mock{background:rgba(139,111,224,.16);color:var(--mock);border:1px solid rgba(139,111,224,.4)}
.badge.stale{background:rgba(230,169,60,.14);color:var(--caution);border:1px solid rgba(230,169,60,.4)}
.badge.gap{background:rgba(92,113,133,.16);color:var(--faint);border:1px solid var(--line)}
.mockbar{
  border:1px solid rgba(139,111,224,.4);background:rgba(139,111,224,.09);
  border-radius:10px;padding:11px 13px;margin-bottom:14px;
  font-size:12px;color:#C3B2F0;line-height:1.5;
}
.mockbar b{color:var(--mock);font-weight:750;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px}
.src{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.src:last-child{border-bottom:none}
.src .n{color:var(--dim)}
.src .st{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right}
.gapnote{font-size:12px;color:var(--faint);font-style:italic}

/* ---- admin ---- */
.adminsec{margin-bottom:26px}
table.data{width:100%;border-collapse:collapse;font-size:12px}
table.data th{
  text-align:left;font-size:9px;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--faint);padding:6px 6px 6px 0;
  border-bottom:1px solid var(--line);
}
table.data td{padding:7px 6px 7px 0;border-bottom:1px solid var(--line-soft);color:var(--dim)}
table.data td.n{font-family:var(--mono);color:var(--ink);text-align:right}
textarea.control{min-height:190px;font-family:var(--mono);font-size:12px;line-height:1.5}
.testout{
  font-family:var(--mono);font-size:11.5px;line-height:1.65;background:var(--hull);
  border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:12px;
  white-space:pre-wrap;max-height:340px;overflow:auto;
}
.testout .p{color:var(--stbd)} .testout .f{color:var(--port)}
.btn{
  background:var(--deck);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  padding:12px 16px;font-size:12px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;cursor:pointer;margin-right:8px;margin-bottom:8px;
}
.btn:active{background:var(--raise)}
.btn.danger{color:var(--port);border-color:rgba(224,90,82,.4)}

.foot{
  margin-top:34px;padding-top:16px;border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--faint);line-height:1.6;
}
.backbtn{
  background:none;border:none;color:var(--dim);padding:0 0 14px;font-size:12px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;
}
@media (prefers-reduced-motion:no-preference){
  .stop{animation:rise .34s cubic-bezier(.22,.9,.3,1) backwards}
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>

<header class="top">
  <div class="mark" aria-hidden="true"></div>
  <h1>Transit Brief<small id="portname">Calcasieu Ship Channel</small></h1>
  <button class="iconbtn" id="navBtn">Setup</button>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="viewPlan" class="on">Transit</button>
  <button data-tab="viewTides">Tides</button>
  <button data-tab="viewFog">Fog</button>
</nav>

<main class="wrap">
  <section class="view on" id="viewPlan"></section>
  <section class="view" id="viewBrief"></section>
  <section class="view" id="viewTides"></section>
  <section class="view" id="viewFog"></section>
  <section class="view" id="viewAdmin"></section>
</main>

  },

  },
  {

   "name": "Cameron Fishing Pier",

/* ---------------------------------------------------------------- UNITS ---
   Every direction carries an explicit convention. There is no such thing
   as a bare bearing in this system. FROM = where it comes from (wind, waves,
   swell). TOWARD = where it flows to (current set, vessel heading).
   -------------------------------------------------------------------------*/

const FROM = 'FROM';
const TOWARD = 'TOWARD';

function dir(deg, convention) {
  if (convention !== FROM && convention !== TOWARD) {
    throw new Error('direction requires an explicit FROM/TOWARD convention');
  }
  return { deg: norm360(deg), convention };
}

function asFrom(d) {
  if (!d) return null;
  return d.convention === FROM ? d : dir(d.deg + 180, FROM);
}

function asToward(d) {
  if (!d) return null;
  return d.convention === TOWARD ? d : dir(d.deg + 180, TOWARD);
}

function norm360(deg) {
  let x = deg % 360;
  if (x < 0) x += 360;
  return x;
}

// Signed shortest angle a -> b, in (-180, 180]. Negative = b is to the left of a.
function relAngle(a, b) {
  let d = norm360(b - a);
  if (d > 180) d -= 360;
  return d;
}

const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function compass(deg) {
  return COMPASS[Math.round(norm360(deg) / 22.5) % 16];
}

/* ------------------------------------------------------------- TIME -------
   All internal time is epoch milliseconds. Formatting to port-local wall
   clock happens only at the presentation edge. DST is handled by Intl.
   -------------------------------------------------------------------------*/

function tzOffsetMs(epoch, tz) {
  const dtf = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false,
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  });
  const p = {};
  for (const part of dtf.formatToParts(new Date(epoch))) {
    if (part.type !== 'literal') p[part.type] = part.value;
  }
  const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day,
    p.hour === '24' ? 0 : +p.hour, +p.minute, +p.second);
  return asUTC - epoch;
}

// Convert a port-local wall clock reading into a true epoch timestamp.
function wallToEpoch(y, mo, d, h, mi, tz) {
  const naive = Date.UTC(y, mo - 1, d, h, mi, 0);
  let guess = naive;
  for (let i = 0; i < 3; i++) guess = naive - tzOffsetMs(guess, tz);
  return guess;
}

function fmtClock(epoch, tz) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour12: false, hour: '2-digit', minute: '2-digit'
  }).format(new Date(epoch));
}

function fmtDay(epoch, tz) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: tz, weekday: 'short', month: 'short', day: 'numeric'
  }).format(new Date(epoch));
}

function fmtDuration(ms) {
  const total = Math.round(ms / 60000);
  const h = Math.floor(total / 60), m = total % 60;
  return h > 0 ? `${h}h ${String(m).padStart(2, '0')}m` : `${m}m`;
}

const MIN = 60000, HOUR = 3600000;

/* ---------------------------------------------------------- CHANNEL -------
   Graph model. Nodes carry real coordinates; edge distances and courses are
   COMPUTED from those coordinates, never typed in. Edges may be one-way,
   which is how the Clooney Island loop is represented.

   Node geometry is the channel position (berths snapped to the marked
   channel). Node.wx, when present, is the berth's true pin, used for
   weather lookup only.
   -------------------------------------------------------------------------*/

var CHANNEL = typeof CHANNEL_DATA !== 'undefined' ? CHANNEL_DATA : null;

const EARTH_NM = 3440.065;

function haversineNm(a, b) {
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const dla = la2 - la1, dlo = (b.lon - a.lon) * Math.PI / 180;
  const h = Math.sin(dla / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dlo / 2) ** 2;
  return 2 * Math.asin(Math.sqrt(h)) * EARTH_NM;
}

function initialBearing(a, b) {
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const dlo = (b.lon - a.lon) * Math.PI / 180;
  const y = Math.sin(dlo) * Math.cos(la2);
  const x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dlo);
  return norm360(Math.atan2(y, x) * 180 / Math.PI);
}

function buildGraph(ch) {
  const nodes = {}, adj = {};
  for (const n of ch.nodes) { nodes[n.id] = n; adj[n.id] = []; }
  for (const e of ch.edges) {
    const A = nodes[e.a], B = nodes[e.b];
    if (!A || !B) throw new Error('edge references a missing node: ' + e.a + '/' + e.b);
    const nm = e.nm != null ? e.nm : haversineNm(A, B);
    adj[e.a].push({ to: e.b, edge: e, nm, course: initialBearing(A, B) });
    if (e.dir === 'BOTH')
      adj[e.b].push({ to: e.a, edge: e, nm, course: initialBearing(B, A) });
  }
  return { nodes, adj };
}

function pointById(id, ch) {
  ch = ch || CHANNEL;
  const p = ch.nodes.find(x => x.id === id);
  if (!p) throw new Error('unknown point: ' + id);
  return p;
}

function selectablePoints(ch) {
  ch = ch || CHANNEL;
  return ch.nodes.filter(n =>
    n.type === 'BERTH' || n.type === 'ANCHORAGE' || n.type === 'PILOT_STATION');
}

/* Dijkstra over the directed graph. Shortest navigable path, honouring

const LOADED = 'LOADED', LIGHT = 'LIGHT';

/** Speed for an edge under the given loading condition. */
function edgeSpeed(edge, condition) {
  const v = condition === LIGHT ? edge.light : edge.loaded;
  if (v == null) throw new Error('edge has no speed for condition ' + condition);

function buildLegs(fromId, toId, ch, condition) {

  const route = path.map(id => g.nodes[id]);
  const legs = [];
  for (let i = 0; i < path.length - 1; i++) {
    const link = prev[path[i + 1]].link;
    const from = g.nodes[path[i]], to = g.nodes[path[i + 1]];
    legs.push({
      from, to,
      distanceNm: link.nm,
      course: link.course,
      zone: link.edge.zone || null,
      defaultSpeed: edgeSpeed(link.edge, condition),
      speedLoaded: link.edge.loaded,
      speedLight: link.edge.light,
      oneWay: link.edge.dir !== 'BOTH',
      note: link.edge.note || null,
      // Chainage of the leg midpoint — the position at which current is sampled.
      currentKey: (from.chainNm != null && to.chainNm != null)
        ? String((from.chainNm + to.chainNm) / 2) : null,
      currentStation: (from.stations && from.stations.current) || null
    });
  }

  // Direction of travel, for the sign of the along-channel current component.
  // Measured against the seaward end of the channel, which is fixed — there
  // are several boarding points, so "toward the pilot station" is ambiguous.
  const seaward = ch.nodes.find(n => n.id === ch.seawardNodeId) ||
                  ch.nodes.find(n => n.type === 'PILOT_STATION');
  const outbound = seaward
    ? haversineNm(route[route.length - 1], seaward) < haversineNm(route[0], seaward)
    : false;

  return { outbound, route, legs, totalNm: dist[toId] };
}

/**
 * @param opts.currentAt (stationId, epoch) -> { signedKts, ... } | null
 *        signedKts positive = flood = flow toward INCREASING mile (upriver)
 */
function solveTransit(opts) {
  const ch = opts.channel || CHANNEL;
  const condition = opts.condition || LOADED;
  const { outbound, route, legs } = buildLegs(opts.fromId, opts.toId, ch, condition);
  const dirSign = outbound ? -1 : 1;
  const speedOverride = opts.speedOverride || null;
  const currentAt = opts.currentAt || (() => null);
  const applyCurrent = opts.applyCurrent !== false;

  const startPoint = route[0];
  const underway = startPoint.type === 'BERTH'
    ? opts.sailEpoch + ch.letGoMinutes * MIN
    : opts.sailEpoch;

  let etas = null;
  let iterations = 0;
  let converged = false;

  for (let pass = 0; pass < 8; pass++) {
    iterations = pass + 1;
    const next = [underway];
    for (let i = 0; i < legs.length; i++) {
      const leg = legs[i];
      const stw = speedOverride != null ? speedOverride : leg.defaultSpeed;
      let sog = stw;
      let cur = null;
      if (applyCurrent && leg.currentKey) {
        // Sample at the leg's provisional midpoint time.
        const t0 = next[i];
        const guessDur = (leg.distanceNm / Math.max(stw, 0.5)) * HOUR;
        const tMid = etas ? (etas[i] + (etas[i + 1] - etas[i]) / 2) : t0 + guessDur / 2;
        cur = currentAt(leg.currentStation, tMid);
        if (cur && typeof cur.signedKts === 'number') {
          sog = stw + dirSign * cur.signedKts;
        }
      }
      sog = Math.max(sog, 1.0); // never divide by a stopped ship
      leg.stw = stw;
      leg.sog = sog;
      leg.current = cur;
      next.push(next[i] + (leg.distanceNm / sog) * HOUR);
    }

    if (etas) {
      const maxDelta = Math.max(...next.map((t, i) => Math.abs(t - etas[i])));
      etas = next;
      if (maxDelta < 20000) { converged = true; break; }
    } else {
      etas = next;
    }
  }

  /* ---- checkpoint anchoring ----
     A reported passing time at a checkpoint re-anchors everything ahead of it.
     Points already passed keep the time they were given: an actual where one
     was reported, otherwise the original plan. Points ahead are recomputed by
     the same distance-over-speed-over-ground logic, walked forward from the
     anchor — not shifted by a constant offset. */
  const originalEtas = etas.slice();
  const anchors = (opts.anchors || [])
    .map(a => ({ ...a, index: route.findIndex(p => p.id === a.nodeId) }))
    .filter(a => a.index >= 0)
    .sort((x, y) => x.index - y.index);

  let anchorIndex = -1;
  if (anchors.length) {
    const last = anchors[anchors.length - 1];
    anchorIndex = last.index;

    // Times up to the anchor: actuals where reported, otherwise the plan.
    for (const a of anchors) etas[a.index] = a.epoch;

    // Forward from the anchor, iterating so current is sampled at the times
    // the ship will actually be there.
    let forward = null;
    for (let pass = 0; pass < 6; pass++) {
      const next = etas.slice();
      let t = last.epoch;
      for (let i = last.index; i < legs.length; i++) {
        const leg = legs[i];
        const stw = speedOverride != null ? speedOverride : leg.defaultSpeed;
        let sog = stw;
        if (applyCurrent && leg.currentKey) {
          const guess = (leg.distanceNm / Math.max(stw, 0.5)) * HOUR;
          const tMid = forward ? (forward[i] + (forward[i + 1] - forward[i]) / 2) : t + guess / 2;
          const cur = currentAt(leg.currentKey, tMid);
          if (cur && typeof cur.signedKts === 'number') sog = stw + dirSign * cur.signedKts;
        }
        sog = Math.max(sog, 1.0);
        leg.stw = stw; leg.sog = sog;
        t += (leg.distanceNm / sog) * HOUR;
        next[i + 1] = t;
      }
      const settled = forward && Math.max(...next.map((v, i) => Math.abs(v - forward[i]))) < 20000;
      forward = next;
      if (settled) break;
    }
    for (let i = last.index; i < forward.length; i++) etas[i] = forward[i];
  }

  const waypoints = route.map((p, i) => ({
    point: p, eta: etas[i],
    originalEta: originalEtas[i],
    deltaMs: etas[i] - originalEtas[i],
    isAnchor: anchors.some(a => a.index === i),
    passed: anchorIndex >= 0 && i < anchorIndex,
    legIn: i > 0 ? legs[i - 1] : null,
    legOut: i < legs.length ? legs[i] : null
  }));

  const last = waypoints[waypoints.length - 1];
  const pilotOff = last.point.type === 'PILOT_STATION'
    ? last.eta + ch.disembarkMinutes * MIN
    : null;

  return {
    outbound, legs, waypoints, etas,
    sailEpoch: opts.sailEpoch,
    underwayEpoch: underway,
    arrivalEpoch: last.eta,
    pilotOffEpoch: pilotOff,
    endEpoch: pilotOff || last.eta,
    totalNm: legs.reduce((s, l) => s + l.distanceNm, 0),
    converged, iterations, condition,
    anchors, anchorIndex, originalEtas,
    originalEndEpoch: (() => {
      const lastPt = route[route.length - 1];
      return lastPt.type === 'PILOT_STATION'
        ? originalEtas[originalEtas.length - 1] + ch.disembarkMinutes * MIN
        : originalEtas[originalEtas.length - 1];
    })(),
    currentApplied: applyCurrent
  };
}

/** Where is the vessel at time t? Interpolates between solved waypoints. */
function locateAt(transit, t) {
  const wps = transit.waypoints;
  if (t <= wps[0].eta) return { before: null, after: wps[0], label: `At ${wps[0].point.name}`, atOrBefore: true };
  if (t >= wps[wps.length - 1].eta) {
    const w = wps[wps.length - 1];
    return { before: w, after: null, label: `At ${w.point.name}`, atOrBefore: false };
  }
  for (let i = 0; i < wps.length - 1; i++) {
    if (t >= wps[i].eta && t <= wps[i + 1].eta) {
      const f = (t - wps[i].eta) / (wps[i + 1].eta - wps[i].eta);
      return {
        before: wps[i], after: wps[i + 1], fraction: f,
        label: `Between ${wps[i].point.name} and ${wps[i + 1].point.name}`
      };
    }
  }
  return null;
}

/* --------------------------------------------------------- UNDERWAY -------
   Matching a live GPS fix to the planned transit.

   A raw fix is not trusted as-is: it is projected onto the planned route, so
   position is constrained to the channel. That removes most of the wander you
   get from a phone in a steel wheelhouse, and it yields the one number the
   rest of the engine wants — distance along the route.
   -------------------------------------------------------------------------*/

/** Perpendicular projection of a point onto the segment a-b. */
function projectOnLeg(lat, lon, a, b) {
  const k = Math.cos(lat * Math.PI / 180);
  const vx = (b.lon - a.lon) * k, vy = b.lat - a.lat;
  const wx = (lon - a.lon) * k, wy = lat - a.lat;
  const L2 = vx * vx + vy * vy;
  const t = L2 === 0 ? 0 : Math.max(0, Math.min(1, (wx * vx + wy * vy) / L2));
  const px = a.lon + (b.lon - a.lon) * t, py = a.lat + (b.lat - a.lat) * t;
  return { t, lat: py, lon: px, offNm: haversineNm({ lat, lon }, { lat: py, lon: px }) };
}

/**
 * Find where a fix sits on the planned route.
 * Returns null if the fix is further off the route than tolerance — better to
 * say "off the planned route" than to snap to a leg the ship isn't on.
 */
function snapToRoute(transit, lat, lon, toleranceNm) {
  const tol = toleranceNm == null ? 1.0 : toleranceNm;
  let best = null, run = 0;
  const runs = [0];
  for (const leg of transit.legs) { run += leg.distanceNm; runs.push(run); }

  for (let i = 0; i < transit.legs.length; i++) {
    const leg = transit.legs[i];
    const p = projectOnLeg(lat, lon, leg.from, leg.to);
    if (best === null || p.offNm < best.offNm) {
      best = {
        legIndex: i, fraction: p.t, offNm: p.offNm,
        lat: p.lat, lon: p.lon,
        alongNm: runs[i] + p.t * leg.distanceNm,
        leg
      };
    }
  }
  if (!best || best.offNm > tol) {
    return best ? { ...best, offRoute: true } : null;
  }
  best.remainingNm = transit.totalNm - best.alongNm;
  best.offRoute = false;
  return best;
}

/**
 * Recompute the rest of the transit from an actual position and time.
 *
 * @param opts.observedSog  if given, used for the leg currently being run;
 *                          later legs keep their planned speeds, because one
 *                          observed speed is not evidence about the next reach.
 */
function reviseTransit(transit, snap, nowEpoch, opts) {
  opts = opts || {};
  if (!snap || snap.offRoute) return null;
  const currentAt = opts.currentAt || (() => null);
  const legs = transit.legs;
  const dirSign = transit.outbound ? -1 : 1;

  const etas = [];
  let t = nowEpoch;

  // remainder of the leg being run
  const first = legs[snap.legIndex];
  const speedFor = (leg, isCurrent) =>
    (isCurrent && opts.observedSog > 0.5) ? opts.observedSog
      : (opts.speedOverride != null ? opts.speedOverride : leg.defaultSpeed);

  const advance = (leg, nm, isCurrent) => {
    const stw = speedFor(leg, isCurrent);
    let sog = stw;
    if (!isCurrent || !(opts.observedSog > 0.5)) {
      const cur = currentAt(leg.currentKey, t + (nm / Math.max(stw, 0.5)) * HOUR / 2);
      if (cur && typeof cur.signedKts === 'number') sog = stw + dirSign * cur.signedKts;
    }
    sog = Math.max(sog, 1.0);
    t += (nm / sog) * HOUR;
    return sog;
  };

  advance(first, first.distanceNm * (1 - snap.fraction), true);
  etas.push({ point: first.to, eta: t, index: snap.legIndex + 1 });

  for (let i = snap.legIndex + 1; i < legs.length; i++) {
    advance(legs[i], legs[i].distanceNm, false);
    etas.push({ point: legs[i].to, eta: t, index: i + 1 });
  }

  const arrival = t;
  const last = transit.waypoints[transit.waypoints.length - 1];
  const pilotOff = last.point.type === 'PILOT_STATION'
    ? arrival + (transit.disembarkMinutes != null ? transit.disembarkMinutes : 6) * MIN
    : null;

  const plannedEnd = transit.endEpoch;
  const revisedEnd = pilotOff || arrival;

  return {
    etas, arrivalEpoch: arrival, pilotOffEpoch: pilotOff, endEpoch: revisedEnd,
    deltaMs: revisedEnd - plannedEnd,
    remainingNm: snap.remainingNm,
    observedSog: opts.observedSog != null ? opts.observedSog : null
  };
}

/** Speed made good between two fixes, ignoring pairs too close to be meaningful. */
function speedBetween(fixA, fixB) {
  if (!fixA || !fixB) return null;
  const dt = (fixB.t - fixA.t) / HOUR;
  if (dt <= 0) return null;
  const nm = haversineNm(fixA, fixB);
  if (nm < 0.02) return null;
  return nm / dt;
}

/* --------------------------------------------------------- GAUGES ---------
   Tide and current come from a chain of gauges along the channel. A waypoint
   between two of them gets a blend weighted by distance along the channel.

   Blending the two time series is not the same as blending two numbers: each
   gauge's series already carries its own phase, so a weighted sum of the two
   produces an intermediate phase as well as an intermediate amplitude. That is
   what makes high water arrive later upriver instead of everywhere at once.

   Outside the outermost gauges the value is clamped to the nearest one and
   flagged as extrapolated — it is not silently presented as measured.
   -------------------------------------------------------------------------*/

function gaugeChain(ch) {
  ch = ch || CHANNEL;
  return (ch.gauges || []).slice().sort((a, b) => a.chainNm - b.chainNm);
}

/** Which gauges bracket this chainage, and with what weight. */
/**
 * @param maxReachNm  how far beyond the outermost gauge a value may be carried.
 *   Interpolating between two gauges is defensible; carrying one gauge's value
 *   an arbitrary distance past the end of the chain is not. Beyond this, the
 *   answer is "no data" rather than a number nobody should trust.
 */
function bracketGauges(gauges, chainNm, kind, maxReachNm) {
  const usable = gauges.filter(g => g[kind]);
  if (!usable.length) return null;
  const reach = maxReachNm == null ? Infinity : maxReachNm;
  if (chainNm <= usable[0].chainNm) {
    const over = usable[0].chainNm - chainNm;
    if (over > reach) return null;
    return { a: usable[0], b: null, w: 0, extrapolated: over > 0.01, beyondNm: over };
  }
  const last = usable[usable.length - 1];
  if (chainNm >= last.chainNm) {
    const over = chainNm - last.chainNm;
    if (over > reach) return null;
    return { a: last, b: null, w: 0, extrapolated: over > 0.01, beyondNm: over };
  }
  for (let i = 0; i < usable.length - 1; i++) {
    const a = usable[i], b = usable[i + 1];
    if (chainNm >= a.chainNm && chainNm <= b.chainNm) {
      const span = b.chainNm - a.chainNm;
      return { a, b, w: span > 0 ? (chainNm - a.chainNm) / span : 0, extrapolated: false };
    }
  }
  return null;
}

/**
 * Estimate the propagation lag between two gauge series by cross-correlation.
 * Positive means B lags A — high water reaches B later, which is what happens
 * going upriver. Cached per pair per brief.
 */
function estimateLag(seriesA, seriesB, field, maxLagH) {
  maxLagH = maxLagH || 6;
  if (!seriesA || !seriesB || seriesA.length < 4 || seriesB.length < 4) return 0;
  const at = (s, t) => {
    const r = sampleSeries(s, t);
    return r ? lerpNum(r.a[field], r.b ? r.b[field] : null, r.f) : null;
  };
  const start = Math.max(seriesA[0].t, seriesB[0].t) + maxLagH * HOUR;
  const end = Math.min(seriesA[seriesA.length - 1].t, seriesB[seriesB.length - 1].t) - maxLagH * HOUR;
  if (end <= start) return 0;

  const step = 15 * MIN;
  let best = { lag: 0, score: -Infinity };
  for (let lag = -maxLagH * HOUR; lag <= maxLagH * HOUR; lag += 6 * MIN) {
    let sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0, n = 0;
    for (let t = start; t <= end; t += step) {
      const x = at(seriesA, t), y = at(seriesB, t + lag);
      if (x == null || y == null) continue;
      sa += x; sb += y; saa += x * x; sbb += y * y; sab += x * y; n++;
    }
    if (n < 8) continue;
    const cov = sab / n - (sa / n) * (sb / n);
    const va = saa / n - (sa / n) ** 2, vb = sbb / n - (sb / n) ** 2;
    if (va <= 0 || vb <= 0) continue;
    const r = cov / Math.sqrt(va * vb);
    if (r > best.score) best = { lag, score: r };
  }
  return best.score > 0.5 ? best.lag : 0;
}

/**
 * Blend two gauge series at one instant.
 *
 * Naively averaging the two values destroys amplitude: the series are phase
 * shifted, so a weighted sum interferes destructively and mid-channel range
 * comes out smaller than at either gauge. Instead each series is time-shifted
 * toward the target position first, so the two are in phase when blended.
 * Amplitude is then preserved and phase still advances upriver.
 *
 * @param packs  { [gaugeId]: {series, ...} }
 * @param fields numeric fields to blend; names ending in Deg blend angularly
 */
function gaugeValueAt(packs, brk, t, fields, lag) {
  if (!brk) return null;
  const sampleOne = (g, shift) => {
    const pack = packs[g.id];
    if (!pack || !pack.series) return null;
    const s = sampleSeries(pack.series, t + (shift || 0));
    if (!s) return null;
    const o = {};
    for (const f of fields)
      o[f] = f.endsWith('Deg')
        ? lerpAngle(s.a[f], s.b ? s.b[f] : null, s.f)
        : lerpNum(s.a[f], s.b ? s.b[f] : null, s.f);
    return o;
  };

  if (!brk.b) {
    const A = sampleOne(brk.a, 0);
    if (!A) return null;
    return { ...A, gauges: [brk.a.name], interpolated: false, extrapolated: brk.extrapolated };
  }

  // Shift A forward by w*lag and B back by (1-w)*lag so both represent the
  // same point in the tidal cycle at the target position.
  const L = lag || 0, w = brk.w;
  const A = sampleOne(brk.a, -w * L);
  const B = sampleOne(brk.b, (1 - w) * L);
  if (!A && !B) return null;
  if (!A) return { ...B, gauges: [brk.b.name], interpolated: false, partial: true };
  if (!B) return { ...A, gauges: [brk.a.name], interpolated: false, partial: true };

  const out = {};
  for (const f of fields)
    out[f] = f.endsWith('Deg') ? lerpAngle(A[f], B[f], w) : lerpNum(A[f], B[f], w);
  return {
    ...out, gauges: [brk.a.name, brk.b.name], weight: w, lagMs: L,
    interpolated: true, extrapolated: false
  };
}

/* ----------------------------------------------------- ENVIRONMENT --------
   Consumes normalized series from providers and matches them against the
   solved timeline. Never invents a value; a gap stays a gap.
   -------------------------------------------------------------------------*/

function sampleSeries(series, t) {
  if (!series || !series.length) return null;
  if (t < series[0].t || t > series[series.length - 1].t) return null;
  for (let i = 0; i < series.length - 1; i++) {
    if (t >= series[i].t && t <= series[i + 1].t) {
      const f = (t - series[i].t) / (series[i + 1].t - series[i].t);
      return { a: series[i], b: series[i + 1], f, exact: f < 0.5 ? series[i] : series[i + 1] };
    }
  }
  return { a: series[series.length - 1], b: null, f: 0, exact: series[series.length - 1] };
}

function lerpNum(a, b, f) {
  if (a == null || b == null) return a != null ? a : b;
  return a + (b - a) * f;
}

function lerpAngle(a, b, f) {
  if (a == null || b == null) return a != null ? a : b;
  return norm360(a + relAngle(a, b) * f);
}

/** Find extreme (max or min) of a numeric field within a window. */
function findExtreme(series, field, window, mode) {
  if (!series) return null;
  const inWin = series.filter(s => s.t >= window.start && s.t <= window.end);
  if (!inWin.length) return null;
  let best = inWin[0];
  for (const s of inWin) {
    const v = s[field], bv = best[field];
    if (v == null) continue;
    if (bv == null) { best = s; continue; }
    if (mode === 'max' ? v > bv : v < bv) best = s;
  }
  return best;
}

/** Turning points in tide height: the highs and lows inside the window. */
function findTurns(series, field, window) {
  const out = [];
  if (!series) return out;
  for (let i = 1; i < series.length - 1; i++) {
    const p = series[i - 1][field], c = series[i][field], n = series[i + 1][field];
    if (p == null || c == null || n == null) continue;
    if (c > p && c >= n) out.push({ ...series[i], kind: 'HIGH' });
    if (c < p && c <= n) out.push({ ...series[i], kind: 'LOW' });
  }
  return out.filter(x => x.t >= window.start && x.t <= window.end);
}

/** Slack water crossings — where signed current changes sign. */
function findSlacks(series, window) {
  const out = [];
  if (!series) return out;
  for (let i = 0; i < series.length - 1; i++) {
    const a = series[i].signedKts, b = series[i + 1].signedKts;
    if (a == null || b == null) continue;
    if ((a <= 0 && b > 0) || (a >= 0 && b < 0)) {
      const f = Math.abs(a) / (Math.abs(a) + Math.abs(b) || 1);
      const t = series[i].t + f * (series[i + 1].t - series[i].t);
      if (t >= window.start && t <= window.end) {
        out.push({ t, kind: 'SLACK', becoming: b > 0 ? 'FLOOD' : 'EBB' });
      }
    }
  }
  return out;
}

/* ------------------------------------------------- PILOT TRANSFER ---------
   Lee-side determination.

   Convention, stated once and used everywhere:
     seasFrom  = compass bearing the seas are COMING FROM
     heading   = vessel's true heading (direction of travel, TOWARD)
     rel       = relAngle(heading, seasFrom), in (-180, 180]
       rel < 0  -> seas are off the PORT side  -> lee is STARBOARD
       rel > 0  -> seas are off the STARBOARD side -> lee is PORT
       |rel| < 25 or > 155 -> head or following seas, no useful lee

   The vessel is assumed to be worked to roughly 60 deg off the bow from the
   dominant sea, per the operational rule, but the actual heading used is
   whichever of the two candidate headings is closer to the outbound course.
   -------------------------------------------------------------------------*/

const AMBIGUOUS_BOW = 25;    // deg either side of dead ahead with no clear lee
const AMBIGUOUS_STERN = 155; // deg either side of dead astern with no clear lee
const CONFLICT_SPREAD = 50;  // deg of disagreement that triggers pilot review

function leeFromRelative(rel) {
  const mag = Math.abs(rel);
  if (mag < AMBIGUOUS_BOW) return { side: null, reason: 'HEAD_SEA' };
  if (mag > AMBIGUOUS_STERN) return { side: null, reason: 'FOLLOWING_SEA' };
  return { side: rel < 0 ? 'STARBOARD' : 'PORT', reason: 'CLEAR' };
}

/** Candidate transfer headings that put the dominant sea ~60 off the bow. */
function transferHeadings(seasFromDeg, offset = 60) {
  return [norm360(seasFromDeg - offset), norm360(seasFromDeg + offset)];
}

/**
 * @param inp.seas   {dir: FROM-direction, heightFt}  dominant combined sea
 * @param inp.swell  {dir: FROM-direction, heightFt}
 * @param inp.wind   {dir: FROM-direction, speedKts}
 * @param inp.baseCourse  outbound channel course at the transfer point
 */
function recommendLadder(inp) {
  const contributors = [];
  const seasFrom = inp.seas && inp.seas.dir ? asFrom(inp.seas.dir).deg : null;
  const swellFrom = inp.swell && inp.swell.dir ? asFrom(inp.swell.dir).deg : null;
  const windFrom = inp.wind && inp.wind.dir ? asFrom(inp.wind.dir).deg : null;

  // Dominant driver: whichever of swell/wind-sea is physically larger.
  const swellH = inp.swell && inp.swell.heightFt != null ? inp.swell.heightFt : 0;
  const seaH = inp.seas && inp.seas.heightFt != null ? inp.seas.heightFt : 0;
  const dominantFrom = (swellH > seaH && swellFrom != null) ? swellFrom
                     : (seasFrom != null ? seasFrom : swellFrom);
  const dominantLabel = (swellH > seaH && swellFrom != null) ? 'Swell' : 'Combined sea';

  if (dominantFrom == null) {
    return { status: 'NO_DATA', side: null, notes: ['No sea, swell or wind direction available.'] };
  }

  const candidates = transferHeadings(dominantFrom, inp.offsetDeg || 60);
  const base = inp.baseCourse != null ? inp.baseCourse : candidates[0];
  const heading = Math.abs(relAngle(base, candidates[0])) <= Math.abs(relAngle(base, candidates[1]))
    ? candidates[0] : candidates[1];

  const evaluate = (label, fromDeg, weightNote) => {
    if (fromDeg == null) return null;
    const rel = relAngle(heading, fromDeg);
    const lee = leeFromRelative(rel);
    return { label, fromDeg, rel, side: lee.side, reason: lee.reason, weightNote };
  };

  const rows = [
    evaluate('Combined sea', seasFrom, seaH ? `${seaH.toFixed(1)} ft` : ''),
    evaluate('Swell', swellFrom, swellH ? `${swellH.toFixed(1)} ft` : ''),
    evaluate('Wind', windFrom, inp.wind && inp.wind.speedKts ? `${Math.round(inp.wind.speedKts)} kt` : '')
  ].filter(Boolean);
  contributors.push(...rows);

  const sides = rows.filter(r => r.side).map(r => r.side);
  const unique = [...new Set(sides)];

  // Directional spread among available drivers.
  const dirs = [seasFrom, swellFrom, windFrom].filter(d => d != null);
  let spread = 0;
  for (let i = 0; i < dirs.length; i++)
    for (let j = i + 1; j < dirs.length; j++)
      spread = Math.max(spread, Math.abs(relAngle(dirs[i], dirs[j])));

  const notes = [];
  let status = 'CLEAR', side = null;

  if (!unique.length) {
    status = 'MIXED';
    notes.push('Dominant sea falls near dead ahead or dead astern at the assumed heading — no useful lee is produced.');
  } else if (unique.length > 1) {
    status = 'MIXED';
    const disagree = rows.filter(r => r.side).map(r => `${r.label} favours ${r.side.toLowerCase()}`);
    notes.push('Environmental drivers disagree: ' + disagree.join('; ') + '.');
  } else {
    side = unique[0];
    if (spread > CONFLICT_SPREAD) {
      status = 'MIXED';
      notes.push(`Sea, swell and wind directions span ${Math.round(spread)}° — they agree on the lee side but the sea state is confused.`);
    }
  }

  const domRel = relAngle(heading, dominantFrom);

  return {
    status, side, heading, dominantFrom, dominantLabel,
    relativeAngle: domRel, candidates, spread, contributors, notes,
    baseCourse: inp.baseCourse
  };
}

/* =========================================================================
   STORAGE — guarded. Persists on a real host; degrades to memory anywhere
   that blocks it, without throwing.
   ======================================================================= */
const Store = (() => {
  const mem = {};
  let ok = false;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); ok = true; } catch (e) { ok = false; }
  return {
    persistent: ok,
    get(k, fb) {
      try { const v = ok ? localStorage.getItem(k) : mem[k]; return v == null ? fb : JSON.parse(v); }
      catch (e) { return fb; }
    },
    set(k, v) {
      try { const s = JSON.stringify(v); if (ok) localStorage.setItem(k, s); else mem[k] = s; } catch (e) {}
    }
  };
})();

   ======================================================================= */

/* Live mode resolves forecasts by position rather than by zone, but rounds the
   position to a grid so nearby waypoints share one fetch. 0.05 deg is roughly
   3 nm — finer than any real gradient in wind along this channel, and it keeps
   a full-channel brief to a couple of dozen requests instead of ninety.
   Waves are coarser still: they only matter offshore, where the field is
   smooth over tens of miles. */
const FORECAST_GRID = { weather: 0.05, visibility: 0.05, wave: 0.25 };
function forecastKey(node, kind) {
  const g = FORECAST_GRID[kind] || 0.05;
  const r = v => (Math.round(v / g) * g).toFixed(3);
  return kind + ':' + r(node.lat) + ',' + r(node.lon);
}

/* ---------------------------------------------------------------------------
   LIVE ADAPTERS
   Each returns the same normalized shape, so the engines never see a raw
   response. Any failure is recorded as a failure — never silently filled in.
   ------------------------------------------------------------------------- */

const HTTP_TIMEOUT = 12000;

/* How far a single gauge's reading may be carried past the end of its chain.
   Water level responds to the same basin-wide forcing and travels a long way
   up a channel like this, so a generous reach is reasonable. Current does not:
   it depends on local cross-section and freshwater flow, and a reading at the
   mouth says little about a river reach twenty-five miles inland. Beyond the
   reach the brief says no data instead of guessing. */
const DEFAULT_REACH = { tide: 12, current: 6 };

async function getJSON(url, opts) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), HTTP_TIMEOUT);
  try {
    const r = await fetch(url, { signal: ctl.signal, headers: (opts && opts.headers) || {} });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(timer); }
}

/* NWS gridpoint values arrive as ISO intervals: "2026-08-11T18:00:00+00:00/PT6H".
   Expand each into hourly samples so everything downstream sees a flat series. */
function expandNwsInterval(validTime) {
  const [startStr, durStr] = validTime.split('/');
  const start = Date.parse(startStr);
  const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/.exec(durStr || 'PT1H') || [];
  const hours = (+(m[1] || 0)) * 24 + (+(m[2] || 0)) + (+(m[3] || 0)) / 60;
  return { start, hours: Math.max(1, Math.round(hours)) };
}

function nwsSeries(prop, convert) {
  const out = [];
  if (!prop || !prop.values) return out;
  for (const v of prop.values) {
    const { start, hours } = expandNwsInterval(v.validTime);
    for (let h = 0; h < hours; h++)
      out.push({ t: start + h * HOUR, v: v.value == null ? null : convert(v.value) });
  }
  return out;
}

function mergeSeries(parts) {
  const byTime = new Map();
  for (const [field, series] of Object.entries(parts))
    for (const s of series) {
      if (!byTime.has(s.t)) byTime.set(s.t, { t: s.t });
      byTime.get(s.t)[field] = s.v;
    }
  return [...byTime.values()].sort((a, b) => a.t - b.t);
}

const KMH_TO_KT = 0.539957, M_TO_NM = 1 / 1852;

/* ---- NWS gridded forecast: wind, gusts, visibility, thunder ---- */
const nwsGridCache = new Map();
const NWSWeather = {
  kind: 'weather', quality: 'LIVE',
  label: 'NWS gridded forecast (api.weather.gov)',
  async load(stationId, win, node) {
    const lat = node.lat.toFixed(4), lon = node.lon.toFixed(4);
    let gridUrl = nwsGridCache.get(stationId);
    if (!gridUrl) {
      const pt = await getJSON(`https://api.weather.gov/points/${lat},${lon}`);
      gridUrl = pt.properties.forecastGridData;
      nwsGridCache.set(stationId, gridUrl);
    }
    const g = await getJSON(gridUrl);
    const p = g.properties;
    const series = mergeSeries({
      windKts: nwsSeries(p.windSpeed, v => v * KMH_TO_KT),
      dewpointF: nwsSeries(p.dewpoint, v => v * 9 / 5 + 32),
      humidityPct: nwsSeries(p.relativeHumidity, v => v),
      gustKts: nwsSeries(p.windGust, v => v * KMH_TO_KT),
      windFromDeg: nwsSeries(p.windDirection, v => v),
      visibilityNm: nwsSeries(p.visibility, v => v * M_TO_NM),
      tempF: nwsSeries(p.temperature, v => v * 9 / 5 + 32),
      thunderPct: nwsSeries(p.probabilityOfThunder, v => v),
      popPct: nwsSeries(p.probabilityOfPrecipitation, v => v)
    });
    return {
      series, issued: Date.parse(p.updateTime), retrieved: Date.now(),
      source: 'NWS ' + (p.gridId || '') + ' gridded forecast', quality: 'LIVE'
    };
  }
};

}

/* ---------------------------------------------------------------------------
   FOG: MULTI-MODEL VISIBILITY
   Windy's Point Forecast API publishes no visibility parameter, so it cannot
   serve this. Open-Meteo exposes the raw model fields instead. Over the Gulf
   coast that is HRRR at 3 km and GFS; ECMWF does not publish visibility for
   this region, so agreement here is across two models, not three.

   Supporting fields (dewpoint spread, low cloud) are carried for context and
   are never presented as measured visibility.
   ------------------------------------------------------------------------- */

const VIS_MODELS = [
  { id: 'gfs_hrrr', name: 'HRRR', resolution: '3 km', hours: 48 },
  { id: 'gfs_seamless', name: 'GFS', resolution: '13 km', hours: 120 }
];

async function fetchVisModel(lat, lon, modelId) {
  const u = new URL('https://api.open-meteo.com/v1/forecast');
  u.searchParams.set('latitude', lat.toFixed(4));
  u.searchParams.set('longitude', lon.toFixed(4));
  u.searchParams.set('hourly',
    'visibility,temperature_2m,dew_point_2m,wind_speed_10m,cloud_cover_low');
  u.searchParams.set('temperature_unit', 'fahrenheit');
  u.searchParams.set('wind_speed_unit', 'kn');
  u.searchParams.set('timezone', 'UTC');
  u.searchParams.set('forecast_days', '3');
  if (modelId) u.searchParams.set('models', modelId);
  const d = await getJSON(u.toString());
  const h = d.hourly;
  if (!h || !h.time) throw new Error('no hourly block');
  const series = h.time.map((iso, i) => ({
    t: Date.parse(iso + 'Z'),
    visibilityNm: h.visibility[i] != null ? h.visibility[i] / 1852 : null,
    lowCloudPct: h.cloud_cover_low ? h.cloud_cover_low[i] : null,
    tempF: h.temperature_2m[i],
    dewF: h.dew_point_2m[i],
    windKts: h.wind_speed_10m[i]
  })).filter(r => isFinite(r.t));
  const withVis = series.filter(r => r.visibilityNm != null).length;
  if (!withVis) throw new Error('model publishes no visibility here');
  return series;
}

/* ---- METAR observations ----
   Airport observations are the only true measured visibility anywhere near
   this channel. There is no airport at Cameron, so the lower channel has no
   observation and the app says so rather than reaching for a distant one. */
/* Discovered by bounding box rather than hardcoded, so a station appearing near
   Cameron in future is picked up without a code change. Checked: CAPL1 at
   Calcasieu Pass carries air temperature, wind, barometer and water temperature
   but no visibility sensor, and nothing else in the lower channel measures
   visibility. Nearest measured visibility is the Lake Charles airports. */
const METAR_BBOX = { latS: 29.2, lonW: -93.9, latN: 30.4, lonE: -92.8 };

async function fetchMetarNear(bbox) {
  const u = new URL('https://aviationweather.gov/api/data/metar');
  u.searchParams.set('bbox', `${bbox.latS},${bbox.lonW},${bbox.latN},${bbox.lonE}`);
  u.searchParams.set('format', 'json');
  u.searchParams.set('hours', '2');
  const d = await getJSON(u.toString());
  if (!Array.isArray(d)) throw new Error('unexpected METAR response');
  const byStation = new Map();
  for (const r of d) {
    const t = r.obsTime ? r.obsTime * 1000 : Date.parse(r.reportTime + 'Z');
    if (!isFinite(t)) continue;
    let vis = null;
    if (typeof r.visib === 'number') vis = r.visib;
    else if (typeof r.visib === 'string') vis = parseFloat(r.visib.replace('+', ''));
    if (vis != null && !isFinite(vis)) vis = null;
    const row = { station: r.icaoId, name: r.name || r.icaoId, lat: r.lat, lon: r.lon,
                  t, visibilityNm: vis, raw: r.rawOb || '' };
    const prev = byStation.get(row.station);
    if (!prev || row.t > prev.t) byStation.set(row.station, row);
  }
  return [...byStation.values()].filter(r => r.visibilityNm != null && r.lat != null);
}

async function fetchMetarLegacy(ids) {
  const u = new URL('https://aviationweather.gov/api/data/metar');
  u.searchParams.set('ids', ids.join(','));
  u.searchParams.set('format', 'json');
  u.searchParams.set('hours', '3');
  const d = await getJSON(u.toString());
  if (!Array.isArray(d)) throw new Error('unexpected METAR response');
  return d.map(r => ({
    station: r.icaoId,
    t: r.obsTime ? r.obsTime * 1000 : Date.parse(r.reportTime + 'Z'),
    visibilityNm: typeof r.visib === 'number' ? r.visib
      : (typeof r.visib === 'string' ? parseFloat(r.visib.replace('+', '')) : null),
    tempF: r.temp != null ? r.temp * 9 / 5 + 32 : null,
    dewF: r.dewp != null ? r.dewp * 9 / 5 + 32 : null,
    windKts: r.wspd != null ? r.wspd : null,
    raw: r.rawOb || ''
  })).filter(r => isFinite(r.t)).sort((a, b) => a.t - b.t);

/* ---- classification ---- */
function visLevel(nm) {
  if (nm == null) return { key: 'NONE', label: 'Data unavailable', cls: 'gap' };
  if (nm < 1) return { key: 'DENSE', label: 'Dense fog', cls: 'port' };
  if (nm < 2) return { key: 'POOR', label: 'Poor', cls: 'caution' };
  if (nm < 5) return { key: 'CAUTION', label: 'Caution', cls: 'caution' };
  return { key: 'GOOD', label: 'Good', cls: 'stbd' };
}

/* Trend from the gradient either side of an instant, not from the nearest
   extreme, so a moment just past a minimum reads as improving. */
function visTrend(series, t, windowMs) {
  const w = windowMs || 90 * MIN;
  const at = tt => {
    const s = sampleSeries(series, tt);
    return s ? lerpNum(s.a.visibilityNm, s.b ? s.b.visibilityNm : null, s.f) : null;
  };
  const before = at(t - w), after = at(t + w);
  if (before == null || after == null) return 'unknown';
  const d = after - before;
  if (Math.abs(d) < 0.4) return 'steady';
  return d < 0 ? 'worsening' : 'improving';
}

/* ---------------------------------------------------------------------------
   FOG PROGRESSION
   Sample points along the route, forecast visibility at each, for each forecast
   hour. That gives a grid of visibility over position and time. Progression is
   read out of how the reduced-visibility region moves along that grid — it
   describes the evolution of the forecast field, not observed fog-bank motion.
   ------------------------------------------------------------------------- */

const FOG_THRESHOLD_NM = 2.0;   // what counts as "reduced" for progression

/** Sample points: every named waypoint, thinned so no two are within 3 nm. */
function fogSamplePoints(transit) {
  const out = [];
  for (const w of transit.waypoints) {
    const p = w.point;
    const named = p.type === 'BERTH' || p.type === 'PILOT_STATION' ||
                  p.type === 'ANCHORAGE' || p.type === 'TURN';
    const last = out[out.length - 1];
    if (!last || named || Math.abs(p.chainNm - last.chainNm) >= 3) {
      if (last && Math.abs(p.chainNm - last.chainNm) < 0.5 && !named) continue;
      out.push({ id: p.id, name: p.name, lat: p.lat, lon: p.lon,
                 chainNm: p.chainNm, eta: w.eta, named });
    }
  }
  return out;
}

/**
 * Build the grid.
 * @returns { points, times, models, vis[modelName][pointIndex] -> series,
 *            best(pointIndex, t) -> {nm, model} }
 */
async function buildFogGrid(points, win, opts) {
  const models = [];
  const perModel = {};
  for (const m of VIS_MODELS) {
    const rows = [];
    let ok = 0;
    for (const p of points) {
      try {
        rows.push(await fetchVisModel(p.lat, p.lon, m.id));
        ok++;
      } catch (e) { rows.push(null); }
    }
    if (ok) { models.push(m); perModel[m.name] = rows; }
  }
  if (!models.length) throw new Error('no model published visibility for this route');

  const primary = models[0].name;
  const valueAt = (modelName, i, t) => {
    const series = perModel[modelName] && perModel[modelName][i];
    if (!series) return null;
    const s = sampleSeries(series, t);
    return s ? lerpNum(s.a.visibilityNm, s.b ? s.b.visibilityNm : null, s.f) : null;
  };
  const supportAt = (i, t) => {
    const series = perModel[primary] && perModel[primary][i];
    if (!series) return null;
    const s = sampleSeries(series, t);
    if (!s) return null;
    return {
      tempF: lerpNum(s.a.tempF, s.b ? s.b.tempF : null, s.f),
      dewF: lerpNum(s.a.dewF, s.b ? s.b.dewF : null, s.f),
      windKts: lerpNum(s.a.windKts, s.b ? s.b.windKts : null, s.f),
      lowCloudPct: lerpNum(s.a.lowCloudPct, s.b ? s.b.lowCloudPct : null, s.f)
    };
  };

  const times = [];
  const step = HOUR;
  for (let t = Math.floor(win.start / step) * step; t <= win.end + step; t += step) times.push(t);

  return { points, times, models, primary, perModel, valueAt, supportAt,
           seriesFor: (modelName, i) => perModel[modelName] && perModel[modelName][i] };
}

/** Where the reduced-visibility region sits at one instant, along the channel. */
function reducedExtent(grid, t, threshold) {
  const th = threshold == null ? FOG_THRESHOLD_NM : threshold;
  const hits = [];
  for (let i = 0; i < grid.points.length; i++) {
    const v = grid.valueAt(grid.primary, i, t);
    if (v != null && v < th) hits.push({ i, chainNm: grid.points[i].chainNm, nm: v });
  }
  if (!hits.length) return null;
  const chains = hits.map(h => h.chainNm);
  const worst = hits.reduce((a, b) => (b.nm < a.nm ? b : a));
  return {
    lo: Math.min(...chains), hi: Math.max(...chains),
    centroid: chains.reduce((a, b) => a + b, 0) / chains.length,
    count: hits.length, worst
  };
}

/**
 * Describe how the reduced-visibility region evolves across the window.
 * Upriver = increasing chainage = northward on this channel.
 */
function fogProgression(grid, win, tz) {
  const frames = [];
  for (const t of grid.times) {
    if (t < win.start - HOUR || t > win.end + HOUR) continue;
    frames.push({ t, ext: reducedExtent(grid, t) });
  }
  const active = frames.filter(f => f.ext);
  if (!active.length) return { any: false, frames, statement: 'No reduced visibility forecast along the route during this window.' };

  const first = active[0], last = active[active.length - 1];
  const drift = last.ext.centroid - first.ext.centroid;
  const grew = last.ext.count - first.ext.count;

  const nameAt = chain => {
    let best = grid.points[0];
    for (const p of grid.points) if (Math.abs(p.chainNm - chain) < Math.abs(best.chainNm - chain)) best = p;
    return best.name;
  };

  let motion;
  if (Math.abs(drift) < 2) motion = grew > 0 ? 'expanding in place' : grew < 0 ? 'contracting in place' : 'holding position';
  else motion = drift > 0 ? 'moving upriver' : 'moving down toward the lower channel';

  const statement =
    `Reduced visibility is forecast ${motion}, from around ${nameAt(first.ext.centroid)} ` +
    `at ${fmtClock(first.t, tz)} to around ${nameAt(last.ext.centroid)} by ${fmtClock(last.t, tz)}` +
    (grew > 0 ? `, covering more of the channel as it goes` :
     grew < 0 ? `, covering less of the channel as it goes` : '') + '.';

  return { any: true, frames, active, drift, grew, motion, statement,
           firstT: first.t, lastT: last.t };
}

/** Visibility at each waypoint's own ETA — the answer that actually matters. */
function fogDuringTransit(grid, tz) {
  return grid.points.map((p, i) => {
    const nm = grid.valueAt(grid.primary, i, p.eta);
    const series = grid.seriesFor(grid.primary, i);
    const trend = series ? visTrend(series, p.eta) : 'unknown';
    const others = grid.models.slice(1).map(m => ({ model: m.name, nm: grid.valueAt(m.name, i, p.eta) }))
                     .filter(x => x.nm != null);
    return { ...p, nm, level: visLevel(nm), trend, others, support: grid.supportAt(i, p.eta) };
  });
}

/** Worst stretch of the passage, as a window with a place and a severity band. */
function worstVisibility(rows, tz) {
  const withData = rows.filter(r => r.nm != null);
  if (!withData.length) return null;
  const worst = withData.reduce((a, b) => (b.nm < a.nm ? b : a));
  const band = withData.filter(r => r.nm <= Math.max(worst.nm * 1.6, worst.nm + 0.5));
  const lo = Math.min(...band.map(r => r.nm)), hi = Math.max(...band.map(r => r.nm));
  const t0 = Math.min(...band.map(r => r.eta)), t1 = Math.max(...band.map(r => r.eta));
  const names = band.map(r => r.name);
  return {
    worst, lo, hi, t0, t1,
    where: names.length === 1 ? names[0] : `${names[0]} to ${names[names.length - 1]}`,
    level: visLevel(worst.nm)
  };
}

/** How well the models agree, stated as a count rather than a made-up score. */
function modelAgreement(rows, threshold) {
  const th = threshold == null ? FOG_THRESHOLD_NM : threshold;
  const scored = rows.filter(r => r.nm != null && r.others.length);
  if (!scored.length) return null;
  const target = scored.reduce((a, b) => (b.nm < a.nm ? b : a));
  const all = [{ model: 'HRRR', nm: target.nm }, ...target.others];
  const below = all.filter(m => m.nm < th).length;
  const level = below === all.length ? 'STRONG' : below === 0 ? 'STRONG' : 'MODERATE';
  return {
    at: target.name, models: all, below, total: all.length, threshold: th, level,
    why: below === all.length
      ? `all ${all.length} models forecast visibility below ${th} nm near ${target.name}`
      : below === 0
        ? `no model forecasts visibility below ${th} nm near ${target.name}`
        : `${below} of ${all.length} models forecast visibility below ${th} nm near ${target.name}`
  };
}

/** Observation against forecast, reported — never used to bend the model. */
function compareObservations(metars, grid, nowT) {
  if (!metars || !metars.length) return [];
  const out = [];
  for (const m of metars) {
    let nearest = null;
    for (let i = 0; i < grid.points.length; i++) {
      const p = grid.points[i];
      const d = haversineNm({ lat: m.lat, lon: m.lon }, { lat: p.lat, lon: p.lon });
      if (!nearest || d < nearest.d) nearest = { i, d, point: p };
    }
    if (!nearest) continue;
    // Forecast valid at the observation's own time, so like is compared with like.
    const fc = grid.valueAt(grid.primary, nearest.i, m.t);
    let verdict = null, tracking = null;
    if (fc != null && m.visibilityNm != null) {
      const diff = m.visibilityNm - fc;
      const tol = Math.max(1, fc * 0.5);
      if (Math.abs(diff) <= tol) { verdict = 'HRRR currently tracking observed visibility well'; tracking = 'good'; }
      else if (diff > 0) { verdict = 'HRRR currently forecasting substantially more fog than observed'; tracking = 'pessimistic'; }
      else { verdict = 'HRRR currently forecasting less fog than observed'; tracking = 'optimistic'; }
    }
    out.push({ station: m.station, name: m.name, lat: m.lat, lon: m.lon,
               observed: m.visibilityNm, at: m.t, ageMs: nowT - m.t,
               forecast: fc, verdict, tracking,
               nearestPoint: nearest.point.name, distanceNm: nearest.d, raw: m.raw });
  }
  return out.sort((a, b) => a.distanceNm - b.distanceNm);
}

/* Where you enter the fog, where it is worst, where you come out — plus how
   much of the passage sits below each threshold, in distance and in time. */
function fogTransitProfile(rows) {
  const usable = rows.filter(r => r.nm != null);
  if (!usable.length) return null;
  const crossings = th => {
    let enter = null, exitPt = null;
    for (let i = 0; i < usable.length; i++) {
      const r = usable[i];
      if (r.nm < th && !enter) enter = r;
      if (enter && r.nm >= th && !exitPt) { exitPt = r; break; }
    }
    let nm = 0, ms = 0;
    for (let i = 0; i < usable.length - 1; i++) {
      const a = usable[i], b = usable[i + 1];
      if (a.nm < th && b.nm < th) {
        nm += Math.abs(b.chainNm - a.chainNm);
        ms += Math.abs(b.eta - a.eta);
      }
    }
    return { threshold: th, enter, exit: exitPt, distanceNm: nm, durationMs: ms,
             any: usable.some(r => r.nm < th) };
  };
  const worst = usable.reduce((a, b) => (b.nm < a.nm ? b : a));
  return { below5: crossings(5), below2: crossings(2), below1: crossings(1),
           worst, first: usable[0], last: usable[usable.length - 1] };
}

/* Material disagreement: one model calls fog, the other does not. */
function modelDisagreements(rows, opts) {
  const minGap = (opts && opts.minGap) || 1.5;
  const out = [];
  for (const r of rows) {
    if (r.nm == null || !r.others.length) continue;
    for (const o of r.others) {
      const gap = Math.abs(o.nm - r.nm);
      const straddles = (r.nm < 2 && o.nm >= 2) || (o.nm < 2 && r.nm >= 2);
      if (gap >= minGap && straddles)
        out.push({ point: r.name, eta: r.eta, hrrr: r.nm, model: o.model, other: o.nm, gap });
    }
  }
  return out.sort((a, b) => b.gap - a.gap);
}

/* ---- NOAA CO-OPS observed currents ----
   Real-time measurements. These stop at the present moment, so they cannot
   drive a brief for a sail time hours away. They are used to check whether
   today's predictions are running true — wind setup and river flow routinely
   push the real current away from the harmonic curve. */
const CoopsCurrentObs = {
  kind: 'currentObs', quality: 'LIVE',
  label: 'NOAA CO-OPS observed currents',
  async load(stationId, win, node, gauge) {
    const st = gauge && gauge.currentObs;
    if (!st) throw new Error('no observation station for this gauge');
    const u = new URL('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter');
    const now = Date.now();
    const q = {
      product: 'currents', application: 'CalcasieuTransitBrief', station: st,
      begin_date: coopsStamp(now - 2 * HOUR), end_date: coopsStamp(now),
      time_zone: 'gmt', units: 'english', format: 'json'
    };
    for (const [k, v] of Object.entries(q)) u.searchParams.set(k, v);
    const d = await getJSON(u.toString());
    if (d.error) throw new Error(d.error.message || 'CO-OPS error');
    /* CO-OPS returns observed current as an UNSIGNED speed with a separate set
       direction. Reading the speed straight into a signed field makes every
       observation look like a flood. It is deliberately left unsigned here and
       signed later against the station's mean flood direction, which arrives
       with the predictions. */
    const series = (d.data || []).map(r => ({
      t: Date.parse(String(r.t).replace(' ', 'T') + 'Z'),
      speedKts: Math.abs(parseFloat(r.s)),
      setDeg: r.d != null && r.d !== '' ? parseFloat(r.d) : null,
      signedKts: null
    })).filter(r => isFinite(r.t) && isFinite(r.speedKts));
    if (!series.length) throw new Error('no observations returned');
    return { series, issued: null, retrieved: Date.now(), needsSigning: true,
             source: 'NOAA CO-OPS ' + st + ' (observed)', quality: 'LIVE' };
  }
};

/* ---- NOAA CO-OPS current predictions ----
   Harmonic current stations exist only in the lower channel. Anywhere without
   one stays an honest gap rather than borrowing a distant station. */
const CoopsCurrent = {
  kind: 'current', quality: 'LIVE',
  label: 'NOAA CO-OPS current predictions',
  async load(stationId, win, node, gauge) {
    const st = gauge && gauge.current;
    if (!st) throw new Error('no CO-OPS current id set for this gauge');
    const u = new URL('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter');
    const q = {
      product: 'currents_predictions', application: 'CalcasieuTransitBrief', station: st,
      begin_date: coopsStamp(win.start - 3 * HOUR), end_date: coopsStamp(win.end + 3 * HOUR),
      time_zone: 'gmt', units: 'english', interval: '30', format: 'json'
    };
    for (const [k, v] of Object.entries(q)) u.searchParams.set(k, v);
    const d = await getJSON(u.toString());
    if (d.error) throw new Error(d.error.message || 'CO-OPS error');
    const rows = (d.current_predictions && d.current_predictions.cp) || [];
    const series = rows.map(r => ({
      t: Date.parse(String(r.Time).replace(' ', 'T') + 'Z'),
      signedKts: parseFloat(r.Velocity_Major),
      setDeg: r.meanFloodDir != null ? parseFloat(r.meanFloodDir) : null
    })).filter(r => isFinite(r.t));
    if (!series.length) throw new Error('no current predictions returned');
    /* Needed to sign the observed readings, which CO-OPS returns as bare
       magnitudes. Not every row carries it, so take the first that does. */
    const fd = rows.map(r => r.meanFloodDir).find(v => v != null && v !== '');
    const ed = rows.map(r => r.meanEbbDir).find(v => v != null && v !== '');
    return {
      series, issued: null, retrieved: Date.now(),
      meanFloodDir: fd != null ? parseFloat(fd) : null,
      meanEbbDir: ed != null ? parseFloat(ed) : null,
      source: 'NOAA CO-OPS ' + st + ' (harmonic current)', quality: 'LIVE'
    };
  }
};

/* Deterministic mock generator, kept for offline demo and for the tests.
   Seeded by station and day, so the same brief reproduces exactly. */
function seeded(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h ^= h >>> 13; return ((h >>> 0) % 10000) / 10000; };
}

const M2 = 12.4206 * HOUR;

function mockProvider(kind) {
  return {
    kind, quality: 'MOCK', label: 'Simulated',
    async load(stationId, win, node, gauge) {
      const rnd = seeded('calcasieu' + Math.floor(win.start / 86400000));
      // Upriver gauges lag the Pass by ~0.09 h per nm, and the range decays.
      const chain = gauge ? gauge.chainNm : 26;
      const lagH = (chain - 26) * 0.09;
      const decay = Math.max(0.45, 1 - (chain - 26) * 0.012);
      const phase = rnd() * M2 + lagH * HOUR;
      const step = 30 * MIN;
      const start = Math.floor((win.start - 2 * HOUR) / step) * step;
      const end = win.end + 2 * HOUR;
      const series = [];
      const windBase = 140 + rnd() * 40;
      const windMag = 9 + rnd() * 12;
      for (let t = start; t <= end; t += step) {
        const th = ((t - phase) / M2) * 2 * Math.PI;
        const row = { t };
        if (kind === 'tide') {
          row.heightFt = +(1.15 + 0.95 * decay * Math.sin(th) + 0.18 * decay * Math.sin(th * 2 + 1)).toFixed(2);
        } else if (kind === 'current') {
          row.signedKts = +(1.75 * decay * Math.sin(th - Math.PI / 2)).toFixed(2);
          row.setDeg = row.signedKts >= 0 ? 350 : 170;
        } else if (kind === 'weather') {
          const drift = (t - win.start) / (12 * HOUR);
          const w = windMag + drift * 7 + 1.6 * Math.sin(th * 1.7);
          row.windKts = +w.toFixed(1);
          row.gustKts = +(w * 1.38).toFixed(1);
          row.windFromDeg = +norm360(windBase + drift * 16 + 5 * Math.sin(th)).toFixed(0);
          row.visibilityNm = 10;
          row.tempF = +(66 + 8 * Math.sin((t / (24 * HOUR)) * 2 * Math.PI)).toFixed(0);
        } else if (kind === 'wave') {
          const drift = (t - win.start) / (12 * HOUR);
          const w = windMag + drift * 7;
          row.seaFt = +(0.16 * w + 0.9).toFixed(1);
          row.waveFromDeg = +norm360(windBase + drift * 14).toFixed(0);
          row.wavePeriodS = 6;
          row.swellFt = +(1.6 + 0.9 * rnd()).toFixed(1);
          row.swellFromDeg = +norm360(windBase - 12).toFixed(0);
          row.swellPeriodS = 8;
        }
        series.push(row);
      }
      return { series, issued: start, retrieved: Date.now(),
               source: 'Simulated — not real data', quality: 'MOCK' };
    }
  };
}

/* Load every station a route touches. Missing station = recorded gap. */
const MOCK_PROVIDERS = {
  tide: mockProvider('tide'), current: mockProvider('current'),
  weather: mockProvider('weather'), wave: mockProvider('wave')
};
const LIVE_PROVIDERS = {
  tide: CoopsTide, current: CoopsCurrent, weather: NWSWeather, wave: OpenMeteoWave
};
/* ---------------------------------------------------------------------------
   CACHE
   A brief generated alongside is meant to survive the loss of signal that
   follows. Every successful fetch is kept; when the network fails the cached
   copy is used and labelled CACHED with its age, never presented as fresh.
   Nothing is ever fabricated to fill a hole.
   ------------------------------------------------------------------------- */

/* Pilot-editable speed overrides, keyed by reach name and condition. These sit
   on top of the shipped table so a correction survives a new build of the app. */
function speedOverrides() { return Store.get('speedOverrides', {}); }

function applySpeedOverrides() {
  const ov = speedOverrides();
  for (const e of CHANNEL.edges) {
    if (!e.zone) continue;
    if (e._baseLoaded == null) { e._baseLoaded = e.loaded; e._baseLight = e.light; }
    const L = ov[e.zone + '|LOADED'], G = ov[e.zone + '|LIGHT'];
    e.loaded = L != null ? L : e._baseLoaded;
    e.light  = G != null ? G : e._baseLight;
  }
}

/* Observed current comes from exactly these two stations, app-wide. Other
   stations may still supply predictions where they publish them, but nothing
   else is ever shown as a live measurement. Enforced here rather than repeated
   at each call site. */
const OBSERVED_CURRENT_STATIONS = ['G_PIER', 'G_LC'];
const isObservedCurrentStation = id => OBSERVED_CURRENT_STATIONS.includes(id);

/* Checkpoints the pilot can report passing. These are existing channel nodes —
   no new coordinates. Ordered seaward to upriver; the control reverses them for
   an outbound passage and only offers those still ahead. */
const CHECKPOINTS = [
  { id: 'MK_7_8',    label: 'Buoy 8' },
  { id: 'MK_35_36',  label: 'Buoy 36' },
  { id: 'MK_60',     label: 'Beacon 60' },
  { id: 'MK_79_80',  label: 'Beacon 80' },
  { id: 'MK_85_86',  label: 'Beacon 86' },
  { id: 'MK_99_100', label: 'Beacon 100' },
  { id: 'MK_106',    label: 'Beacon 106' },
  { id: 'MK_112',    label: 'Beacon 112' },
  { id: 'MK_115',    label: 'Beacon 115' }
];

const CACHE_KEY = 'envCache';
