    if (isFinite(v) && v > 0 && v < 30) { store[inp.dataset.key] = v; $('#aSpdMsg').textContent = ' Saved.'; }
    else { delete store[inp.dataset.key]; $('#aSpdMsg').textContent = ' Ignored — must be between 0 and 30 kt.'; }
    Store.set('speedOverrides', store);
    applySpeedOverrides();
  }));
  $('#aResetSpeeds').addEventListener('click', () => {
    Store.set('speedOverrides', {});
    applySpeedOverrides();
    renderAdmin();
  });
  $('#aClearCache').addEventListener('click', () => {
    Store.set('envCache', {}); $('#aCacheMsg').textContent = ' Cleared.';
  });
  $('#aTest').addEventListener('click', () => {
    const out = $('#aTestOut'); out.style.display = 'block';
    out.innerHTML = runSelfTest().map(l =>
      `<span class="${l.ok === true ? 'p' : l.ok === false ? 'f' : ''}">${esc(l.text)}</span>`).join('\n');
  });
}

/* ---------- self test (mirrors the node suite) ---------- */
function runSelfTest() {
  const lines = []; let p = 0, f = 0;
  const T = (name, fn) => {
    try { fn(); lines.push({ ok: true, text: 'PASS  ' + name }); p++; }
    catch (e) { lines.push({ ok: false, text: 'FAIL  ' + name + ' — ' + e.message }); f++; }
  };
  const eq = (a, b, m) => { if (a !== b) throw new Error(`${m || ''} expected ${b}, got ${a}`); };
  const near = (a, b, tol) => { if (Math.abs(a - b) > tol) throw new Error(`expected ~${b}, got ${a}`); };
  const tz = CHANNEL.meta.timezone;
  const sail = wallToEpoch(2026, 1, 15, 18, 0, tz);

  T('relAngle signs left negative', () => eq(relAngle(205, 145), -60));
  T('relAngle across 0/360', () => eq(relAngle(350, 10), 20));
  T('TOWARD to FROM reciprocal', () => eq(asFrom(dir(30, TOWARD)).deg, 210));
  T('unlabelled direction rejected', () => {
    let threw = false; try { dir(10, 'x'); } catch (e) { threw = true; }
    if (!threw) throw new Error('accepted');
  });
  T('CST wall clock round-trips', () => eq(fmtClock(wallToEpoch(2026, 1, 15, 18, 0, tz), tz), '18:00'));
  T('CDT wall clock round-trips', () => eq(fmtClock(wallToEpoch(2026, 7, 15, 18, 0, tz), tz), '18:00'));
  T('spring forward survives', () => eq(fmtClock(wallToEpoch(2026, 3, 8, 4, 30, tz), tz), '04:30'));
  T('outbound detected', () => eq(buildLegs('BT4', PILOT_ID).outbound, true));
  T('inbound course is reciprocal', () => {
    const o = buildLegs('BT4', PILOT_ID).legs[0];
    const i = buildLegs(PILOT_ID, 'BT4');
    near(relAngle(norm360(o.course + 180), i.legs[i.legs.length - 1].course), 0, 0.01);
  });
  T('legs sum to the route total', () => {
    const r = buildLegs('BT4', PILOT_ID);
    near(r.legs.reduce((s, l) => s + l.distanceNm, 0), r.totalNm, 0.01);
  });
  T('BT4 to pilot station follows the river', () =>
    near(buildLegs('BT4', PILOT_ID).totalNm, 57.86, 0.05));
  T('Clooney loop is longer outbound', () =>
    near(buildLegs('P66_3', PILOT_ID).totalNm - buildLegs(PILOT_ID, 'P66_3').totalNm, 0.61, 0.05));
  T('Clooney outbound rounds the island', () => {
    const ids = buildLegs('P66_3', PILOT_ID).route.map(p => p.id);
    if (!ids.includes('LOOP_23') || ids.includes('MK_121')) throw new Error('wrong water');
  });
  T('Clooney inbound leaves 121 to port', () => {
    const ids = buildLegs(PILOT_ID, 'P66_3').route.map(p => p.id);
    if (!ids.includes('MK_121') || ids.includes('LOOP_23')) throw new Error('wrong water');
  });
  T('all seven boarding points are selectable', () => {
    const names = selectablePoints().filter(n => n.type === 'PILOT_STATION').map(n => n.name);
    eq(names.length, 7);
    for (const w of ['Buoy 1/2','Buoy 2B','Buoy 8','Buoy 14','Buoy 18','Buoy 22','Buoy 30'])
      if (!names.includes(w)) throw new Error('missing ' + w);
  });
  T('pilot-off computed at every boarding point', () => {
    for (const n of selectablePoints().filter(x => x.type === 'PILOT_STATION')) {
      const t = solveTransit({ fromId: 'BT4', toId: n.id, sailEpoch: sail, applyCurrent: false });
      if (t.pilotOffEpoch == null) throw new Error('no pilot-off at ' + n.name);
    }
  });
  T('every berth routes both ways', () => {
    for (const n of selectablePoints()) {
      if (n.type === 'PILOT_STATION') continue;
      if (!(buildLegs(n.id, PILOT_ID).totalNm > 0)) throw new Error('no route out of ' + n.id);
      if (!(buildLegs(PILOT_ID, n.id).totalNm > 0)) throw new Error('no route in to ' + n.id);
    }
  });
  T('let go offset applied', () => {
    const t = solveTransit({ fromId: 'BT4', toId: PILOT_ID, sailEpoch: sail, applyCurrent: false });
    eq(t.underwayEpoch - t.sailEpoch, CHANNEL.letGoMinutes * MIN);
  });
  T('speed override honoured', () => {
    const t = solveTransit({ fromId: 'BT4', toId: PILOT_ID, sailEpoch: sail, applyCurrent: false, speedOverride: 10 });
    near((t.arrivalEpoch - t.underwayEpoch) / HOUR, buildLegs('BT4', PILOT_ID).totalNm / 10, 0.01);
  });
  T('ebb helps outbound', () => {
    const a = solveTransit({ fromId: 'BT4', toId: PILOT_ID, sailEpoch: sail, applyCurrent: false });
    const b = solveTransit({ fromId: 'BT4', toId: PILOT_ID, sailEpoch: sail, currentAt: () => ({ signedKts: -1.5 }) });
    if (b.arrivalEpoch >= a.arrivalEpoch) throw new Error('sign inverted');
  });
  T('ebb hinders inbound', () => {
    const a = solveTransit({ fromId: PILOT_ID, toId: 'BT4', sailEpoch: sail, applyCurrent: false });
    const b = solveTransit({ fromId: PILOT_ID, toId: 'BT4', sailEpoch: sail, currentAt: () => ({ signedKts: -1.5 }) });
    if (b.arrivalEpoch <= a.arrivalEpoch) throw new Error('sign inverted');
  });
  T('iterative solve converges', () => {
    const t = solveTransit({
      fromId: 'BT4', toId: PILOT_ID, sailEpoch: sail,
      currentAt: (s, tm) => ({ signedKts: 1.8 * Math.sin((tm - sail) / (6.21 * HOUR) * Math.PI) })
    });
    if (!t.converged) throw new Error('no convergence');
  });
  T('ETAs monotonic', () => {
    const t = solveTransit({
      fromId: 'BT4', toId: PILOT_ID, sailEpoch: sail,
      currentAt: (s, tm) => ({ signedKts: 1.8 * Math.sin((tm - sail) / (6.21 * HOUR) * Math.PI) })
    });
    for (let i = 1; i < t.etas.length; i++) if (t.etas[i] <= t.etas[i - 1]) throw new Error('backwards at ' + i);
  });
  T('series returns null outside coverage', () => {
    const s = [{ t: sail, h: 1 }, { t: sail + HOUR, h: 2 }];
    if (sampleSeries(s, sail - HOUR) !== null) throw new Error('extrapolated');
  });
  T('light ship beats loaded', () => {
    const a = solveTransit({ fromId: 'BT4', toId: PILOT_ID, sailEpoch: sail, applyCurrent: false, condition: LOADED });
    const b = solveTransit({ fromId: 'BT4', toId: PILOT_ID, sailEpoch: sail, applyCurrent: false, condition: LIGHT });
    if (b.arrivalEpoch >= a.arrivalEpoch) throw new Error('light not faster');
  });
  T('outer bar speeds match the table', () => {
    const l = buildLegs('BT4', PILOT_ID).legs.find(x => x.zone === 'Outer bar');
    eq(l.speedLoaded, 11.8); eq(l.speedLight, 13.0);
  });
  T('every leg has a zone and both speeds', () => {
    for (const l of buildLegs('BT4', PILOT_ID).legs)
      if (!l.zone || l.speedLoaded == null || l.speedLight == null) throw new Error('missing at ' + l.from.id);
  });
  T('lee: seas 145 heading 205 -> starboard', () => {
    const r = recommendLadder({
      seas: { dir: dir(145, FROM), heightFt: 4.2 },
      swell: { dir: dir(135, FROM), heightFt: 2.5 },
      wind: { dir: dir(150, FROM), speedKts: 20 }, baseCourse: 200
    });
    eq(r.heading, 205); eq(r.relativeAngle, -60); eq(r.side, 'STARBOARD');
  });
  T('lee: mirrored case -> port', () => {
    const r = recommendLadder({
      seas: { dir: dir(145, FROM), heightFt: 4.2 },
      swell: { dir: dir(145, FROM), heightFt: 2.0 },
      wind: { dir: dir(145, FROM), speedKts: 18 }, baseCourse: 85
    });
    eq(r.side, 'PORT');
  });
  T('lee: 350/010 wraparound', () => {
    const r = recommendLadder({
      seas: { dir: dir(355, FROM), heightFt: 4 },
      swell: { dir: dir(350, FROM), heightFt: 2 },
      wind: { dir: dir(0, FROM), speedKts: 15 }, baseCourse: 60
    });
    eq(r.heading, 55); eq(r.side, 'STARBOARD');
  });
  T('lee: opposed drivers force review', () => {
    const r = recommendLadder({
      seas: { dir: dir(150, FROM), heightFt: 3 },
      swell: { dir: dir(340, FROM), heightFt: 2 },
      wind: { dir: dir(150, FROM), speedKts: 18 }, baseCourse: 200
    });
    eq(r.status, 'MIXED');
  });
  T('lee: no data is not a guess', () => eq(recommendLadder({ baseCourse: 200 }).status, 'NO_DATA'));
  T('lee: every relative angle defined', () => {
    for (let a = -180; a <= 180; a++) {
      const s = leeFromRelative(a).side;
      if (s !== 'PORT' && s !== 'STARBOARD' && s !== null) throw new Error('undefined at ' + a);
    }
  });

  lines.push({ text: '' });
  lines.push({ ok: f === 0, text: `${p} passed, ${f} failed` });
  return lines;
}

/* =========================================================================
   UNDERWAY
   Live position matched to the planned transit. Foreground only: iOS suspends
   JavaScript when the app is backgrounded or the screen locks, so this cannot
   run as a background logger and does not pretend to.
   ======================================================================= */

const Underway = {
  watchId: null, fixes: [], last: null, snap: null, revision: null,
  error: null, legSamples: {},

  get active() { return this.watchId != null; },

  start(onUpdate) {
    if (!navigator.geolocation) { this.error = 'This device has no location service.'; onUpdate(); return; }
    this.error = null;
    this.watchId = navigator.geolocation.watchPosition(
      pos => { this.onFix(pos); onUpdate(); },
      err => {
        this.error = err.code === 1 ? 'Location permission denied.'
                   : err.code === 3 ? 'No fix yet — waiting for GPS.'
                   : 'Location unavailable: ' + err.message;
        onUpdate();
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  },

  stop() {
    if (this.watchId != null) navigator.geolocation.clearWatch(this.watchId);
    this.watchId = null;
  },

  reset() { this.stop(); this.fixes = []; this.last = null; this.snap = null;
            this.revision = null; this.error = null; this.legSamples = {}; },

  onFix(pos) {
    const fix = {
      lat: pos.coords.latitude, lon: pos.coords.longitude,
      t: pos.timestamp || Date.now(),
      accuracyM: pos.coords.accuracy,
      deviceSog: pos.coords.speed != null ? pos.coords.speed * 1.94384 : null
    };
    // Discard fixes too poor to be useful rather than letting them jitter the plan.
    if (fix.accuracyM != null && fix.accuracyM > 100) { this.error = 'Weak GPS fix (' + Math.round(fix.accuracyM) + ' m).'; return; }
    this.error = null;
    this.fixes.push(fix);
    if (this.fixes.length > 2000) this.fixes.shift();

    const prev = this.last;
    this.last = fix;
    if (!LAST) return;

    const snap = snapToRoute(LAST.transit, fix.lat, fix.lon, 1.0);
    this.snap = snap;
    if (!snap || snap.offRoute) { this.revision = null; return; }

    // Speed made good, preferring the device value when it is available.
    let sog = fix.deviceSog;
    if (sog == null) sog = speedBetween(prev, fix);
    fix.sog = sog;

    // Record observed speed against the reach being run, for later comparison
    // with the planned table.
    if (sog != null && sog > 0.5 && snap.leg && snap.leg.zone) {
      const key = snap.leg.zone + '|' + (LAST.transit.condition || 'LOADED');
      (this.legSamples[key] = this.legSamples[key] || []).push(sog);
    }

    this.revision = reviseTransit(LAST.transit, snap, fix.t, {
      observedSog: sog, speedOverride: LAST.input.speedOverride,
      currentAt: LAST.currentAt
    });
  },

  /** Median observed speed per reach — median, because a couple of fixes taken
      while swinging or stopped would drag a mean badly. */
  observedByZone() {
    const out = [];
    for (const [key, arr] of Object.entries(this.legSamples)) {
      if (arr.length < 5) continue;
      const sorted = arr.slice().sort((a, b) => a - b);
      out.push({ zone: key.split('|')[0], condition: key.split('|')[1],
                 median: sorted[Math.floor(sorted.length / 2)], n: arr.length });
    }
    return out.sort((a, b) => a.zone.localeCompare(b.zone));
  },

  saveLog() {
    if (!LAST || !this.fixes.length) return null;
    const log = {
      when: LAST.transit.sailEpoch,
      from: LAST.transit.waypoints[0].point.name,
      to: LAST.transit.waypoints[LAST.transit.waypoints.length - 1].point.name,
      condition: LAST.transit.condition,
      plannedEnd: LAST.transit.endEpoch,
      actualEnd: this.last ? this.last.t : null,
      observed: this.observedByZone()
    };
    const logs = Store.get('transitLogs', []);
    logs.push(log);
    Store.set('transitLogs', logs.slice(-40));
    return log;
  }
};

/* Manual checkpoint correction. Not tracking: the pilot says where he is, the
   app takes the clock, and everything ahead is re-solved from that point. */
function renderCheckpoints() {
  const box = $('#cpBox');
  if (!box || !LAST) return;
  const t = LAST.transit, tz = LAST.tz;
  const anchors = Store.get('anchors', []);

  // Only checkpoints on this route, in the order the ship meets them.
  const onRoute = CHECKPOINTS
    .map(c => ({ ...c, w: t.waypoints.find(w => w.point.id === c.id) }))
    .filter(c => c.w);
  const ordered = onRoute.sort((a, b) => t.waypoints.indexOf(a.w) - t.waypoints.indexOf(b.w));
  const lastAnchorIdx = anchors.length
    ? t.waypoints.findIndex(w => w.point.id === anchors[anchors.length - 1].nodeId) : -1;
  const ahead = ordered.filter(c => t.waypoints.indexOf(c.w) > lastAnchorIdx);

  const done = anchors.map(a => {
    const w = t.waypoints.find(x => x.point.id === a.nodeId);
    const c = CHECKPOINTS.find(x => x.id === a.nodeId);
    if (!w || !c) return '';
    return `<div class="uline"><span class="k">${esc(c.label)}</span>
      <span class="v num">${fmtClock(a.epoch, tz)}
        <span style="font-size:11px;color:var(--faint);font-weight:400"> actual · plan ${fmtClock(w.originalEta, tz)}</span></span></div>`;
  }).join('');

  if (!ahead.length) {
    box.innerHTML = `${done}<p style="font-size:12px;color:var(--faint);margin:8px 0 0;line-height:1.5">
      No checkpoints remaining ahead of the last update.</p>
      ${anchors.length ? '<button class="btn" id="cpClear" style="margin-top:10px">Clear updates</button>' : ''}`;
    if ($('#cpClear')) $('#cpClear').addEventListener('click', clearAnchors);
    return;
  }

  const sel = CP.pending || ahead[0].id;
  const now = Date.now();
  box.innerHTML = `${done}
    <div class="field" style="margin:${done ? '10px' : '0'} 0 10px">
      <select class="control" id="cpSel">${ahead.map(c =>
        `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(c.label)} · plan ${fmtClock(c.w.eta, tz)}</option>`).join('')}</select>
    </div>
    <div class="uline"><span class="k">Passing now</span><span class="v num">${fmtClock(now, tz)}</span></div>
    <p style="font-size:12.5px;color:var(--dim);margin:10px 0 0;line-height:1.5">
      Update timeline from ${esc((CHECKPOINTS.find(c => c.id === sel) || {}).label)} at ${fmtClock(now, tz)}?</p>
    <button class="generate" id="cpGo" style="margin-top:10px;padding:15px">Update</button>
    ${anchors.length ? '<button class="btn" id="cpClear" style="margin-top:8px">Clear updates</button>' : ''}
    <p style="font-size:11.5px;color:var(--faint);margin:8px 0 0;line-height:1.5">
      Everything ahead is recalculated from this point — ETAs, fog, wind, tide, current,
      the finish time and the ladder. Points already passed keep their times.</p>`;

  $('#cpSel').addEventListener('change', e => { CP.pending = e.target.value; renderCheckpoints(); });
  $('#cpGo').addEventListener('click', () => applyCheckpoint($('#cpSel').value));
  if ($('#cpClear')) $('#cpClear').addEventListener('click', clearAnchors);
}

const CP = { pending: null, busy: false };

async function rebuildWithAnchors(anchors) {
  const saved = Store.get('lastBrief', null);
  const src = saved || { fromId: LAST.transit.waypoints[0].point.id,
                         toId: LAST.transit.waypoints[LAST.transit.waypoints.length - 1].point.id,
                         sailEpoch: LAST.transit.sailEpoch,
                         condition: LAST.transit.condition, speedOverride: '', vessel: '' };
  LAST = await buildBrief({
    fromId: src.fromId, toId: src.toId, sailEpoch: src.sailEpoch, anchors,
    condition: src.condition === 'LIGHT' ? LIGHT : LOADED,
    speedOverride: parseFloat(src.speedOverride) > 0 ? parseFloat(src.speedOverride) : null,
    vessel: src.vessel
  });
  renderBrief(LAST);
  // Fog is derived from ETAs, so force it to rebuild against the new timeline.
  FOG.builtFor = null;
}

async function applyCheckpoint(nodeId) {
  if (CP.busy) return;
  CP.busy = true;
  const btn = $('#cpGo');
  if (btn) { btn.textContent = 'Updating…'; btn.disabled = true; }
  try {
    const anchors = Store.get('anchors', []).filter(a => a.nodeId !== nodeId);
    anchors.push({ nodeId, epoch: Date.now() });
    // keep them in the order the ship meets them
    const order = LAST.transit.waypoints.map(w => w.point.id);
    anchors.sort((a, b) => order.indexOf(a.nodeId) - order.indexOf(b.nodeId));
    Store.set('anchors', anchors);
    CP.pending = null;
    await rebuildWithAnchors(anchors);
  } catch (e) {
    if (btn) { btn.textContent = 'Failed: ' + (e.message || e); btn.disabled = false; }
  }
  CP.busy = false;
}

async function clearAnchors() {
  Store.set('anchors', []);
  CP.pending = null;
  await rebuildWithAnchors([]);
}

function renderUnderway() {
  const el = $('#underway');
  if (!el) return;
  const U = Underway, tz = LAST ? LAST.tz : TZ();

  if (!U.active) {
    el.innerHTML = `<button class="btn" id="uStart">Start tracking</button>
      <p style="font-size:12px;color:var(--faint);margin:2px 0 0;line-height:1.5">
        Matches your position to this plan and revises the pilot-off time. Needs the
        app open and on screen — iOS stops it when backgrounded.</p>`;
    $('#uStart').addEventListener('click', () => { U.start(renderUnderway); renderUnderway(); });
    return;
  }

  const r = U.revision, sn = U.snap, f = U.last;
  let body;
  if (U.error) {
    body = `<div class="uline"><span class="k">Status</span><span class="v" style="color:var(--caution)">${esc(U.error)}</span></div>`;
  } else if (!f) {
    body = `<div class="uline"><span class="k">Status</span><span class="v">Waiting for a fix…</span></div>`;
  } else if (!sn || sn.offRoute) {
    body = `<div class="uline"><span class="k">Position</span><span class="v" style="color:var(--caution)">Off the planned route${sn ? ' by ' + sn.offNm.toFixed(1) + ' nm' : ''}</span></div>
      <div class="uline"><span class="k">Fix</span><span class="v num">${f.lat.toFixed(4)}, ${f.lon.toFixed(4)}</span></div>`;
  } else {
    const late = r ? r.deltaMs : 0;
    const lateTxt = Math.abs(late) < 90000 ? 'on plan'
      : (late > 0 ? fmtDuration(late) + ' late' : fmtDuration(-late) + ' early');
    body = `
      <div class="uline"><span class="k">Position</span><span class="v">${esc(sn.leg.from.name)} → ${esc(sn.leg.to.name)}</span></div>
      <div class="uline"><span class="k">Run / to run</span><span class="v num">${sn.alongNm.toFixed(1)} / ${sn.remainingNm.toFixed(1)} nm</span></div>
      <div class="uline"><span class="k">Speed</span><span class="v num">${f.sog != null ? f.sog.toFixed(1) + ' kt' : '—'}${sn.leg.zone ? ` <span style="color:var(--faint);font-size:12px">plan ${sn.leg.defaultSpeed}</span>` : ''}</span></div>
      <div class="uline"><span class="k">Off track</span><span class="v num">${(sn.offNm * 1852).toFixed(0)} m</span></div>
      ${r ? `<div class="uline"><span class="k">Pilot off</span><span class="v num" style="color:${Math.abs(late) < 90000 ? 'var(--stbd)' : 'var(--caution)'}">${fmtClock(r.endEpoch, tz)} <span style="font-size:12px">${esc(lateTxt)}</span></span></div>` : ''}
      <div class="uline"><span class="k">Next</span><span class="v">${r && r.etas[0] ? esc(r.etas[0].point.name) + ' ' + fmtClock(r.etas[0].eta, tz) : '—'}</span></div>`;
  }

  el.innerHTML = `${body}
    <div style="margin-top:12px">
      <button class="btn" id="uStop">Stop</button>
      <button class="btn" id="uSave">Save log</button>
    </div>
    <div id="uMsg" style="font-size:12px;color:var(--dim);margin-top:2px"></div>`;
  $('#uStop').addEventListener('click', () => { U.stop(); renderUnderway(); });
  $('#uSave').addEventListener('click', () => {
    const log = U.saveLog();
    $('#uMsg').textContent = log
      ? `Saved. ${log.observed.length} reach${log.observed.length === 1 ? '' : 'es'} with enough fixes to compare.`
      : 'Nothing to save yet.';
  });
}

/* =========================================================================
   TIDES & CURRENTS
   Station-level NOAA predictions, presented the way the pilot reads them:
   the events table, the curve, and an answer for one exact moment.
   Values here are per-station and unblended — this tab is the raw NOAA view.
   The transit brief is where interpolation between stations happens.
   ======================================================================= */

const TC = {
  stationId: null, kind: 'tide', date: null,
  packs: {}, loading: false, error: null,
  calc: { time: '', result: null }
};

function tcStations(kind) {
  return gaugeChain().filter(g => g[kind === 'tide' ? 'tide' : 'current']);
}

function tcDefaultDate() {
  const p = {};
  for (const part of new Intl.DateTimeFormat('en-CA', { timeZone: TZ(),
      year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date()))
    if (part.type !== 'literal') p[part.type] = part.value;
  return `${p.year}-${p.month}-${p.day}`;
}

async function tcLoad() {
  const kind = TC.kind;
  const g = tcStations(kind).find(x => x.id === TC.stationId);
  if (!g) { TC.error = 'No station selected.'; return; }
  const [y, m, d] = TC.date.split('-').map(Number);
  const start = wallToEpoch(y, m, d, 0, 0, TZ());
  const win = { start: start - 6 * HOUR, end: start + 30 * HOUR };
  const key = kind + '|' + g.id + '|' + TC.date;
  if (TC.packs[key]) return;
  TC.loading = true; TC.error = null;
  try {
    TC.packs[key] = await providers()[kind].load(g.id, win, g, g);
  } catch (e) {
    TC.error = String(e.message || e);
    TC.packs[key] = null;
  }
  TC.loading = false;
}

function tcPack() { return TC.packs[TC.kind + '|' + TC.stationId + '|' + TC.date]; }

function tcDayWindow() {
  const [y, m, d] = TC.date.split('-').map(Number);
  const start = wallToEpoch(y, m, d, 0, 0, TZ());
  return { start, end: start + 24 * HOUR };
}

/* ---- events ---- */
function tideEventsForDay(pack, win) {
  if (!pack) return [];
  return findTurns(pack.series, 'heightFt', win).map(e => ({
    t: e.t, label: e.kind === 'HIGH' ? 'High' : 'Low',
    value: e.heightFt, unit: 'ft', cls: ''
  }));
}

function currentEventsForDay(pack, win) {
  if (!pack) return [];
  const out = [];
  const s = pack.series;
  for (const sl of findSlacks(s, win))
    out.push({ t: sl.t, label: sl.becoming === 'FLOOD' ? 'Slack before flood' : 'Slack before ebb',
               value: 0, unit: 'kt', cls: 'slack' });
  // Local maxima and minima, not just the single strongest of the day.
  for (let i = 1; i < s.length - 1; i++) {
    const p = s[i - 1].signedKts, c = s[i].signedKts, n = s[i + 1].signedKts;
    if (p == null || c == null || n == null) continue;
    if (s[i].t < win.start || s[i].t > win.end) continue;
    if (c > 0 && c >= p && c >= n && c > 0.1)
      out.push({ t: s[i].t, label: 'Max flood', value: c, unit: 'kt', cls: 'flood' });
    if (c < 0 && c <= p && c <= n && c < -0.1)
      out.push({ t: s[i].t, label: 'Max ebb', value: c, unit: 'kt', cls: 'ebb' });
  }
  return out.sort((a, b) => a.t - b.t);
}

/* ---- graph ---- */
function tcGraph(pack, win, field, opts) {
  if (!pack || !pack.series.length) return '';
  const pts = pack.series.filter(r => r.t >= win.start - HOUR && r.t <= win.end + HOUR && r[field] != null);
  if (pts.length < 2) return '';
  const W = 600, H = 150, PAD = 22;
  const vals = pts.map(p => p[field]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (opts.zeroLine) { const m = Math.max(Math.abs(lo), Math.abs(hi)); lo = -m; hi = m; }
  const pad = (hi - lo) * 0.12 || 0.5;
  lo -= pad; hi += pad;
  const x = t => PAD + (t - win.start) / (win.end - win.start) * (W - 2 * PAD);
  const y = v => H - PAD - (v - lo) / (hi - lo) * (H - 2 * PAD);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.t).toFixed(1)},${y(p[field]).toFixed(1)}`).join('');

  let bands = '';
  if (opts.zeroLine) {
    // shade flood above the zero line, ebb below, so the two read apart at a glance
    const y0 = y(0);
    bands = `<path d="${path}L${x(pts[pts.length-1].t).toFixed(1)},${y0.toFixed(1)}L${x(pts[0].t).toFixed(1)},${y0.toFixed(1)}Z"
      fill="url(#fe)" opacity=".18"/>
      <line x1="${PAD}" y1="${y0}" x2="${W-PAD}" y2="${y0}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="${W-PAD}" y="${y0-5}" fill="var(--faint)" font-size="10" text-anchor="end">slack</text>`;
  }

  const ticks = [];
  for (let h = 0; h <= 24; h += 6) {
    const t = win.start + h * HOUR;
    ticks.push(`<line x1="${x(t)}" y1="${PAD-6}" x2="${x(t)}" y2="${H-PAD}" stroke="var(--line-soft)"/>
      <text x="${x(t)}" y="${H-6}" fill="var(--faint)" font-size="10" text-anchor="middle">${fmtClock(t, TZ())}</text>`);
  }

  const now = Date.now();
  const nowLine = (now >= win.start && now <= win.end)
    ? `<line x1="${x(now)}" y1="${PAD-6}" x2="${x(now)}" y2="${H-PAD}" stroke="var(--info)" stroke-width="1.5"/>
       <text x="${x(now)+4}" y="${PAD+2}" fill="var(--info)" font-size="10">now</text>` : '';

  const marks = (opts.events || []).filter(e => e.t >= win.start && e.t <= win.end).map(e => {
    const v = opts.zeroLine ? e.value : e.value;
    return `<circle cx="${x(e.t).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3"
      fill="${e.cls === 'ebb' ? 'var(--port)' : e.cls === 'flood' ? 'var(--stbd)' : 'var(--ink)'}"/>`;
  }).join('');

  const sel = opts.markTime && opts.markTime >= win.start && opts.markTime <= win.end
    ? `<line x1="${x(opts.markTime)}" y1="${PAD-6}" x2="${x(opts.markTime)}" y2="${H-PAD}"
        stroke="var(--caution)" stroke-width="1.5" stroke-dasharray="4 3"/>` : '';

  return `<svg class="tcgraph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="fe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--stbd)"/><stop offset="100%" stop-color="var(--port)"/>
    </linearGradient></defs>
    ${ticks.join('')}${bands}
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>
    ${marks}${nowLine}${sel}
  </svg>`;
}

/* ---- exact-time answer ---- */
function tcCalculate(pack, kind, epoch) {
  if (!pack) return null;
  const s = sampleSeries(pack.series, epoch);
  if (!s) return { outside: true };
  const field = kind === 'tide' ? 'heightFt' : 'signedKts';
  const value = lerpNum(s.a[field], s.b ? s.b[field] : null, s.f);

  // Trend from the local gradient rather than from the nearest extreme, so a
  // moment just past a turn reads correctly.
  const step = 15 * MIN;
  const before = sampleSeries(pack.series, epoch - step);
  const after = sampleSeries(pack.series, epoch + step);
  const vb = before ? lerpNum(before.a[field], before.b ? before.b[field] : null, before.f) : null;
  const va = after ? lerpNum(after.a[field], after.b ? after.b[field] : null, after.f) : null;
  let trend = 'steady';
  if (vb != null && va != null) {
    const d = va - vb;
    if (kind === 'tide') trend = Math.abs(d) < 0.02 ? 'near slack water' : (d > 0 ? 'rising' : 'falling');
    else {
      const mag = Math.abs(va) - Math.abs(vb);
      trend = Math.abs(value) < 0.1 ? 'slack' : (mag > 0 ? 'increasing' : 'decreasing');
    }
  }

  const wide = { start: epoch - 18 * HOUR, end: epoch + 18 * HOUR };
  const events = kind === 'tide'
    ? tideEventsForDay(pack, wide) : currentEventsForDay(pack, wide);
  const prev = events.filter(e => e.t <= epoch).pop() || null;
  const next = events.find(e => e.t > epoch) || null;

  let peak = null;
  if (kind === 'current' && next) {
    const upcoming = events.filter(e => e.t > epoch && e.label.startsWith('Max'));
    peak = upcoming[0] || null;
  }
  return { value, trend, prev, next, peak, epoch, station: pack.source };
}

function tcDescribeCurrent(v) {
  if (v == null) return '—';
  if (Math.abs(v) < 0.1) return 'SLACK';
  return `${Math.abs(v).toFixed(1)} kt ${v > 0 ? 'FLOOD' : 'EBB'}`;
}

async function renderTides() {
  const kind = TC.kind;
  if (!TC.date) TC.date = tcDefaultDate();
  const list = tcStations(kind);
  if (!list.length) {
    $('#viewTides').innerHTML = `<p class="eyebrow">Tides &amp; Currents</p>
      <div class="mockbar"><b>No stations</b><br>No ${kind} station is configured.</div>`;
    return;
  }
  if (!TC.stationId || !list.some(g => g.id === TC.stationId)) TC.stationId = list[0].id;

  $('#viewTides').innerHTML = `<p class="eyebrow">Tides &amp; Currents</p>
    <div class="uw">Loading NOAA predictions…</div>`;
  await tcLoad();

  const g = list.find(x => x.id === TC.stationId);
  const pack = tcPack();
  const win = tcDayWindow();
  const events = pack ? (kind === 'tide' ? tideEventsForDay(pack, win) : currentEventsForDay(pack, win)) : [];
  const stationCode = kind === 'tide' ? g.tide : g.current;

  const rows = events.length ? events.map(e => `<div class="tcrow">
      <span class="tm">${fmtClock(e.t, TZ())}</span>
      <span class="ev ${e.cls}">${esc(e.label)}</span>
      <span class="vl ${e.cls}">${kind === 'tide'
        ? (e.value >= 0 ? '+' : '') + e.value.toFixed(2) + ' ft'
        : (e.cls === 'slack' ? '0.0 kt' : (e.value > 0 ? '+' : '') + e.value.toFixed(1) + ' kt')}</span>
    </div>`).join('')
    : `<p class="gapnote">${TC.error ? 'Data unavailable — ' + esc(TC.error) : 'No events for this day.'}</p>`;

  const calcTime = TC.calc.time || '12:00';
  const [ch, cm] = calcTime.split(':').map(Number);
  const [cy, cmo, cd] = TC.date.split('-').map(Number);
  const calcEpoch = wallToEpoch(cy, cmo, cd, ch || 0, cm || 0, TZ());
  const res = pack ? tcCalculate(pack, kind, calcEpoch) : null;

  const untilTxt = t => {
    const d = t - calcEpoch;
    return d > 0 ? fmtDuration(d) : '—';
  };

  $('#viewTides').innerHTML = `
    <div class="seg" style="margin-bottom:14px">
      <button type="button" data-k="tide"${kind === 'tide' ? ' class="on"' : ''}>Tides</button>
      <button type="button" data-k="current"${kind === 'current' ? ' class="on"' : ''}>Currents</button>
    </div>

    <div class="field"><label for="tcStation">Station</label>
      <select class="control" id="tcStation">${list.map(x =>
        `<option value="${x.id}"${x.id === TC.stationId ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="tcDate">Date</label>
      <input class="control" type="date" id="tcDate" value="${esc(TC.date)}"></div>

    <div class="stationmeta">
      NOAA station <b style="color:var(--ink)">${esc(String(stationCode))}</b> ·
      ${g.lat.toFixed(4)}, ${g.lon.toFixed(4)} ·
      ${kind === 'tide' ? 'water level, predicted, MLLW' : 'current, predicted'} ·
      ${g.chainNm.toFixed(1)} nm along the channel<br>
      ${pack ? `Source: ${esc(pack.source)} · retrieved ${fmtClock(pack.retrieved, TZ())}
        <span class="badge ${pack.quality === 'MOCK' ? 'mock' : pack.quality === 'CACHED' ? 'stale' : 'gap'}">${esc(pack.quality)}</span>`
        : '<span class="badge stale">DATA UNAVAILABLE</span>'}<br>
      All times ${esc(TZ().split('/')[1].replace('_', ' '))} local.
    </div>

    ${pack ? tcGraph(pack, win, kind === 'tide' ? 'heightFt' : 'signedKts',
        { zeroLine: kind === 'current', events, markTime: calcEpoch }) : ''}

    <div class="rule"></div>
    <p class="eyebrow">${kind === 'tide' ? 'Tide predictions' : 'Current predictions'}</p>
    ${rows}

    <div class="rule"></div>
    <p class="eyebrow">Tide &amp; current calculator</p>
    <div class="calcbox">
      <div class="field" style="margin-bottom:0"><label for="tcTime">Time on ${esc(TC.date)}</label>
        <input class="control" type="time" id="tcTime" value="${esc(calcTime)}"></div>
      ${!res ? '<p class="gapnote" style="margin-top:12px">Data unavailable.</p>'
       : res.outside ? '<p class="gapnote" style="margin-top:12px">Outside the predicted range for this station.</p>'
       : `<div class="calcres">
        <div class="cell"><div class="k">${kind === 'tide' ? 'Height' : 'Current'}</div>
          <div class="v">${kind === 'tide'
            ? (res.value >= 0 ? '+' : '') + res.value.toFixed(2) + ' ft'
            : tcDescribeCurrent(res.value)}</div>
          <div class="s">${kind === 'tide' ? 'MLLW' : 'positive = flood, upriver'}</div></div>
        <div class="cell"><div class="k">Trend</div>
          <div class="v" style="font-size:17px">${esc(res.trend.toUpperCase())}</div>
          <div class="s">at ${fmtClock(calcEpoch, TZ())}</div></div>
        <div class="cell"><div class="k">Previous</div>
          <div class="v" style="font-size:16px">${res.prev ? fmtClock(res.prev.t, TZ()) : '—'}</div>
          <div class="s">${res.prev ? esc(res.prev.label) + ' ' + (kind === 'tide'
            ? res.prev.value.toFixed(2) + ' ft' : Math.abs(res.prev.value).toFixed(1) + ' kt') : 'none in range'}</div></div>
        <div class="cell"><div class="k">Next</div>
          <div class="v" style="font-size:16px">${res.next ? fmtClock(res.next.t, TZ()) : '—'}</div>
          <div class="s">${res.next ? esc(res.next.label) + ' · in ' + untilTxt(res.next.t) : 'none in range'}</div></div>
        ${res.peak ? `<div class="cell wide"><div class="k">Next maximum</div>
          <div class="v" style="font-size:17px">${Math.abs(res.peak.value).toFixed(1)} kt ${res.peak.value > 0 ? 'flood' : 'ebb'}</div>
          <div class="s">${fmtClock(res.peak.t, TZ())} · in ${untilTxt(res.peak.t)}</div></div>` : ''}
      </div>`}
    </div>

    <div class="foot">
      Predictions from NOAA CO-OPS for this station only — no blending between stations
      on this tab. The transit brief interpolates between gauges and will differ slightly
      away from a station.<br><br>
      Decision support only. Verify against official sources.
    </div>`;

  document.querySelectorAll('#viewTides .seg button').forEach(b =>
    b.addEventListener('click', () => { TC.kind = b.dataset.k; TC.stationId = null; renderTides(); }));
  $('#tcStation').addEventListener('change', e => { TC.stationId = e.target.value; renderTides(); });
  $('#tcDate').addEventListener('change', e => { TC.date = e.target.value; renderTides(); });
  $('#tcTime').addEventListener('change', e => { TC.calc.time = e.target.value; renderTides(); });
}

/* =========================================================================
   FOG VIEW
   ======================================================================= */

const FOG = { grid: null, rows: null, prog: null, metars: null, obs: null,
              offsetH: 0, loading: false, error: null, builtFor: null };

function corridorStrip(grid, t, tz) {
  if (!grid) return '';
  /* Sample points follow the direction of travel, so an outbound transit runs
     down-channel. The corridor is always drawn seaward on the left, so sort by
     chainage rather than trusting route order. */
  const order = grid.points.map((p, i) => ({ p, i })).sort((a, b) => a.p.chainNm - b.p.chainNm);
  const pts = order.map(o => o.p);
  const idxOf = k => order[k].i;
  const W = 620, H = 74, PAD = 30;
  const lo = pts[0].chainNm, hi = pts[pts.length - 1].chainNm;
  const span = hi - lo || 1;
  const x = c => PAD + ((c - lo) / span) * (W - 2 * PAD);

  // A band per sample point, coloured by forecast visibility at this instant.
  const cells = pts.map((p, k) => {
    const i = idxOf(k);
    const v = grid.valueAt(grid.primary, i, t);
    const lv = visLevel(v);
    const fill = lv.cls === 'port' ? 'var(--port)' : lv.cls === 'caution' ? 'var(--caution)'
      : lv.cls === 'stbd' ? 'var(--stbd)' : 'var(--line)';
    const opacity = v == null ? 0.25 : Math.max(0.25, Math.min(1, 1.15 - v / 6));
    const prev = k ? pts[k - 1].chainNm : lo;
    const next = k < pts.length - 1 ? pts[k + 1].chainNm : hi;
    const x0 = x((prev + p.chainNm) / 2), x1 = x((p.chainNm + next) / 2);
    return `<rect x="${x0.toFixed(1)}" y="18" width="${Math.max(1, x1 - x0).toFixed(1)}" height="26"
      fill="${fill}" opacity="${opacity.toFixed(2)}"/>`;
  }).join('');

  const labels = pts.filter(p => p.named).map(p =>
    `<line x1="${x(p.chainNm).toFixed(1)}" y1="14" x2="${x(p.chainNm).toFixed(1)}" y2="48"
       stroke="var(--ink)" stroke-width="1" opacity=".5"/>
     <text x="${x(p.chainNm).toFixed(1)}" y="60" fill="var(--faint)" font-size="9"
       text-anchor="middle">${esc(p.name.slice(0, 12))}</text>`).join('');

  return `<svg class="corridor" viewBox="0 0 ${W} ${H}">
    <text x="${PAD}" y="11" fill="var(--faint)" font-size="9">seaward</text>
    <text x="${W - PAD}" y="11" fill="var(--faint)" font-size="9" text-anchor="end">Lake Charles</text>
    ${cells}${labels}
  </svg>`;
}

async function buildFog() {
  if (!LAST) { FOG.error = 'Generate a transit brief first — fog is analysed along your route.'; return; }
  const key = LAST.transit.sailEpoch + '|' + LAST.transit.waypoints[0].point.id + '|' +
              LAST.transit.waypoints[LAST.transit.waypoints.length - 1].point.id;
  if (FOG.builtFor === key && FOG.grid) return;
  FOG.loading = true; FOG.error = null;
  try {
    const t = LAST.transit;
    const points = fogSamplePoints(t);
    const win = { start: Math.min(Date.now(), t.underwayEpoch) - HOUR, end: t.endEpoch + 2 * HOUR };
    FOG.grid = await buildFogGrid(points, win);
    FOG.rows = fogDuringTransit(FOG.grid, LAST.tz);
    FOG.prog = fogProgression(FOG.grid, win, LAST.tz);
    FOG.worst = worstVisibility(FOG.rows, LAST.tz);
    FOG.agree = modelAgreement(FOG.rows);
    FOG.profile = fogTransitProfile(FOG.rows);
    FOG.disagree = modelDisagreements(FOG.rows);
    try {
      FOG.metars = await fetchMetarNear(METAR_BBOX);
      FOG.obs = compareObservations(FOG.metars, FOG.grid, Date.now());
      FOG.metarError = FOG.obs.length ? null : 'No station in the area is reporting visibility.';
    } catch (e) { FOG.metars = null; FOG.obs = null; FOG.metarError = String(e.message || e); }
    FOG.builtFor = key;
  } catch (e) {
    FOG.error = String(e.message || e);
    FOG.grid = null;
  }
  FOG.loading = false;
}

async function renderFog() {
  const host = $('#viewFog');
  host.innerHTML = `<p class="eyebrow">Fog &amp; visibility</p><div class="uw">Loading model visibility…</div>`;
  await buildFog();
  const tz = LAST ? LAST.tz : TZ();

  if (FOG.error || !FOG.grid) {
    host.innerHTML = `<p class="eyebrow">Fog &amp; visibility</p>
      <div class="mockbar"><b>Data unavailable</b><br>${esc(FOG.error || 'No visibility data.')}</div>`;
    return;
  }

  const g = FOG.grid, rows = FOG.rows, w = FOG.worst;
  const markT = Date.now() + FOG.offsetH * HOUR;

  const pr = FOG.profile;
  const ptLine = (label, r, cls) => r
    ? `<div class="fogrow"><span class="pl"><b>${esc(label)}</b><span>${esc(r.name)}</span></span>
        <span class="vv ${cls || ''}">${fmtClock(r.eta, tz)}<span class="tr">${r.nm.toFixed(1)} nm</span></span></div>`
    : `<div class="fogrow"><span class="pl"><b>${esc(label)}</b><span>not expected on this passage</span></span>
        <span class="vv lvl-gap">—</span></div>`;
  const exposure = th => {
    const band = th === 1 ? pr.below1 : th === 2 ? pr.below2 : pr.below5;
    return band.any
      ? `<div class="tcrow"><span class="ev">Below ${th} nm</span><span class="vl">${band.distanceNm.toFixed(1)} nm · ${fmtDuration(band.durationMs)}</span></div>`
      : `<div class="tcrow"><span class="ev">Below ${th} nm</span><span class="vl lvl-stbd">none</span></div>`;
  };
  const summary = pr ? `
    <div class="grid">
      <div class="cell wide"><div class="k">Worst expected during passage</div>
        <div class="v lvl-${visLevel(pr.worst.nm).cls}">${pr.worst.nm.toFixed(1)} nm · ${esc(visLevel(pr.worst.nm).label)}</div>
        <div class="s">${esc(pr.worst.name)} · ETA ${fmtClock(pr.worst.eta, tz)} · ${esc(pr.worst.trend)}${
          pr.worst.others.length ? ' · ' + pr.worst.others.map(o => esc(o.model) + ' ' + o.nm.toFixed(1) + ' nm').join(', ') : ''}</div></div>
    </div>
    ${ptLine('Enter below 5 nm', pr.below5.enter, 'lvl-caution')}
    ${ptLine('Enter below 2 nm', pr.below2.enter, 'lvl-caution')}
    ${ptLine('Enter dense fog, below 1 nm', pr.below1.enter, 'lvl-port')}
    ${ptLine('Above 1 nm again', pr.below1.exit, 'lvl-stbd')}
    ${ptLine('Above 2 nm again', pr.below2.exit, 'lvl-stbd')}
    <div style="margin-top:10px">${exposure(5)}${exposure(2)}${exposure(1)}</div>
    <p style="font-size:11.5px;color:var(--faint);margin:8px 0 0;line-height:1.5">
      Distance and time are measured along your route between sample points below each
      threshold. HRRR is primary; GFS is shown for comparison, never averaged in.</p>
    ${(FOG.disagree && FOG.disagree.length) ? `<div class="alert" style="margin-top:12px"><div class="bar"></div><div>
      <div class="t">Fog forecast uncertain</div>
      <div class="d">${FOG.disagree.slice(0, 3).map(d =>
        `At ${esc(d.point)}, ETA ${fmtClock(d.eta, tz)} — HRRR <b>${d.hrrr.toFixed(1)} nm</b>, ${esc(d.model)} <b>${d.other.toFixed(1)} nm</b>.`).join('<br>')}
        <br>The models disagree about whether there is fog here. Not averaged.</div></div></div>` : ''}`
    : '<p class="gapnote">No visibility values returned for this route.</p>';

  const progHtml = `<div class="mockbar" style="border-color:var(--line);background:var(--deck);color:var(--dim)">
    <b style="color:var(--ink)">Forecast fog progression</b><br>${esc(FOG.prog.statement)}
    <br><span style="font-size:11px;color:var(--faint)">Describes how the forecast visibility field evolves over successive model hours. Not observed fog-bank motion.</span></div>`;

  const transitHtml = rows.map(r => `<div class="fogrow">
      <span class="pl"><b>${esc(r.name)}</b><span>ETA ${fmtClock(r.eta, tz)}${r.others.length
        ? ' · ' + r.others.map(o => esc(o.model) + ' ' + o.nm.toFixed(1)).join(', ') : ''}</span></span>
      <span class="vv lvl-${r.level.cls}">${r.nm != null ? r.nm.toFixed(1) + ' nm' : 'n/a'}
        <span class="tr">${r.nm != null ? esc(r.level.label) + ' · ' + esc(r.trend) : 'data unavailable'}</span></span>
    </div>`).join('');

  const agreeHtml = FOG.agree ? `<div class="src">
      <span class="n">Model agreement<br><span style="color:var(--faint);font-size:11px">${esc(FOG.agree.why)}</span></span>
      <span class="st" style="font-size:14px;color:var(--ink)">${esc(FOG.agree.level)}</span>
    </div>` : '<p class="gapnote">Only one model published visibility here — no agreement to report.</p>';

  const obsHtml = (FOG.obs && FOG.obs.length) ? FOG.obs.slice(0, 5).map(o => `<div class="src">
      <span class="n">${esc(o.station)} — ${esc(o.name)}<br>
        <span style="color:var(--faint);font-size:11px">${o.distanceNm.toFixed(1)} nm from ${esc(o.nearestPoint)} · ${fmtDuration(o.ageMs)} old</span></span>
      <span class="st" style="font-size:13px;color:var(--ink);text-align:right">
        ${o.observed.toFixed(1)} nm observed
        <br><span style="font-size:11px;color:var(--faint)">${o.forecast != null ? 'HRRR valid then ' + o.forecast.toFixed(1) + ' nm' : 'no forecast at that time'}</span>
        ${o.verdict ? `<br><span style="font-size:11px;color:${o.tracking === 'good' ? 'var(--stbd)' : 'var(--caution)'}">${esc(o.verdict)}</span>` : ''}
      </span></div>`).join('')
    : `<p class="gapnote">${esc(FOG.metarError || 'No observations available.')}</p>`;
  const nearestObsNm = (FOG.obs && FOG.obs.length) ? FOG.obs[0].distanceNm : null;

  host.innerHTML = `
    <p class="eyebrow">Fog during transit</p>
    ${summary}

    <div class="rule"></div>
    <p class="eyebrow">Visibility at every route point</p>
    ${transitHtml}

    <div class="rule"></div>
    ${progHtml}

    <div class="rule"></div>
    <p class="eyebrow">Corridor at ${FOG.offsetH === 0 ? 'now' : '+' + FOG.offsetH + ' h'} · ${fmtClock(markT, tz)}</p>
    ${corridorStrip(g, markT, tz)}
    <div class="scrub" id="fogScrub">
      ${[0, 1, 2, 3, 6, 12].map(h =>
        `<button data-h="${h}"${h === FOG.offsetH ? ' class="on"' : ''}>${h === 0 ? 'NOW' : '+' + h + 'H'}</button>`).join('')}
    </div>
    <p style="font-size:11.5px;color:var(--faint);line-height:1.55;margin:6px 0 0">
      Red is dense fog under 1 nm, amber 1–5 nm, green above 5 nm. Grey means the model
      published no visibility for that point.</p>

    <div class="rule"></div>
    <p class="eyebrow">Forecast vs observed</p>
    ${obsHtml}
    <p style="font-size:11.5px;color:var(--faint);line-height:1.55;margin:10px 0 0">
      ${nearestObsNm != null && nearestObsNm > 10
        ? `Nearest visibility observation is ${nearestObsNm.toFixed(0)} nm from the route — it says little about conditions at that distance. `
        : ''}No station in the lower channel measures visibility: CAPL1 at Calcasieu Pass
      carries wind, temperature and pressure but no visibility sensor. Forecast visibility
      below Lake Charles is therefore unverified by any nearby observation.
      Discrepancies are reported, never used to adjust the model.</p>

    <div class="rule"></div>
    <p class="eyebrow">Models</p>
    ${agreeHtml}
    <div class="src"><span class="n">Sources</span>
      <span class="st" style="font-size:11px">${g.models.map(m => esc(m.name) + ' ' + esc(m.resolution)).join(' · ')}</span></div>

    <div class="foot">
      Visibility is a model field, not a measurement, except where an observation is
      shown above. Windy's Point Forecast API publishes no visibility parameter, so it
      cannot supply this; these are the raw HRRR and GFS fields Windy renders its own
      fog layer from.<br><br>
      Decision support only. Confirm against the GOES fog product and actual conditions:
      <a href="https://www.ospo.noaa.gov/products/atmosphere/clouds/fls/" style="color:var(--info)">satellite fog / low stratus</a>.
    </div>`;

  document.querySelectorAll('#fogScrub button').forEach(b => b.addEventListener('click', () => {
    FOG.offsetH = +b.dataset.h; renderFog();
  }));
}

/* ---------- navigation ---------- */
function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id));
  window.scrollTo(0, 0);
  $('#navBtn').textContent = id === 'viewAdmin' ? 'Close' : 'Setup';
  $('#tabs').classList.toggle('hide', id === 'viewAdmin');
  document.querySelectorAll('#tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === id ||
      (b.dataset.tab === 'viewPlan' && id === 'viewBrief')));
}

document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
  const id = b.dataset.tab;
  if (id === 'viewTides') { renderTides(); show('viewTides'); }
  else if (id === 'viewFog') { show('viewFog'); renderFog(); }
  else show(LAST ? 'viewBrief' : 'viewPlan');
}));
$('#navBtn').addEventListener('click', () => {
  if ($('#viewAdmin').classList.contains('on')) show('viewPlan');
  else { renderAdmin(); show('viewAdmin'); }
});

applySpeedOverrides();
$('#portname').textContent = CHANNEL.meta.name;
renderPlan();

/* A brief generated at the berth should still be there after the app is
   reopened at the sea buoy with no signal. Regenerating uses the cache, so
   this works offline; the banner reports whatever age the data has. */
(async function restoreLastBrief() {
  const saved = Store.get('lastBrief', null);
  if (!saved) return;
  const age = Date.now() - (saved.generatedAt || 0);
  if (age > 18 * HOUR) return;
  const bar = document.createElement('div');
  bar.className = 'mockbar';
  bar.style.cssText = 'border-color:var(--line);background:var(--deck);color:var(--dim)';
  const fromName = (() => { try { return pointById(saved.fromId).name; } catch (e) { return saved.fromId; } })();
  const toName = (() => { try { return pointById(saved.toId).name; } catch (e) { return saved.toId; } })();
  bar.innerHTML = `<b style="color:var(--ink)">Last brief</b><br>
    ${esc(fromName)} → ${esc(toName)}, sailed ${fmtClock(saved.sailEpoch, TZ())},
    built ${fmtDuration(age)} ago.
    <button class="btn" id="reopen" style="margin-top:10px">Reopen</button>`;
  const host = $('#viewPlan');
  host.insertBefore(bar, host.firstChild);
  $('#reopen').addEventListener('click', async () => {
    $('#reopen').textContent = 'Working…';
    try {
      LAST = await buildBrief({
        fromId: saved.fromId, toId: saved.toId, sailEpoch: saved.sailEpoch,
        condition: saved.condition === 'LIGHT' ? LIGHT : LOADED,
        speedOverride: parseFloat(saved.speedOverride) > 0 ? parseFloat(saved.speedOverride) : null,
        vessel: saved.vessel
      });
      Underway.reset();
      renderBrief(LAST); show('viewBrief');
    } catch (e) { $('#reopen').textContent = 'Failed: ' + (e.message || e); }
  });
})();

/* Offline shell. Registered only when served over http(s) — opening the file
   directly still works, just without the cached shell. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
